// ---- SSE 订阅 ----
/**
 * 建立事件订阅。只在"尚无订阅 且 run 未终态"时建立——旧实现把这个判断和
 * "是否已有 state"混在 selectRun 里，导致重新打开一个断过线的 run 不会重订阅。
 */
// ---- 事件批处理（V-10）----
// 调度细节见 core/batch.js（含"隐藏标签页 rAF 不触发"那个坑的处理）
/**
 * 文本流式的接收端（backlog §4）。
 *
 * 服务端 R2 起就在推 `event: delta` 命名通道，前端一直丢弃——直播条显示的是
 * 上一条【完整】assistant_text，不是逐字。（AC2-06 那次真机跑，一次约 90 秒的
 * 运行流了 1133 条 delta，全被扔掉。）
 *
 * 它**不进 RunState**：delta 不占 seq、不进服务端事件缓冲（V-15 的设计），
 * 重连重放时根本不存在。放进 state 会打破 reducer 的重放幂等性。所以按
 * connectionStates 的同款办法，由控制器单独持有、渲染时作为参数传入。
 *
 * @type {Map<string, string>}
 */
const liveTexts = new Map();
/** 思考增量缓冲。与 liveTexts 同族（不进 RunState），但分开存——正文一来就清掉它 */
const liveThinking = new Map();
function currentLiveBuffers(runId) {
  return {
    text: revealedSlice(runId, liveTexts.get(runId) ?? "", false),
    thinking: revealedSlice(runId, liveThinking.get(runId) ?? "", true),
  };
}
/**
 * 正文缓冲**不再截尾**（2026-09-04 委托方：超过约 2000 字就丢前面、只剩尾巴）。
 * 当年 LIVE_TEXT_CAP=2000 是为防长生成占内存；配合 revealedWindow 虽不冻屏，
 * 但可见内容仍是滑动窗口——正文被活生生砍头。正文全文进缓冲，内存远小于
 * 一次 run 的事件流；节拍器仍按 liveTotals 匀速放行。
 *
 * 思考缓冲同样**不截尾**（2026-09-07 委托方：点开思考后开头被删掉、只剩新文字）。
 * 「思考是瞬态所以可以砍头」的判断是错的——直播期间人正在读它。思考与正文
 * 两个缓冲都全文累加；截尾常量机制（LIVE_TEXT_CAP / LIVE_THINKING_CAP）整体退役。
 *（注意与 test/budget-extend.test.ts 的约定：正文截尾常量 LIVE_TEXT_CAP 已退役。）
 */
/** @type {Map<string, {think:number, text:number}>} */
const liveTotals = new Map();
const totalsOf = (runId) => liveTotals.get(runId) ?? { think: 0, text: 0 };

/**
 * delta 自己一个 batcher：它走的不是 reduce 那条路，但节流与"隐藏标签页
 * rAF 不触发"那个坑同样适用，所以复用同一个调度器实现而不是自己写节流。
 */
const deltaBatcher = createBatcher((batches) => {
  for (const [runId, chunks] of batches) {
    // 逐条按到达顺序折叠（reset 语义在 foldLiveDelta 里，判据只有一份）：
    // 同一批里 "半截增量 → reset → 重流增量" 也必须折出正确结果，不能按 kind 分组。
    let acc = {
      text: liveTexts.get(runId) ?? "",
      thinking: liveThinking.get(runId) ?? "",
      thinkTotal: totalsOf(runId).think,
      textTotal: totalsOf(runId).text,
    };
    let resetSeen = false;
    for (const chunk of chunks) {
      const next = foldLiveDelta(acc, chunk);
      resetSeen = resetSeen || next.reset;
      acc = { text: next.text, thinking: next.thinking, thinkTotal: next.thinkTotal, textTotal: next.textTotal };
    }
    if (acc.text) liveTexts.set(runId, acc.text); else liveTexts.delete(runId);
    if (acc.thinking) liveThinking.set(runId, acc.thinking); else liveThinking.delete(runId);
    liveTotals.set(runId, { think: acc.thinkTotal, text: acc.textTotal });
    if (resetSeen) {
      // 重流从第一个字重新开始：放行计数器跟着归零，并立刻重渲染一次——
      // 失败那次尝试的半截文字不能挂到下一帧（下一条 delta 要等一个重试退避）。
      revealed.delete(runId);
      const state = runStates.get(runId);
      if (state && selectedRunId === runId) renderDetailWithState(state);
    }
    if (selectedRunId !== runId) continue;
    startRevealTicker(runId);
  }
});

/**
 * 匀速放行的节拍器。
 *
 * 上游是一阵一阵来的（实测相邻两批最长静默 943ms），直接照搬到屏幕上就是
 * "卡一下、蹦一长串"。这里按帧把已到达的文本匀速放出去，判据在 app.js 的
 * `paceReveal`（纯函数，可测）。
 *
 * 追平之后**自动停表**——没有内容要放时还空转 rAF 是白烧电。
 */
const revealed = new Map();
/**
 * 节拍器**逐 run 一个**（原来是一个全局的）。
 *
 * 原实现 `if (revealTicker !== null) return` 加上闭包里捕获的 runId，会造成：
 * A 在流时选到 B，B 的节拍器起不来（被全局锁挡住），而 A 的那个还在按 A 跑——
 * 于是 B 的直播条一个字都不动。同一次排查里顺手修掉，因为它与 2000 字冻住
 * 是同一个函数的两处缺陷，分开修等于要再读一遍同一段代码。
 * @type {Map<string, number>}
 */
const revealTickers = new Map();

function startRevealTicker(runId) {
  if (revealTickers.has(runId)) return;
  let last = performance.now();
  const tick = (now) => {
    const dtMs = now - last;
    last = now;
    // 对**累计**计数而不是缓冲长度——缓冲会被上限钉死，累计不会
    const totals = totalsOf(runId);
    const arrived = totals.think + totals.text;
    const state = runStates.get(runId);
    const done = !state || state.status !== "running";
    const next = paceReveal({ arrived, revealed: revealed.get(runId) ?? 0, dtMs, done });
    const changed = next !== (revealed.get(runId) ?? 0);
    revealed.set(runId, next);
    if (changed && state && selectedRunId === runId) renderDetailWithState(state);
    // 追平且没在跑了就停表
    if (next >= arrived && done) {
      revealTickers.delete(runId);
      return;
    }
    revealTickers.set(runId, requestAnimationFrame(tick));
  };
  revealTickers.set(runId, requestAnimationFrame(tick));
}

/** 取"该显示到第几个字"的那一截。窗口换算是 app.js 的纯函数，这里只做接线 */
function revealedSlice(runId, full, isThinking) {
  const n = revealed.get(runId);
  if (n === undefined) return full;
  const totals = totalsOf(runId);
  return full.slice(
    0,
    revealedWindow({
      revealed: n,
      // 思考在前、正文在后：正文的额度要扣掉思考已经占掉的
      precedingTotal: isThinking ? 0 : totals.think,
      total: isThinking ? totals.think : totals.text,
      bufferLength: full.length,
    }),
  );
}

const approvalSettle = createApprovalSettleGate();
/** @type {Map<string, ReturnType<typeof setTimeout>>} */
const approvalSettleTimers = new Map();

function scheduleApprovalSettle(runId, ms) {
  if (approvalSettleTimers.has(runId)) return;
  approvalSettleTimers.set(runId, setTimeout(() => {
    approvalSettleTimers.delete(runId);
    const late = approvalSettle.ingest(runId, [], { force: true });
    if (late.ready.length) applySseBatch(runId, late.ready);
  }, ms));
}

function applySseBatch(runId, queue) {
    const state = runStates.get(runId);
    if (!state) return;
    const annotated = annotateResolvedApprovals(queue);

    // 通知中心（T4）：与 reducer 消费同一份信封，逐条喂给通知归约。
    // 模块未加载完成时静默跳过——它是增强项，不挡主流程。
    if (notificationsApi) {
      for (const item of annotated) notificationsApi.ingest(runId, item);
    }
    // 指挥中心（T11）：同一节拍末尾刷新——它读的是通知 store 与 run 列表，
    // 必须在 notifications.ingest 之后调，待决栏才不吃上一节的旧账。
    boardApi?.refresh();

    // 文本阶段的边界：新一轮开始、模型转去调工具、或整段结束——
    // 三者都意味着"正在流入的那段文本"已经不是此刻在发生的事了，让位给
    // 工具标签/最终文本。不在 assistant_text 处清：那条只是把同一段文本
    // 完整地又给了一遍，清了会让直播条闪一下。
    //
    // api_retry / model_fallback 也在此清一次：reset 帧（delta 通道）是瞬态的，
    // 断线重连补缺口时它已经丢了，但这两条 durable 事件会随重放到达——
    // 不断线期残留在缓冲里的半截文字，全靠这一次清掉才不会和重流拼接。
    for (const item of queue) {
      const t = item?.event?.type;
      if (t === "turn_start" || t === "tool_call" || t === "done" || t === "api_retry" || t === "model_fallback") {
        liveTexts.delete(runId);
        liveThinking.delete(runId);
        liveTotals.delete(runId);
        revealed.delete(runId); // 换轮了，放行位置跟着归零
        break;
      }
    }

    const next = reduceEvents(state, annotated);
    runStates.set(runId, next);

    // 产物画布：写完若坞关着就打开（#17）；已开则防抖重拉当前预览。
    if (selectedRunId === runId) {
      const written = deriveWrittenPaths(state, queue);
      if (written.length > 0) {
        // P3：播的是**事实**——写盘成功。以前那半句是「产物画布已打开」，
        // 那是"你换了个视图"，而且曾在未写盘时先响。
        const line = writeAnnouncement(written, artifactBasename);
        if (line) announceStatus(line);
        if (artifactCanvasApi?.isOpen()) artifactCanvasApi.noteWrites(written);
        else openArtifactByPath(runId, written.find((p) => /\.html?$/i.test(p)) ?? written[written.length - 1]);
      }
    }

    if (selectedRunId === runId) renderDetailWithState(next);
    else if (selectedRunId && ancestorRunIds(runs, selectedRunId).includes(runId)) {
      const tip = runStates.get(selectedRunId);
      if (tip) renderDetailWithState(tip);
    }

    // run_end 才是可以收工并主动 close 的信号（段级 done 的单段快路径也会把
    // status 写成 done——那时若立刻关流，会吃不到 run_end，更吃不到 finalize 之后
    // 排队消息自动续跑推来的 user_message）。服务端在 run_end 后也会 end 掉 SSE；
    // 自动续跑会把 run 再拉回 running，靠生命周期流重订（见 subscribeLifecycle）。
    const sawRunEnd = queue.some((item) => item?.event?.type === "run_end");
    if (next.status === "done") {
      stoppingRuns.delete(runId);
      liveTexts.delete(runId); // 运行结束，直播条隐藏，缓冲没有留存意义
      liveThinking.delete(runId);
      liveTotals.delete(runId);
      if (sawRunEnd || next.runEnd) {
        const es = eventSources.get(runId);
        if (es) {
          es.close();
          eventSources.delete(runId);
          // 收尾前多半已经吃过一次 error（服务端 res.end 先到、run_end 后 flush），
          // 横幅正挂着。close 不触发任何事件，不在这儿落它就会一直挂到下次切换。
          setConnectionState(runId, "live");
          announceStatus(runEndAnnouncement(next));
          if (selectedRunId === runId) {
            const arts = deriveArtifacts(next);
            const face = deliveryFace(next.stopReason, arts);
            if (face.kind === "unsigned" && !artifactCanvasApi?.isOpen()) {
              const htmls = arts.filter((a) => /\.html?$/i.test(String(a.path ?? "")));
              if (htmls.length > 0) {
                openArtifactByPath(runId, htmls[htmls.length - 1].path);
              }
            }
          }
          refreshTranscriptIfWatching(runId);
          // 不在看的那条跑完了 → 记一颗未读星（在看的那条不必提醒，你就在看）
          if (selectedRunId !== runId) unreadRuns.add(runId);
          // canContinue 由服务端算，run 收尾后要拉一次列表才知道能不能追加
          void loadRuns();
          void refreshGateChip();
        }
      }
    }
}

const batcher = createBatcher((batches) => {
  for (const [runId, queue] of batches) {
    const { ready, settleInMs } = approvalSettle.ingest(runId, queue);
    if (ready.length) applySseBatch(runId, ready);
    if (settleInMs != null) scheduleApprovalSettle(runId, settleInMs);
  }
});

const enqueueEvent = (runId, sseEvent) => batcher.push(runId, sseEvent);

// 切回前台时立刻补齐一次，不必等下一个节拍
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    batcher.flushNow();
    deltaBatcher.flushNow();
  }
});

function ensureSubscription(runId) {
  if (eventSources.has(runId)) return;
  const state = runStates.get(runId);
  const info = runs.find((r) => r.runId === runId);
  // 列表说还在跑：即使本地还停在上一轮 done（排队自动续跑 / 同 run 再开），
  // 也必须重订——服务端 finalize 后已经掐过旧 SSE。
  if (info?.status === "running") {
    // fall through
  } else if (state && state.status === "done" && (state.timeline?.length ?? 0) > 0) {
    // 空时间线的已完成父 run 仍要拉一次快照，否则谱系对话拼不出历史轮。
    return;
  }

  const es = new EventSource(`/api/runs/${runId}/events`);
  eventSources.set(runId, es);

  // 第一次订这条流：先攒历史重放，等 replay_done 再进 batcher。
  // 已经 hydrate 过的重连走 Last-Event-ID，只补缺口，不必再闸。
  const gate = (runStates.get(runId)?.lastSeq ?? 0) > 0 ? null : createReplayGate();
  const deliver = (item) => {
    if (!gate) {
      enqueueEvent(runId, item);
      return;
    }
    const live = gate.hold(item);
    if (live) {
      for (const ev of live) enqueueEvent(runId, ev);
    }
  };
  const flushReplay = (force = false) => {
    if (!gate || gate.released) return;
    // 500ms 兜底若仍夹着未配对的审批，再等 replay_done，避免先画出幽灵卡。
    if (!force && gate.hasUnpairedApprovalRequest()) return;
    for (const ev of gate.release()) enqueueEvent(runId, ev);
  };

  es.addEventListener("message", (msg) => {
    try {
      deliver(JSON.parse(msg.data));
    } catch {
      // 解析失败静默
    }
  });
  es.addEventListener("replay_done", () => flushReplay(true));
  if (gate) {
    setTimeout(() => flushReplay(false), 500);
    setTimeout(() => flushReplay(true), 2500);
  }

  // 文本流式：命名通道，不占 seq、不进事件缓冲（V-15）。
  // 执行者才进直播条：main / s1/main / spawn/…；规划者、核查者不抢。
  es.addEventListener("delta", (msg) => {
    try {
      const { source, kind, text } = JSON.parse(msg.data);
      if (!isLiveDeltaSource(source)) return;
      // reset：同轮重流（断流重试 / 换端点）前服务端宣告"清缓冲"——
      // 失败那次尝试流出的半截文字作废，否则重流全文会接在它后面反复生成
      if (kind === "reset") {
        deltaBatcher.push(runId, { kind: "reset", text: "" });
        return;
      }
      if (typeof text !== "string" || text === "") return;
      // 思考与正文分两路：混进一条直播条会前言不搭后语
      deltaBatcher.push(runId, { kind: kind === "thinking" ? "thinking" : "text", text });
    } catch {
      // 解析失败静默：直播条是锦上添花，不能因为一条坏帧影响主流程
    }
  });

  es.addEventListener("error", () => {
    // 关键：既不 close 也不把挂起审批标成过期。
    //   · close() 会掐死浏览器原生的自动重连（带 Last-Event-ID 续传）；
    //   · 把 pending 标 expired 更糟——一次网络抖动就让活着的审批卡消失，
    //     运行随即无人可应答而永久挂起。审批过期只由服务端 approval_expired 宣告。
    // 这里只反映"传输层断了"，不改 harness 事实。
    //
    // 但"断了"和"服务端正常收流了"在这一层长得一模一样（见 shouldShowReconnecting）——
    // 委托方截图里一个**已完成**的运行顶上就挂着这条横幅。所以先用 harness
    // 事实分辨一次，别把正常收尾报成故障。
    if (!shouldShowReconnecting({
      info: runs.find((r) => r.runId === runId) ?? null,
      localStatus: runStates.get(runId)?.status ?? null,
    })) {
      setConnectionState(runId, "live");
      return;
    }
    setConnectionState(runId, "reconnecting");
    loadRuns();
  });

  es.addEventListener("open", () => {
    setConnectionState(runId, "live");
  });
}

// ---- 连接态（控制器状态，不进 RunState：它是传输层的事，不是 harness 事实） ----
/** @type {Map<string, "live"|"reconnecting">} */
const connectionStates = new Map();

function setConnectionState(runId, next) {
  const prev = connectionStates.get(runId);
  if (prev === next) return;
  connectionStates.set(runId, next);
  if (selectedRunId !== runId) return;
  syncConnectionBanner();
  if (next === "reconnecting") announceStatus("连接中断，正在重连…");
}

/**
 * 横幅只反映**当前选中**那个运行的连接态。
 *
 * 必须能单独调：setConnectionState 在 `selectedRunId !== runId` 时只写 Map
 * 不动 DOM，所以切换运行时，上一个运行的横幅会原样挂在新运行头上。
 */
function syncConnectionBanner() {
  const banner = document.getElementById("reconnect-banner");
  if (!banner) return;
  banner.hidden = !(selectedRunId && connectionStates.get(selectedRunId) === "reconnecting");
}

// ---- 审批回调 ----
/**
 * @param {string} approvalId 形如 `toolUseId#requestSeq`——返工轮复用同一
 *   toolUseId，只有带请求序号才能指明是哪一轮的那张卡（V-03）。
 *   `#` 是 URL 片段分隔符，必须编码后再拼路径。
 */
/**
 * 计划确认门应答（§5.1）。与工具审批同款口径：409 静默（幂等），不做乐观更新
 * ——服务端随后推 `plan_approval_resolved`，那条才是权威审计记录。
 */
async function postHandoffDecision(runId, decision) {
  try {
    const res = await fetch(`/api/runs/${runId}/handoff`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision }),
    });
    if (res.status === 409) {
      const body = await res.json().catch(() => ({}));
      if (body && body.error) showSubmitError(String(body.error));
      return;
    }
    if (!res.ok) {
      showSubmitError(await failedActionMessage("下一步", res));
      return;
    }
    const payload = await res.json().catch(() => ({}));
    if (decision === "accept" && payload && payload.runId) {
      selectRun(payload.runId);
    }
  } catch (err) {
    showSubmitError(`下一步应答失败：${err && err.message ? err.message : err}`);
  }
}

async function postPlanDecision(runId, decision, extra) {
  try {
    const edits = extra?.edits;
    const res = await fetch(`/api/runs/${runId}/plan-approval`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        decision,
        ...(decision === "approve" && Array.isArray(edits) && edits.length ? { edits } : {}),
      }),
    });
    if (res.status === 409) return; // 已决或已收尾——重复点击不该报错
    if (!res.ok) {
      showSubmitError(await failedActionMessage("计划门应答", res));
    }
  } catch (err) {
    showSubmitError(`计划门应答失败：${err && err.message ? err.message : err}`);
  }
}

/**
 * §5.2 澄清答复。`answers === null` = 委托方明确表示"都让它自己定"——
 * 与超时同归未应答，但**来源不同**，服务端照实记（V-04：不把主动跳过写成没人答）。
 * 非 null 时逐题对齐（未答那题为 null），长度必须等于问题数。
 */
async function postAnswer(runId, answers) {
  try {
    const res = await fetch(`/api/runs/${runId}/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(answers === null ? { skip: true } : { answers }),
    });
    if (res.status === 409) return; // 已答或已收尾——重复点击不该报错
    if (!res.ok) {
      showSubmitError(await failedActionMessage("澄清答复", res));
    }
  } catch (err) {
    showSubmitError(`澄清答复失败：${err && err.message ? err.message : err}`);
  }
}

async function postApproval(runId, approvalId, decision, reason, scope) {
  try {
    const res = await fetch(
      `/api/runs/${runId}/approvals/${encodeURIComponent(approvalId)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // API 字段向后兼容；服务端实际只复用同一工具 + 规范化后完全相同参数
        body: JSON.stringify({ decision, reason, ...(scope ? { scope } : {}) }),
      },
    );
    if (res.status === 409 || res.status === 404) {
      // 409：服务端已决。404：自动放行从不进挂起表，卡却还在——同一张过期卡。
      // 两种都不该弹「审批失败」，按这次点击收口即可。
    } else if (!res.ok) {
      showSubmitError(await failedActionMessage("审批", res));
      return;
    }
    // 乐观更新，让点击立刻有反馈；服务端随后会推 approval_resolved，
    // 那条才是权威记录（刷新/换标签页后靠它复原，见 V-02）
    const state = runStates.get(runId);
    if (state) {
      const next = markApprovalResolved(
        state,
        approvalId,
        decision === "allow" ? "allowed" : "denied",
        reason,
      );
      runStates.set(runId, next);
      if (selectedRunId === runId) {
        renderDetailWithState(next);
      }
    }
  } catch (err) {
    showSubmitError(`审批失败：${err && err.message ? err.message : err}`);
  }
}

async function postAutoApprove(runId, enabled) {
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/auto-approve`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enabled: Boolean(enabled) }),
    });
    if (res.ok) {
      const info = runs.find((r) => r.runId === runId);
      if (info) info.autoApprove = Boolean(enabled);
      return;
    }
    if (res.status !== 409) {
      const body = await res.json().catch(() => ({}));
      showSubmitError(humanizeActionFailure("自动放行设置", res.status, body.error));
    }
  } catch (err) {
    showSubmitError(`自动放行设置失败：${err && err.message ? err.message : err}`);
  }
}

/**
 * 勾选是偏好，不是 run 上的事实。归档续跑 / 已勾着从不触发 change 时，
 * 界面开着、服务端关着——必须在选中运行中对话时把两边对齐。
 */
function syncAutoApprove(runId) {
  const info = runs.find((r) => r.runId === runId);
  if (!info || info.status !== "running") return;
  const want = autoApproveToggle?.checked === true;
  if (Boolean(info.autoApprove) === want) return;
  void postAutoApprove(runId, want);
}

/**
 * 自动放行默认值与设置中心同源（T7）：agent-ui-settings 为准，旧键
 * agent-ui-auto-approve 已在启动时由 migrateLegacyPrefs 一次性迁入。
 * 这里（composer 当次改动）与设置页两边都同时写两个键，任一顺序读都一致。
 */
const AUTO_APPROVE_PREF = "agent-ui-auto-approve";
if (autoApproveToggle) {
  autoApproveToggle.checked = composerDefaults(uiSettings).autoApprove;
  autoApproveToggle.addEventListener("change", () => {
    uiSettings = updateSettings(uiSettings, { defaults: { autoApprove: autoApproveToggle.checked } });
    try {
      localStorage.setItem(AUTO_APPROVE_PREF, autoApproveToggle.checked ? "1" : "0");
      saveSettings(localStorage, uiSettings);
    } catch { /* ignore */ }
    syncPermissionModeSelectFromKnobs();
    const run = runs.find((r) => r.runId === selectedRunId);
    if (run && run.status === "running") {
      void postAutoApprove(selectedRunId, autoApproveToggle.checked);
    }
  });
}

/**
 * D3：选档 → 展开到既有旋钮；改旋钮 → 能对上预设才回写档名。
 */
function applyPermissionModeToKnobs(mode) {
  const switches = permissionModeSwitches(mode);
  if (planModeToggle) planModeToggle.checked = switches.planMode;
  // plan 档与自动放行正交：选计划编排不得顺手关掉「自动放行」。
  if (autoApproveToggle && mode !== "plan") {
    autoApproveToggle.checked = switches.autoYes || switches.approvalDefault === "auto";
  }
}

function syncPermissionModeSelectFromKnobs() {
  if (!permissionModeSelect) return;
  const switches = {
    approvalDefault: autoApproveToggle?.checked ? "auto" : "ask",
    planMode: planModeToggle?.checked === true,
    planGate: planModeToggle?.checked === true,
    autoYes: autoApproveToggle?.checked === true,
  };
  const matched = matchPermissionMode(switches);
  permissionModeSelect.value = matched ?? "";
  const stance = document.getElementById("permission-stance");
  if (stance) stance.textContent = describePermissionStance(matched, switches);
}

if (permissionModeSelect) {
  permissionModeSelect.addEventListener("change", () => {
    if (!permissionModeSelect.value) return;
    applyPermissionModeToKnobs(permissionModeSelect.value);
  });
  syncPermissionModeSelectFromKnobs();
}
if (planModeToggle) {
  planModeToggle.addEventListener("change", () => syncPermissionModeSelectFromKnobs());
}
// 独立核查默认值同样来自设置中心（此前无持久化，设置页是它的唯一出处）
if (verifyToggle) {
  verifyToggle.checked = composerDefaults(uiSettings).verify;
  // 能力条的「核查关」格挂在这个开关上（syncComposer 只在消息/切 run/开闭设置
  // 时重画）：勾上「独立核查」后芯片必须当场消失，不等下一次 syncComposer。
  // 设置页 applyComposerDefaults 走的是 .checked 赋值，不触发 change——
  // 那半边照旧走它自己的重画时机，这里只管用户亲手勾的那一下。
  verifyToggle.addEventListener("change", () => {
    const selectedState = selectedRunId ? runStates.get(selectedRunId) : null;
    patchCapabilityBar(
      { ...(selectedState ?? {}), verify: verifyToggle.checked === true },
      harnessSnapshot,
    );
  });
}

// ---- 提交：一个框，两种去向 ----
/**
 * 提交入口。去哪儿由 `composerSubmitPlan` 说了算——它是纯函数，
 * 所以"这一下会新建还是会追加"这件事可以在测试里锁死，而不是靠人点。
 */
document.getElementById("design-template-chip")?.addEventListener("click", () => {
  applyDesignTemplate(null);
  announceStatus("已取消模板");
});

submitForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const plan = composerSubmitPlan(composerMode, taskInput.value);
  if (!plan) {
    // 不能提交时**不能静默**：运行中那个模式恰恰是主动邀请用户打字的
    // （placeholder 写着"可以先把下一条指令打好"），按了却零反馈最伤人
    if (composerMode && !composerMode.canSubmit && taskInput.value.trim()) {
      announceStatus(composerMode.note || "现在不能提交");
    }
    return;
  }
  if (plan.kind === "stop") void stopRun(plan.runId);
  else if (plan.kind === "steer") void postRunningMessage("steer");
  else if (plan.kind === "append") void submitAppend(plan);
  else void submitNewRun(plan);
});

/**
 * 停止走按钮 click，不指望 form submit。
 * 嵌入预览 / 某些环境下 submit 会被吞，点了像没点；click 是人按下去的那一下。
 */
submitBtn.addEventListener("click", (e) => {
  if (composerMode?.kind !== "stop") return;
  e.preventDefault();
  e.stopPropagation();
  void stopRun(composerMode.runId);
});

/**
 * Enter 发送、Shift+Enter 换行（主流聊天产品惯例）。**只绑在 textarea 上，
 * 不绑在 form 上**——`#rubric-input` 也在这个 form 里，绑 form 的话在评分表
 * 里按 Enter 会带着半截 rubric 直接发车。Ctrl/Cmd+Enter 照旧也算发送。
 *
 * 中文输入法硬规矩：IME 组词期间（isComposing / keyCode 229）按 Enter 是
 * 选词上屏，绝不许触发发送。
 */
taskInput.addEventListener("keydown", (e) => {
  // `/` 打在第一格（输入框还空着）时打开命令面板。这是 REPL 惯例，也是 09-15 审计
  // 的建议：「`/` 要么弹出命令面板，要么不当命令」——此前它什么都不做，纯空响。
  // 有内容时照常插入斜杠：路径、除法、日期都要用它，不能占着。
  if (e.key === "/" && taskInput.value === "" && commandPaletteApi) {
    e.preventDefault();
    commandPaletteApi.open?.();
    return;
  }
  if (e.key === "Escape") {
    const picker = document.getElementById("cite-picker");
    if (picker && !picker.hidden) {
      e.preventDefault();
      hideCitePicker();
      return;
    }
  }
  /**
   * 收尾后的下一步：输入框空着时 Tab 采纳幽灵问句（三轮走查 A+B）。
   * **没有建议、或已经在打字 → 直接放行**——键盘不能吃，Tab 的默认职责是切焦点。
   */
  if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey
      && pendingNextSuggestion && taskInput.value.trim() === "") {
    e.preventDefault();
    const { reply } = pendingNextSuggestion;
    pendingNextSuggestion = null;
    taskInput.value = reply;
    if (typeof taskInput.setSelectionRange === "function") {
      taskInput.setSelectionRange(reply.length, reply.length);
    }
    syncWelcomeComposerField();
    syncComposer();
    return;
  }
  if (e.key !== "Enter") return;
  if (e.isComposing || e.keyCode === 229) return;
  if (e.shiftKey) return; // Shift+Enter 留给换行
  const firstCite = document.querySelector("#cite-picker:not([hidden]) .cite-picker-item");
  if (firstCite) {
    e.preventDefault();
    const file = firstCite.getAttribute("data-file-path");
    if (file) insertWorkspaceFileMention(file, firstCite.getAttribute("data-file-kind"));
    else addCite(firstCite.getAttribute("data-run-id"));
    return;
  }
  e.preventDefault();
  if (typeof submitForm.requestSubmit === "function") submitForm.requestSubmit();
  else submitForm.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
});
taskInput.addEventListener("input", () => {

/**
 * 设计模式稿目录：mkdir + 加入白名单。宿主仓库不自动切走；
 * 空目录才默认用稿目录。自动切换不写 PREF_WORKDIR。
 */
async function ensureDesignDraftsWorkdir() {
  if (!workdirSelect) return;
  const current = workdirSelect.value && workdirSelect.value !== WORKDIR_ADD_VALUE
    ? workdirSelect.value
    : "";
  try {
    const res = await fetch("/api/design-drafts-workdir", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ currentWorkdir: current || undefined }),
    });
    if (!res.ok) return;
    const body = await res.json().catch(() => null);
    if (!body?.workdir) return;
    const list = Array.isArray(body.workdirs) ? body.workdirs : [];
    const extras = getWorkdirSelection(workdirSelect, list).extras;
    const keep = current && list.includes(current) ? current : workdirSelect.value;
    if (body.select) {
      applyDraftsWorkdirSelection(body.workdir, list);
      return;
    }
    if (list.length) {
      renderWorkdirOptions(workdirSelect, list, { selected: keep });
      applyWorkdirSelection(workdirSelect, list, { primary: keep, extras });
      workdirComboboxApi?.paint();
      refreshWorkdirDependents();
    }
    if (body.reason === "host-repo") {
      showDesignDraftsHint(body.workdir);
    }
  } catch { /* 失败不挡设计模式 */ }
}

/** 「当前目录」的**唯一**派生入口。树、预览坞、@、引用、发送都只准从这里读，
    不准各自再判一次 —— 判两次就会像 09-15 那样，发送栏有目录而树说没有。 */
function currentWorkdir() {
  if (workdirSelect && workdirSelect.value && workdirSelect.value !== WORKDIR_ADD_VALUE) {
    return getWorkdirSelection(workdirSelect).primary || workdirSelect.value;
  }
  const pref = readPrefString(PREF_WORKDIR, "");
  if (pref) return pref;
  const list = harnessSnapshot?.availableWorkdirs ?? [];
  if (!list.length) return "";
  return pickWelcomeWorkdir({
    visible: workdirListForFace(list),
    keep: "",
    snapWorkdir: harnessSnapshot?.workdir,
    hostWorkdirIsHarness: Boolean(harnessSnapshot?.designMode?.hostWorkdirIsHarness),
    hasPref: false,
  }) || "";
}

/** 工作目录变了的统一出口：重载树、刷 git 芯片、欢迎态重绘。
    所有"目录可能变了"的地方都调它一次，别各自分支。 */
function refreshWorkdirDependents() {
  void fileTreeApi?.reload?.();
  void workspaceGitChipApi?.refresh()?.then(() => refreshGithubPrReady().then(() => {
    if (mainPanel.classList.contains("is-welcome")) paintEmptyState();
  }));
}

async function refreshGateChip() {

    return;

    if (!res.ok) {
      paintGateChip(chip, null);

    }

function paintCiteChips() {
  const host = document.getElementById("cite-chips");
  if (!host) return;
  host.replaceChildren();
  const selected = selectedCiteIds
    .map((id) => citeCandidates.find((c) => c.runId === id) || sameWorkdirCiteRuns(runs, currentWorkdir()).find((r) => r.runId === id))
    .filter(Boolean);
  host.hidden = selected.length === 0;
  for (const ref of selected) {

function hideCitePicker() {
  filePickerToken += 1;
  window.clearTimeout(workspaceFilterTimer);
  workspacePickerFiles = [];
  const picker = document.getElementById("cite-picker");
  if (picker) {
    picker.hidden = true;
    picker.replaceChildren();
    picker.setAttribute("aria-label", "引用会话");
  }
}

let filePickerToken = 0;
/** 最近一次列结果。过滤框先本地再筛，防抖后再打服务端 q= 深搜。 */
let workspacePickerFiles = [];
let workspaceFilterTimer = 0;

function bindWorkspacePickerFilter(picker, files, initial) {
  const filter = document.createElement("input");
  filter.type = "search";
  filter.className = "cite-picker-filter";
  filter.placeholder = "按文件名过滤";
  filter.value = String(initial ?? "");
  filter.setAttribute("aria-label", "按文件名过滤");
  filter.addEventListener("keydown", (ev) => ev.stopPropagation());
  filter.addEventListener("input", () => {
    renderWorkspaceFilePickerItems(picker, workspacePickerFiles, filter.value);
    window.clearTimeout(workspaceFilterTimer);
    workspaceFilterTimer = window.setTimeout(() => {
      void refetchWorkspaceFiles(filter.value);
    }, 160);
  });
  picker.appendChild(filter);
  return filter;
}

async function refetchWorkspaceFiles(query) {
  const picker = document.getElementById("cite-picker");
  const wd = currentWorkdir();
  if (!picker || picker.hidden || !wd) return;
  const token = ++filePickerToken;
  try {
    const res = await fetch(buildWorkspaceFilesUrl(wd, query));
    if (token !== filePickerToken) return;
    if (!res.ok) return;
    const body = await res.json().catch(() => null);
    const files = Array.isArray(body?.files) ? body.files : [];
    workspacePickerFiles = files;
    renderWorkspaceFilePickerItems(picker, files, query);
  } catch {
    /* 保留上一页 */
  }
}

function renderWorkspaceFilePickerItems(picker, files, filterText) {
  picker.querySelectorAll(".cite-picker-item, .cite-picker-empty").forEach((el) => el.remove());
  const shown = filterWorkspaceFileEntries(files, filterText);
  if (!shown.length) {
    const empty = document.createElement("p");
    empty.className = "cite-picker-empty";
    empty.textContent = filterText ? "这个文件夹里没有匹配的文件。" : "这个文件夹里还没有可点名的文件。";
    picker.appendChild(empty);
    return;
  }
  for (const f of shown.slice(0, 12)) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cite-picker-item";
    btn.setAttribute("role", "option");
    btn.dataset.filePath = f.relative;
    btn.dataset.fileKind = f.kind;
    const title = document.createElement("span");
    title.className = "cite-picker-title";
    title.textContent = f.kind === "directory" ? `${f.relative}/` : f.relative;
    btn.appendChild(title);
    btn.addEventListener("mousedown", (ev) => {
      ev.preventDefault();
      insertWorkspaceFileMention(f.relative, f.kind);
    });
    picker.appendChild(btn);
  }
}

function insertWorkspaceFileMention(relative, kind) {
  const mention = `@${String(relative ?? "").replace(/\\/g, "/")}`;
  const suffix = kind === "directory" ? "/" : " ";
  const trigger = composerCiteTrigger(taskInput.value);
  if (trigger) {
    const after = taskInput.value.slice(trigger.start + 1 + trigger.query.length);
    taskInput.value = `${taskInput.value.slice(0, trigger.start)}${mention}${suffix}${after}`;
  } else {
    const pad = taskInput.value && !/\s$/.test(taskInput.value) ? " " : "";
    taskInput.value = `${taskInput.value}${pad}${mention}${suffix}`;
  }
  syncWelcomeComposerField();
  syncComposer();
  hideCitePicker();
  if (kind === "directory") onComposerCiteInput();
  else taskInput.focus();
}

async function paintWorkspaceFilePicker(query) {
  const picker = document.getElementById("cite-picker");
  const wd = currentWorkdir();
  if (!picker) return;
  if (!wd) {
    hideCitePicker();
    return;
  }
  const token = ++filePickerToken;
  picker.setAttribute("aria-label", "工作区文件");
  try {
    const res = await fetch(buildWorkspaceFilesUrl(wd, query));
    if (token !== filePickerToken) return;
    if (!res.ok) {
      picker.replaceChildren();
      const empty = document.createElement("p");
      empty.className = "cite-picker-empty";
      empty.textContent = humanizeActionFailure("列文件", res.status);
      picker.appendChild(empty);
      picker.hidden = false;
      return;
    }
    const body = await res.json().catch(() => null);
    const files = Array.isArray(body?.files) ? body.files : [];
    workspacePickerFiles = files;
    picker.replaceChildren();
    picker.hidden = false;
    bindWorkspacePickerFilter(picker, files, query);
    renderWorkspaceFilePickerItems(picker, files, query);
  } catch {
    if (token !== filePickerToken) return;
    hideCitePicker();
  }
}

function paintCitePicker(query) {
  const picker = document.getElementById("cite-picker");
  if (!picker) return;
  picker.setAttribute("aria-label", "引用会话");
  const local = sameWorkdirCiteRuns(runs, currentWorkdir()).map((r) => ({
    runId: r.runId,
    title: r.title || r.task,
    task: r.task,
    conversationRecap: r.recap ?? null,
    artifacts: [],
  }));
  const merged = new Map();
  for (const c of [...local, ...citeCandidates]) {
    if (c?.runId) merged.set(c.runId, { ...merged.get(c.runId), ...c });
  }
  const available = [...merged.values()].filter((c) => !selectedCiteIds.includes(c.runId));
  const filtered = filterCiteCandidates(available, query);
  picker.replaceChildren();
  if (!filtered.length) {
    picker.hidden = true;
    return;
  }
  picker.hidden = false;
  for (const c of filtered.slice(0, 8)) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cite-picker-item";
    btn.setAttribute("role", "option");
    btn.dataset.runId = c.runId;
    const title = document.createElement("span");
    title.className = "cite-picker-title";
    title.textContent = formatCiteChip(c);
    const task = document.createElement("span");
    task.className = "cite-picker-task";
    task.textContent = c.task && c.task !== c.title ? c.task : "";
    btn.appendChild(title);
    if (task.textContent) btn.appendChild(task);
    btn.addEventListener("mousedown", (ev) => {
      ev.preventDefault();
      addCite(c.runId);
    });
    picker.appendChild(btn);
  }
}

function addCite(runId) {
  if (!runId || selectedCiteIds.includes(runId)) return;
  selectedCiteIds = [...selectedCiteIds, runId];
  const trigger = composerCiteTrigger(taskInput.value);
  if (trigger) {
    taskInput.value = `${taskInput.value.slice(0, trigger.start)}${taskInput.value.slice(trigger.start + 1 + trigger.query.length)}`.trimStart();
    syncWelcomeComposerField();
    syncComposer();
  }
  paintCiteChips();
  hideCitePicker();
}

async function refreshCiteCandidates() {
  const wd = currentWorkdir();
  if (!wd) {
    citeCandidates = [];
    return;
  }
  try {
    const res = await fetch(`/api/cite-candidates?workdir=${encodeURIComponent(wd)}`);
    if (!res.ok) return;
    const body = await res.json().catch(() => null);
    citeCandidates = Array.isArray(body?.candidates) ? body.candidates : [];
  } catch {
    /* 点名列表失败时仍可用本地 runs */
  }
}

function onComposerCiteInput() {
  const trigger = composerCiteTrigger(taskInput.value);
  if (!trigger) {
    hideCitePicker();

}

async function submitNewRun({ text: task }) {
  submitting = true;
  newRunError = null;
  syncComposer();
  try {
    const useDesign = wantsDesignPipeline({
      designId: selectedDesignId,
      designTemplate: selectedDesignTemplate,
      designSample: selectedDesignSample,
      designFilePack: selectedDesignFilePack,
      workDesignChip,
    });
    if (useDesign) {
      await ensureDesignDraftsWorkdir();
    }
    const verify = verifyToggle.checked;
    const res = await fetch("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildNewRunRequest({
        task,
        verify,
        pack: packSelect?.value,
        effort: effortSelect?.value,
        rubric: rubricInput?.value,
        workspace: workspaceFace,
        mode: useDesign ? "design" : "single",
        designId: selectedDesignId || undefined,
        designTab: selectedDesignTab || undefined,
        designTemplate: selectedDesignTemplate || undefined,
        designFilePack: selectedDesignFilePack || undefined,
        planMode: planModeToggle?.checked === true,
        multiAgent: multiAgentToggle?.checked === true,
        autoPack: autoPackToggle?.checked === true,
        lineageBudget: false,
        dailyBudget: false,
        askUser: true,
        autoApprove: autoApproveToggle?.checked === true,
        permissionMode: permissionModeSelect?.value || undefined,
        workdir: workdirSelect?.value && workdirSelect.value !== WORKDIR_ADD_VALUE
          ? workdirSelect.value
          : undefined,
        extraWorkdirs: workdirSelect
          ? getWorkdirSelection(workdirSelect).extras
          : undefined,
        projectId: selectedComposerProject()?.id,
        useVerifierModel: !useVerifierModel || useVerifierModel.checked,
        usePlannerModel: !usePlannerModel || usePlannerModel.checked,
        citedRunIds: selectedCiteIds,
      })),
    });
    if (!res.ok) {
      let detail = "";
      let body = null;
      try {
        body = await res.json();
        detail = body?.error ? `：${body.error}` : "";
      } catch { /* 响应体不是 JSON，只报状态码 */ }
      if (res.status === 409 && body?.designRoute) {
        applyWorkspaceFace("work", { refresh: false });
        workCatalogOpen = true;
        designModeActive = true;
        if (body.designRoute.tab) selectedDesignTab = body.designRoute.tab;
        else if (!selectedDesignTab) selectedDesignTab = "Prototype";
        designRouteHint = body.designRoute.reason || body.error || "请选择页签或模板";
        paintEmptyState();
      }
      newRunError = humanizeSubmitError(body, res.status);
      return;
    }
    const { runId } = await res.json();
    selectedCiteIds = [];
    paintCiteChips();
    hideCitePicker();
    const pendingTemplate = workspaceFace === "work" ? null : selectedDesignTemplate;
    selectedDesignTemplate = null;
    selectedDesignId = null;
    selectedDesignSample = null;
    selectedDesignFilePack = null;
    workDesignChip = false;
    designRouteHint = null;
    paintDesignTemplateChip();
    if (pendingTemplate) {
      try {
        const seed = await fetch(`/api/runs/${encodeURIComponent(runId)}/seed-template`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ template: pendingTemplate }),
        });
        if (seed.ok) announceStatus(`已拷贝模板 ${pendingTemplate} 到工作目录`);
      } catch { /* 模板拷贝失败不挡会话；agent 仍可自己读 templates/ */ }
    }

    const state = createInitialState(runId, task, verify, { createdAt: Date.now() });
    runStates.set(runId, state);

    const submittedWorkdir = workdirSelect?.value && workdirSelect.value !== WORKDIR_ADD_VALUE
      ? workdirSelect.value
      : undefined;
    const submittedProjectId = selectedComposerProject()?.id;
    runs.unshift({
      runId,
      task,
      status: "running",
      verify,
      createdAt: Date.now(),
      finishedAt: null,
      workspace: workspaceFace,
      ...(submittedWorkdir ? { workdir: submittedWorkdir } : {}),
      ...(submittedProjectId ? { projectId: submittedProjectId } : {}),
      ...(useDesign ? { packName: "design", mode: "design" } : {}),
    });
    selectedRunId = runId;
    activeTabs.set(runId, "loop");
    syncSidebarYield();
    renderDetailWithState(state);
    enterDetailMode();
    writeHash(runId, "loop");
    announceStatus(`新任务已提交：${task}`);

    ensureSubscription(runId);
    taskInput.value = "";
    clearUploads();
  } catch (err) {
    newRunError = `提交失败：${err.message ?? "网络错误"}`;
  } finally {
    submitting = false;
    // 焦点交还输入框：按钮这一刻会变成 disabled（运行中），鼠标用户的焦点
    // 否则当场掉回 body
    if (document.activeElement === submitBtn) taskInput.focus();
    refreshRunListView();
  }
}

/**
 * 停止这次运行。
 *
 * 闸立刻拉下，按钮立刻改成「正在停止…」。loop 对在飞的模型/工具与 abort
 * 赛跑，不应再等整轮吐完；超过约 1.5s 宿主会强制收尾。
 */
async function stopRun(runId) {
  if (!runId || stoppingRuns.has(runId)) return;
  stoppingRuns.add(runId);
  newRunError = null;
  syncComposer();
  announceStatus("正在停止这次运行");
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/stop`, { method: "POST" });
    if (res.ok) return;
    stoppingRuns.delete(runId);
    const b = await res.json().catch(() => ({}));
    if (res.status === 409 && /already finished/i.test(String(b.error ?? ""))) {
      void loadRuns();
      return;
    }
    showSubmitError(humanizeActionFailure("停止", res.status, b.error));
  } catch (err) {
    stoppingRuns.delete(runId);
    showSubmitError(`停止失败：${err.message ?? "网络错误"}`);
  } finally {
    syncComposer();
  }
}

async function submitAppend({ runId, text }) {
  submitting = true;
  // 提交前读：syncComposer 会把开关禁用，但 checked 值不动
  const verify = verifyToggle.checked;
  syncComposer();
  try {
    await postFollowUp(runId, text, verify);
    if (!followUpErrors.has(runId)) {
      taskInput.value = "";
      clearUploads();
    }

    submitting = false;
    if (document.activeElement === submitBtn) taskInput.focus();
    syncComposer();

}

/**
 * 提交错误就地显示（V-16）。
 *
 * 此前用 alert()：它抢焦点、阻塞整页、在窄屏上盖住内容，而且屏幕阅读器
 * 的播报时机不受控。改成 role="alert" 的行内区域——辅助技术会自动播报，
 * 键盘焦点不动，错误内容还能带上 HTTP 状态码与服务端文案。
 */
/**
 * 人闸失败文案。429 不要把 `{"error":"Mutation rate limit exceeded"}` 原样甩出来——
 * 那是额度窗，不是答复本身坏了；带上 Retry-After，并照实说这次没送出去。
 */
async function failedActionMessage(action, res) {
  if (res.status === 429) {
    const sec = Number(res.headers.get("retry-after"));
    const wait = Number.isFinite(sec) && sec > 0 ? `${sec} 秒` : "一会儿";
    return `${action}被限流拦住了，请 ${wait} 后再试。这次没有送出去。`;
  }
  let detail = "";
  try {
    const body = await res.json();
    detail = body?.error ? `：${body.error}` : "";
  } catch {
    try {
      const text = await res.text();
      if (text) detail = `：${text}`;
    } catch { /* 响应体读失败就只报状态码 */ }
  }
  return humanizeSubmitError(
    { error: detail ? `${action}失败${detail}` : `${action}失败` },
    res.status,
  );
}

function showSubmitError(message) {
  // 合并之后 #submit-error 由 patchComposer 统一写。这里改成设状态再同步，
  // 否则两个写入方会互相覆盖：一次列表刷新就能把刚报出来的错抹掉。
  newRunError = message || null;
  syncComposer();
}

/**
 * 行内错误的关闭按钮（委托方：红字错误出现后无法关闭，一直在原位）。
 *
 * 这个显示位共享给两本账：与 run 无关的提交错误（newRunError）和挂在当前
 * 选中 run 上的追加错误（followUpErrors）——关掉时两本都清，否则关掉一本
 * 另一本立刻顶上来，等于没关。
 *
 * 这些都是**当前操作失败**的瞬态提示：它们只是控制器状态，不进 SSE 事件流，
 * 刷新/重放不会复活——与事件流里的历史错误记录（tool_result isError 等）
 * 是两回事，后者是历史事实，不提供关闭。
 */
submitError.querySelector("#submit-error-close")?.addEventListener("click", () => {
  newRunError = null;
  if (selectedRunId) followUpErrors.delete(selectedRunId);
  syncComposer();
  // 按钮随容器一起 hidden 后焦点不能掉回 body——交还输入框（本仓既有纪律）
  taskInput.focus();
});

// ---- 全局生命周期流（V-10：取代 3 秒轮询）----
// 轮询本身不是问题，"每 3 秒整体重建侧栏"才是——实测焦点停在运行项上 3.6 秒后
// 就变成 BODY。改成推送 + 键控补丁：只在真有变化时更新，且不重建节点。
// 兜底轮询保留但降到 30 秒，且仅在推送流断开期间生效。
let lifecycleStream = null;
let fallbackPoll = null;

function startFallbackPoll() {
  if (fallbackPoll !== null) return;
  fallbackPoll = setInterval(loadRuns, 30000);
}

function stopFallbackPoll() {
  if (fallbackPoll === null) return;
  clearInterval(fallbackPoll);
  fallbackPoll = null;
}

function subscribeLifecycle() {
  lifecycleStream = new EventSource("/api/stream");

  lifecycleStream.addEventListener("message", (msg) => {
    try {
      const payload = JSON.parse(msg.data);
      if (payload.type === "snapshot") {
        runs = payload.runs;
      } else if (payload.type === "run_removed" && payload.runId) {
        runs = runs.filter((run) => run.runId !== payload.runId);
        unreadRuns.delete(payload.runId);
        runStates.delete(payload.runId);
        notificationsApi?.removeRun(payload.runId);
        const stream = eventSources.get(payload.runId);
        if (stream) stream.close();
        eventSources.delete(payload.runId);
        if (selectedRunId === payload.runId) {
          selectedRunId = null;
          writeHash(null, null);
          syncSidebarYield();
        }
      } else if (payload.run) {
        const idx = runs.findIndex((r) => r.runId === payload.run.runId);
        const prevStatus = runs[idx]?.status;
        // 生命周期流也要记未读：没订阅事件流的那些运行（你根本没点开过）
        // 只能从这里知道它们跑完了——只靠 SSE done 分支会漏掉一整类
        if (
          payload.run.status === "done" &&
          prevStatus === "running" &&
          payload.run.runId !== selectedRunId
        ) {
          unreadRuns.add(payload.run.runId);
        }
        if (idx >= 0) runs[idx] = payload.run;
        else runs = [payload.run, ...runs];
        if (payload.run.status === "done") stoppingRuns.delete(payload.run.runId);
        // 排队自动续跑：finalize 掐掉 SSE 之后又把 run 拉回 running。
        // 本地若还停在 done，不重订事件流 →「结束后会自动回到对话」成假话。
        if (payload.run.status === "running") {
          const st = runStates.get(payload.run.runId);
          if (st && st.status === "done") {
            runStates.set(payload.run.runId, {
              ...st,
              status: "running",
              runEnd: null,
              stopReason: null,
              error: null,
            });
            if (selectedRunId === payload.run.runId) {
              renderDetailWithState(runStates.get(payload.run.runId));
            }
          }
          ensureSubscription(payload.run.runId);
        }
      }
      maybeRepaintWorkdirsForFace();
      refreshRunListView();
      if (selectedRunId) syncAutoApprove(selectedRunId);
      // 通知中心对账：running→done 跃迁补「运行完成」，已删除/已完成 run 清账
      notificationsApi?.syncRuns();
      // 指挥中心随生命周期流一起刷新（待决/运行中/最近完成三栏都依赖这份列表）
      boardApi?.refresh();
    } catch {
      // 解析失败静默
    }
  });

  lifecycleStream.addEventListener("open", stopFallbackPoll);
  // 不 close：浏览器会自己重连，届时服务端重发 snapshot 补齐缺口
  lifecycleStream.addEventListener("error", startFallbackPoll);
}

/** 用宿主快照填充旋钮选项——可选值由服务端给，前端不硬编码 */
function populateKnobs(snap) {
  if (packSelect && Array.isArray(snap.availablePacks)) {
    const keepPack = packSelect.value;
    packSelect.innerHTML = "";
    const none = document.createElement("option");
    none.value = "";
    none.textContent = "不用领域包";
    packSelect.appendChild(none);
    for (const p of snap.availablePacks) {
      const opt = document.createElement("option");
      opt.value = p.name;
      opt.textContent = packOptionLabel(p);
      if (p.description) opt.title = p.description;
      packSelect.appendChild(opt);
    }
    const names = new Set([...packSelect.options].map((o) => o.value));
    if (keepPack && names.has(keepPack)) packSelect.value = keepPack;
    else if (snap.pack?.name && names.has(snap.pack.name)) packSelect.value = snap.pack.name;
    updatePackHint();
  }
  if (effortSelect && Array.isArray(snap.effortLevels)) {
    const keepEffort = effortSelect.value;
    const labels = { low: "低", medium: "中", high: "高", xhigh: "很高", max: "最高" };
    effortSelect.innerHTML = "";
    for (const lv of snap.effortLevels) {
      const opt = document.createElement("option");
      opt.value = lv;
      opt.textContent = labels[lv] ?? lv;
      effortSelect.appendChild(opt);
    }
    if (keepEffort && [...effortSelect.options].some((o) => o.value === keepEffort)) {
      effortSelect.value = keepEffort;
    } else if (snap.effort) effortSelect.value = snap.effort;
    // 设置中心（T7）的思考强度默认值覆盖服务端默认："" = 跟随服务端，不动 select
    applyComposerDefaults({ effortSelect }, { effort: composerDefaults(uiSettings).effort }, {
      effortLevels: snap.effortLevels,
    });
  }
  if (effortSelect && snap.compat) {
    effortSelect.title = "compat 端点不发送思考强度（第三方不认识该参数）";
  }

  // V-29 工作目录：列宿主声明过的集合，末项恒为「＋ 添加目录…」（哨兵值，
  // 选中即打开目录选择器浮层——见 features/workdir-picker.js）
  if (workdirSelect && Array.isArray(snap.availableWorkdirs)) {
    const pref = readPrefString(PREF_WORKDIR, "");
    const keep = workdirSelect.value && workdirSelect.value !== WORKDIR_ADD_VALUE
      ? workdirSelect.value
      : pref;
    const visible = workdirListForFace(snap.availableWorkdirs);
    const selected = pickWelcomeWorkdir({
      visible,
      keep,
      snapWorkdir: snap.workdir,
      hostWorkdirIsHarness: Boolean(snap.designMode?.hostWorkdirIsHarness),
      hasPref: Boolean(pref),
    });
    renderWorkdirOptions(workdirSelect, visible, { selected: selected || snap.workdir });
    const savedExtras = (readPrefJson(PREF_WORKDIR_EXTRAS, []) || [])
      .filter((d) => visible.some((v) => sameWorkdirPath(v, d)));
    applyWorkdirSelection(workdirSelect, visible, {
      primary: workdirSelect.value,
      extras: savedExtras,
    });
    // 有了「＋ 添加目录…」就永远有得选：不再因为只有一个目录而锁死下拉。
    // 运行中/追加模式的禁用走 patchComposer 的 optionsEnabled，语义不变。
    workdirSelect.disabled = false;
    workdirSelect.dataset.fixed = "false";
    workdirComboboxApi?.paint();
    void workspaceGitChipApi?.refresh();
    refreshWorkdirDependents();
  }

  if (Array.isArray(snap.availableProjects)) {
    availableProjects = snap.availableProjects;
  }
  if (projectSelect) {
    const keep = projectSelect.value && projectSelect.value !== PROJECT_ADD_VALUE
      ? projectSelect.value
      : readPrefString(PREF_PROJECT, "");
    renderProjectOptions(keep);
    const chosen = selectedComposerProject();
    if (chosen) applyProjectMembership(chosen, { keepCurrent: true });
  }

  // V-30/V-31：角色常驻可见。主执行模型在左侧独立选择器，这里只管规划/核查/识图/生图。
  const rm = snap.roleModels;
  const knob = document.getElementById("role-models-knob");
  if (rm && knob) {
    const executorText = document.getElementById("executor-role-text");
    if (executorText && rm.executor) {
      executorText.textContent = `执行 · ${rm.executor.model}`;
    }

    const wire = (role, rowId, fallbackId, textId, label) => {
      const row = document.getElementById(rowId);
      const fallback = document.getElementById(fallbackId);
      const configured = Boolean(rm[role]?.configured);
      if (row) row.hidden = !configured;
      if (fallback) fallback.hidden = configured;
      if (!configured) return false;
      const text = document.getElementById(textId);
      if (text) text.textContent = `${label} · ${rm[role].model}`;
      row.title = `${label}使用 ${rm[role].model}（${rm[role].provider}）；取消勾选则跟随执行模型`;
      return true;
    };
    const anyVerifier = wire("verifier", "verifier-role-row", "verifier-role-fallback", "verifier-role-text", "核查");
    const anyPlanner = wire("planner", "planner-role-row", "planner-role-fallback", "planner-role-text", "规划");

    const visionRow = document.getElementById("vision-role-row");
    const visionText = document.getElementById("vision-role-text");
    if (visionRow && visionText) {
      const configured = Boolean(rm.vision?.configured);
      visionRow.classList.toggle("role-model-pill--muted", !configured);
      visionText.textContent = configured ? `识图 · ${rm.vision.model}` : "识图 · 未配置";
      visionRow.title = configured
        ? `图片由 ${rm.vision.model}（${rm.vision.provider}）通过 describe_image 工具处理`
        : "未配置视觉模型；图片仍可上传，但不提供 describe_image 工具";
    }

    const imageRow = document.getElementById("image-role-row");
    const imageText = document.getElementById("image-role-text");
    if (imageRow && imageText) {
      const configured = Boolean(rm.image?.configured);
      imageRow.classList.toggle("role-model-pill--muted", !configured);
      imageText.textContent = configured ? `生图 · ${rm.image.model}` : "生图 · 未配置";
      imageRow.title = configured
        ? `插图由 ${rm.image.model}（${rm.image.provider}）通过 generate_image 工具生成`
        : "未配置生图模型；不提供 generate_image 工具";
    }

    const hint = document.getElementById("role-models-hint");
    if (hint) {
      // 有实测依据的才说"更好"：D2 支持强 verifier，B3 证伪了强 planner
      hint.textContent = anyVerifier
        ? "独立角色模型可逐次关闭；关闭后跟随执行模型。识图与生图只作为工具接入。"
        : anyPlanner
          ? "独立角色模型可逐次关闭；关闭后跟随执行模型。"
          : "规划与核查跟随执行模型；识图与生图模型独立作为工具接入。";
    }
  }
}

function updatePackHint() {
  const row = document.getElementById("pack-row");
  if (!row || !harnessSnapshot?.availablePacks) return;
  const p = harnessSnapshot.availablePacks.find((x) => x.name === packSelect.value);
  if (!p) {
    row.title = "用默认提示与全部内置工具。选包后工具面和核查纪律跟着换。";
    return;
  }
  const bits = [
    p.description || p.name,
    `核查 ${p.verifyMode ?? "—"}`,
    p.hasRubric ? "自带评分表" : null,
    p.groundedConsult ? "有据咨询" : null,
    p.wantsWebSearch
      ? harnessSnapshot.webSearchConfigured
        ? "web_search 已配"
        : "web_search 未配"
      : null,
  ].filter(Boolean);
  row.title = bits.join(" · ");
}

if (packSelect) packSelect.addEventListener("change", updatePackHint);

// 计划模式 / 多 agent：localStorage 记住偏好
const PREF_PLAN = "agent.ui.pref.planMode";
const PREF_MULTI = "agent.ui.pref.multiAgent";
const PREF_WORKDIR = "agent.ui.pref.workdir";
const PREF_WORKDIR_EXTRAS = "agent.ui.pref.workdirExtras";
const PREF_WORKDIR_BY_FACE = "agent.ui.pref.workdirByFace";
const PREF_PROJECT = "agent.ui.pref.projectId";
const PREF_ALL_PROJECTS = "agent.ui.pref.sidebarAllProjects";
const PREF_AUTO_PACK = "agent.ui.pref.autoPack";
const PREF_WORKSPACE_FACE = "agent.ui.pref.workspaceFace";
function readPref(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    if (v === null) return fallback;
    return v === "1" || v === "true";
  } catch {
    return fallback;
  }
}
function writePref(key, on) {
  try {
    localStorage.setItem(key, on ? "1" : "0");
  } catch { /* ignore */ }
}
function readPrefString(key, fallback) {
  try {
    return localStorage.getItem(key) ?? fallback;
  } catch {
    return fallback;
  }
}
function writePrefString(key, value) {
  try {
    if (value) localStorage.setItem(key, value);
  } catch { /* ignore */ }
}
function clearPrefString(key) {
  try { localStorage.removeItem(key); } catch { /* ignore */ }
}

let lastWorkdirFaceSig = "";

function workdirListForFace(all) {
  return (Array.isArray(all) ? all : []).filter((dir) => workdirVisibleOnFace(dir, workspaceFace, runs));
}

function maybeRepaintWorkdirsForFace() {
  const source = harnessSnapshot?.availableWorkdirs;
  if (!Array.isArray(source) || !source.length) return;
  const sig = `${workspaceFace}\0${source.map((d) => `${d}\0${inferWorkdirFace(d, runs) ?? "*"}`).join("|")}`;
  if (sig === lastWorkdirFaceSig) return;
  lastWorkdirFaceSig = sig;
  paintWorkdirsForFace(source);
  const chosen = selectedComposerProject();
  if (chosen) applyProjectMembership(chosen, { keepCurrent: true });
}

function rememberWorkdirForFace(face) {
  if (!workdirSelect) return;
  const current = workdirSelect.value && workdirSelect.value !== WORKDIR_ADD_VALUE
    ? workdirSelect.value
    : "";
  if (!current) return;
  const map = { ...(readPrefJson(PREF_WORKDIR_BY_FACE, {}) || {}) };
  // T16：键从 office 改名 work；旧键读到就顺手丢掉，别留着两份各自漂移
  delete map.office;
  map[normalizeWorkspaceFace(face) ?? "code"] = current;
  writePrefJson(PREF_WORKDIR_BY_FACE, map);
}

function paintWorkdirsForFace(all) {
  if (!workdirSelect) return;
  const source = Array.isArray(all) && all.length
    ? all
    : (harnessSnapshot?.availableWorkdirs ?? []);
  if (!source.length) return;
  const visible = workdirListForFace(source);
  const pref = readPrefString(PREF_WORKDIR, "");
  const keep = workdirSelect.value && workdirSelect.value !== WORKDIR_ADD_VALUE
    ? workdirSelect.value
    : pref;
  const selected = pickWelcomeWorkdir({
    visible,
    keep,
    snapWorkdir: harnessSnapshot?.workdir,
    hostWorkdirIsHarness: Boolean(harnessSnapshot?.designMode?.hostWorkdirIsHarness),
    hasPref: Boolean(pref),
  });
  const extras = getWorkdirSelection(workdirSelect, source).extras
    .filter((d) => visible.some((v) => sameWorkdirPath(v, d)));
  renderWorkdirOptions(workdirSelect, visible, { selected: selected || "" });
  applyWorkdirSelection(workdirSelect, visible, {
    primary: workdirSelect.value,
    extras,
  });
  workdirComboboxApi?.paint();
  refreshWorkdirDependents();
}

function restoreWorkdirForFace(face) {
  if (!workdirSelect) return;
  const visible = [...workdirSelect.options]
    .map((o) => o.value)
    .filter((v) => v && v !== WORKDIR_ADD_VALUE);
  if (!visible.length) return;
  const map = readPrefJson(PREF_WORKDIR_BY_FACE, {}) || {};
  const key = normalizeWorkspaceFace(face) ?? "code";
  // T16 迁移兼容：旧存档的键是 office，读得到就用（写回时 rememberWorkdirForFace 会改名）
  const wanted = key === "work" ? (map.work ?? map.office) : map.code;
  const next = visible.find((d) => sameWorkdirPath(d, wanted)) ?? visible[0];
  const extras = getWorkdirSelection(workdirSelect, visible).extras
    .filter((d) => visible.some((v) => sameWorkdirPath(v, d)));
  applyWorkdirSelection(workdirSelect, visible, { primary: next, extras });
  writePrefString(PREF_WORKDIR, next);
  workdirComboboxApi?.paint();
  refreshWorkdirDependents();
}

function selectedComposerProject() {
  const id = projectSelect?.value ?? "";
  if (!id || id === PROJECT_ADD_VALUE) return null;
  return availableProjects.find((p) => p.id === id) ?? null;
}

function extrasFromProject(project, primary) {
  const root = String(primary ?? project.primaryWorkdir ?? "");
  return (project.workdirs ?? []).filter((dir) => !sameWorkdirPath(dir, root));
}

function applyProjectMembership(project, opts = {}) {
  if (!project || !workdirSelect) return;
  const all = harnessSnapshot?.availableWorkdirs ?? [];
  const list = workdirListForFace(all);
  if (!list.length) return;
  const current = workdirSelect.value && workdirSelect.value !== WORKDIR_ADD_VALUE
    ? workdirSelect.value
    : "";
  let primary = opts.keepCurrent
    ? composerCwdForProject(project, current)
    : (project.primaryWorkdir || composerCwdForProject(project, current));
  if (!list.some((d) => sameWorkdirPath(d, primary))) {
    primary = (project.workdirs ?? []).find((d) => list.some((v) => sameWorkdirPath(v, d)))
      ?? list[0];
  }
  const extras = extrasFromProject(project, primary)
    .filter((dir) => list.some((v) => sameWorkdirPath(v, dir)));
  applyWorkdirSelection(workdirSelect, list, {
    primary,
    extras,
  });
  writePrefString(PREF_WORKDIR, primary);
  writePrefJson(PREF_WORKDIR_EXTRAS, extras);
  workdirComboboxApi?.paint();
  void workspaceGitChipApi?.refresh();
  refreshWorkdirDependents();
}

function renderProjectOptions(selected) {
  if (!projectSelect) return;
  const keep = selected ?? projectSelect.value;
  projectSelect.replaceChildren();
  const leftover = document.createElement("option");
  leftover.value = "";
  // 委托方点名（2026-09-18 夜）："未入项（按目录）"是内部行话——Cowork 式入口
  // 显示「创建项目」；点开菜单里 ＋ 新建项目… 才是动作。
  leftover.textContent = "创建项目";
  projectSelect.appendChild(leftover);
  for (const project of availableProjects) {
    const opt = document.createElement("option");
    opt.value = project.id;
    opt.textContent = project.name;
    projectSelect.appendChild(opt);
  }
  const add = document.createElement("option");
  add.value = PROJECT_ADD_VALUE;
  add.textContent = "＋ 新建项目…";
  projectSelect.appendChild(add);
  projectSelect.value = availableProjects.some((p) => p.id === keep) ? keep : "";
}

function syncProjectSelectToWorkdir() {
  if (!projectSelect) return;
  const project = selectedComposerProject();
  if (!project) return;
  const primary = workdirSelect?.value && workdirSelect.value !== WORKDIR_ADD_VALUE
    ? workdirSelect.value
    : "";
  if (!primary) return;
  const inProject = (project.workdirs ?? []).some((dir) => sameWorkdirPath(dir, primary));
  if (!inProject) {
    projectSelect.value = "";
    clearPrefString(PREF_PROJECT);
  }
}

async function createProjectFromComposer() {
  const previous = readPrefString(PREF_PROJECT, "");
  const name = window.prompt("项目名称");
  if (!name || !name.trim()) {
    renderProjectOptions(previous);
    return;
  }
  const primary = workdirSelect?.value && workdirSelect.value !== WORKDIR_ADD_VALUE
    ? workdirSelect.value
    : "";
  if (!primary) {
    announceStatus("请先选一个工作目录再新建项目");
    renderProjectOptions(previous);
    return;
  }
  // 只快照当前主目录 + 此刻勾选的 extras。设为主不再把旧主目录勾回，
  // 所以这里不会把欢迎页默认的产品仓默默拍进成员。
  const extras = workdirSelect ? getWorkdirSelection(workdirSelect).extras : [];
  try {
    const res = await fetch("/api/projects", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: name.trim(),
        workdirs: [primary, ...extras],
        primaryWorkdir: primary,
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      announceStatus(humanizeActionFailure("新建项目", res.status, body?.error));
      renderProjectOptions(previous);
      return;
    }
    const created = body?.project;
    if (created?.id) {
      availableProjects = [...availableProjects.filter((p) => p.id !== created.id), created];
      if (harnessSnapshot) harnessSnapshot.availableProjects = availableProjects;
      writePrefString(PREF_PROJECT, created.id);
      renderProjectOptions(created.id);
      applyProjectMembership(created);
      refreshRunListView();
    }
  } catch (err) {
    announceStatus(`新建项目失败：${err instanceof Error ? err.message : String(err)}`);
    renderProjectOptions(previous);
  }
}
function readPrefJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed ?? fallback;
  } catch {
    return fallback;
  }
}
function writePrefJson(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch { /* ignore */ }
}
function setKnobDesc(id, short, long) {
  const hint = document.getElementById(id);
  if (hint) hint.textContent = short;
  const row = hint?.closest(".knob-row") ?? document.getElementById(`${id}-row`);
  if (row && long) row.title = long;
}
function syncPlanHint() {
  if (!planModeToggle) return;
  setKnobDesc(
    "mode-hint",
    planModeToggle.checked ? "出图后等人批准。日常对话、小修请关掉" : "拆解后等人批准",
    planModeToggle.checked
      ? "planner 出图后等人批准再跑。日常对话或单点小修是纯开销，建议改用普通模式。可与多 agent 同时开。"
      : "开 = planner 出图后等你批准再跑。可与多 agent 同时开。",
  );
}

/**
 * 附件上传（V-34）。
 *
 * 文件落进工作目录下的 uploads/，服务端返回**相对工作目录的路径**——那正是
 * agent 的工具能直接用的形式。上传完把路径追加进任务描述，模型才知道东西在
 * 哪；否则文件躺在磁盘上而它无从得知。
 *
 * 配了视觉模型时，图片可以直接让 describe_image 去看；没配的话上传仍然有用
 * （bash / read_file 处理文本与数据文件），只是看不了图。
 */
const uploaded = [];
/** 本稿的附件序号（A 簇：编号供按位置引用）。提交清稿时归零——编号是**每稿**的。 */
let attachSeq = 0;
const composerCompose = document.getElementById("composer-compose");
const composerMedia = document.getElementById("composer-media");

/** 在光标处插入一段文本并把光标推到插入内容之后（保持焦点）。 */
function insertAtCaret(el, text) {
  if (!el) return;
  const start = el.selectionStart ?? el.value.length;
  el.setRangeText(text, start, el.selectionEnd ?? start, "end");
  el.focus();
}

function renderUploads() {
  if (!uploadList) return;
  // 只把**已就绪**的图片挂进缩略图条：失败的还没有 attachNo，引用按钮
  // 会插出「Image #undefined」——Task 2 的引用路径假设条目已有编号。
  const images = uploaded.filter((u) => u.attachNo !== undefined && u.previewUrl && /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.path));
  if (composerMedia) {
    composerMedia.hidden = images.length === 0;
    composerMedia.innerHTML = images
      .map((u) => (
        `<button type="button" class="composer-media-preview" data-upload-cite="${u.attachNo}" ` +
        `title="插入引用 Image #${u.attachNo}" aria-label="插入 Image #${u.attachNo} 的引用">` +
        `<img src="${escapeHtml(u.previewUrl)}" alt="${escapeHtml(u.path)}" />` +
        `<span class="composer-media-no">${u.attachNo ?? ""}</span>` +
        `</button>`
      ))
      .join("");
  }
  composerCompose?.classList.toggle("composer-compose--media", images.length > 0);
  uploadList.hidden = uploaded.length === 0;
  uploadList.innerHTML = uploaded
    .map((u, i) => {
      const name = escapeHtml(u.path);
      // 图片说「Image #N」（用户正文里引用的就是这个词），非图说「附件 #N」。
      // 编号只在 attachNo 已存在时拼——上传中那会儿还没有编号，`?? ""` 会
      // 渲染出「Image #  0%」这种双空格怪样。门控照缩略图条那条
      // `attachNo !== undefined`（上传中/失败的条目压根不进缩略图）。
      const tag = u.attachNo !== undefined
        ? (u.previewUrl ? `Image #${u.attachNo}` : `附件 #${u.attachNo}`)
        : (u.previewUrl ? "图片" : "附件");
      // 非图附件**每个状态**都带类型图标（A4 的 chip 靠它认类型）；图片有缩略图，
      // 不需要。附：验收探针量的正是「有类型图标 + 有 附件 #N」同时成立。
      const icon = !u.previewUrl
        ? `<i class="ph ${attachmentIcon(u.path)}" aria-hidden="true"></i>`
        : "";
      if (u.status === "failed") {
        // 失败**说清原因**（文件过大 / 网络中断 / 已切走），并给一条出路
        // 超限是"文件本身不行"，重试解决不了——别给一个点了没反应的按钮
        // （预检会原样再拦一次、文案一字不变，用户会以为是自己点错了）。
        const canRetry = u.bytes <= UPLOAD_MAX_BYTES_CLIENT;
        const retryBtn = canRetry
          ? `<button type="button" class="btn btn--ghost upload-retry" data-upload-retry="${i}" ` +
            `title="重试" aria-label="重试上传 ${name}">重试</button>`
          : "";
        return `<li class="upload-item upload-item--failed">`
          + `${icon}<code>${name}</code> `
          + `<span class="upload-err">${escapeHtml(u.error ?? "上传失败")}</span> `
          + retryBtn
          + `<button type="button" class="btn btn--ghost upload-remove" data-upload-remove="${i}" `
          + `title="删除附件" aria-label="删除附件 ${name}">`
          + `<i class="ph ph-x" aria-hidden="true"></i></button></li>`;
      }
      if (u.status === "uploading") {
        return `<li class="upload-item"><span class="upload-no">${icon}${tag}</span> `
          + `<code>${name}</code> <span class="knob-hint">${u.progress}%</span></li>`;
      }
      const size = `<span class="knob-hint">${(u.bytes / 1024).toFixed(0)} KB</span>`;
      const previewBtn =
        `<button type="button" class="btn btn--ghost upload-preview" data-upload-preview="${i}" ` +
        `title="预览" aria-label="预览 ${name}">` +
        `<i class="ph ph-eye" aria-hidden="true"></i><span>预览</span></button>`;
      const removeBtn =
        `<button type="button" class="btn btn--ghost upload-remove" data-upload-remove="${i}" ` +
        `title="删除附件" aria-label="删除附件 ${name}">` +
        `<i class="ph ph-x" aria-hidden="true"></i></button>`;
      return `<li class="upload-item"><span class="upload-no">${icon}${tag}</span> <code>${name}</code> ${size} ${previewBtn}${removeBtn}</li>`;
    })
    .join("");
}

/**
 * 清单清空。合并之前这个数组**从来没被清过**——因为提交完页面重心就转走了，
 * 看不见。现在 composer 常驻底栏，不清的话上一次的附件清单会挂到下一次提交
 * 头上，一眼就能看出错。
 */
function clearUploads() {
  attachSeq = 0;
  if (uploaded.length === 0) return;
  for (const u of uploaded) {
    if (u.previewUrl) URL.revokeObjectURL(u.previewUrl);
  }
  uploaded.length = 0;
  renderUploads();
}

/**
 * 删除一个还没发出去的附件：清单移除 + 输入框里那行「附件：<path>」删掉 +
 * 盘上的文件删掉（DELETE /api/upload，服务端圈禁在白名单工作目录的 uploads/ 内）。
 *
 * 取舍：删除失败（例如文件已被某次提交用掉、或盘上已不在）时**只从清单移除、
 * 盘上保留**，并把情况说给用户——清单语义是"这次要附的东西"，盘上文件的
 * 去留不该让一次失败的删除把两边弄得不一致还说不出为什么。
 */
async function removeUploadedFile(index) {
  const u = uploaded[index];
  if (!u) return;
  uploaded.splice(index, 1);
  if (u.previewUrl) URL.revokeObjectURL(u.previewUrl);
  // 输入框里那条附件行一并删掉，模型才不会看到已删文件。
  // 用纯函数而不是内联过滤：格式有两种，两处各写一遍必然漂移。
  taskInput.value = stripAttachmentLine(taskInput.value, u.path);
  renderUploads();
  // 只有真正落过盘的条目才去删盘上的文件。
  // 失败/上传中的条目**从来没落过盘**，拿它的原始文件名去打 DELETE 只会得到一句
  // 「盘上文件保留」——而盘上本来就没有，那句话是假的（服务端也只许删 uploads/
  // 子目录内的文件，所以它必被拒）。落过盘的判据是**absolutePath 在不在**，
  // 不是 status==="done"：上传回来时用户已切走的那条会把 status 置成 failed，
  // 但文件**确实在原来的 uploads/** 里——按 status 判它永远删不掉，成静默孤儿
  // （切走分支把 info 也记进了 entry，absolutePath 在，这里能删到真文件）。
  // 清单与输入框在上面的 splice/strip 里已经清干净了，这里只是**别去删盘**。
  if (!u.absolutePath) {
    announceStatus(`已从清单移除 ${u.path}`);
    return;
  }
  try {
    const res = await fetch("/api/upload", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        path: u.absolutePath ?? u.path,
        ...(u.workdir ? { workdir: u.workdir } : {}),
      }),
    });
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      announceStatus(`已从清单移除，但盘上文件保留：${humanizeActionFailure("移除", res.status, b.error)}`);
    } else {
      announceStatus(`已删除附件 ${u.path}`);
    }
  } catch {
    announceStatus("已从清单移除；删除盘上文件失败（宿主不可达），文件保留");
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/**
 * 客户端的上传上限。**与服务端 ui/server.ts:2598 的 UPLOAD_MAX_BYTES 同源**——
 * 这条预检只为了"别把 20MB 白传一遍再被拒"，真正的闸在服务端，一步都不能省。
 * 两个数漂移会造出"本地过了、服务端拒"这种最难解释的失败；有一条测试钉着它们相等。
 */
const UPLOAD_MAX_BYTES_CLIENT = 20_000_000;

/**
 * 传一个文件，回报进度。
 *
 * 用 XHR 而不是 fetch：**fetch 没有上传进度**（没有 upload 流）。整条链路
 * 只有这一处需要进度，所以只在这一处换掉，别的 fetch 一律不动。
 *
 * @param {File} file
 * @param {string|undefined} workdir
 * @param {(pct:number)=>void} onProgress
 */
function uploadOne(file, workdir, onProgress) {
  return new Promise((resolve, reject) => {
    void (async () => {
      let body;
      try {
        const buf = await file.arrayBuffer();
        // 大文件用 chunk 转 base64——一次性 apply 整个数组会爆调用栈
        let binary = "";
        const view = new Uint8Array(buf);
        for (let i = 0; i < view.length; i += 0x8000) {
          binary += String.fromCharCode(...view.subarray(i, i + 0x8000));
        }
        body = JSON.stringify({
          name: file.name,
          data: btoa(binary),
          ...(workdir ? { workdir } : {}),
        });
      } catch (err) {
        reject(err);
        return;
      }
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/upload");
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
      };
      xhr.onload = () => {
        let parsed = null;
        try { parsed = JSON.parse(xhr.responseText); } catch { /* 非 JSON 就是失败 */ }
        if (xhr.status >= 200 && xhr.status < 300 && parsed) resolve(parsed);
        else reject(new Error(humanizeActionFailure("上传", xhr.status, parsed?.error)));
      };
      xhr.onerror = () => reject(new Error("网络中断（宿主不可达）"));
      xhr.onabort = () => reject(new Error("上传被中断"));
      xhr.send(body);
    })();
  });
}

/** 非图附件的类型图标（房子里的图标是 Phosphor，别用 unicode 图形）。 */
function attachmentIcon(path) {
  const ext = String(path).split(".").pop()?.toLowerCase() ?? "";
  if (["csv", "tsv"].includes(ext)) return "ph-chart-line";
  if (["xlsx", "xls"].includes(ext)) return "ph-table";
  if (ext === "pdf") return "ph-file-pdf";
  if (["zip", "tar", "gz", "7z"].includes(ext)) return "ph-file-zip";
  if (["md", "txt", "log"].includes(ext)) return "ph-file-text";
  return "ph-file";
}

/**
 * 传一条附件并落账。**首次上传与重试共用这一段**——
 * 序号分配、工作目录、at 快照、写输入框四处各算一遍是漂移的温床，
 * 而"重试"和"首次"除了入口以外**没有任何区别**。
 *
 * @param {{file: File, path: string, bytes: number, status: string, progress: number,
 *          error?: string, workdir?: string, attachNo?: number, autoCite?: boolean}} entry
 * @param {{at: {mode: string, runId: string|null}, targetWorkdir: string|undefined}} ctx
 */
async function uploadEntry(entry, ctx) {
  // 预检：别把 20MB 白传一遍再被服务端拒（服务端那一步仍然要跑，一步都不能省）
  if (entry.bytes > UPLOAD_MAX_BYTES_CLIENT) {
    entry.status = "failed";
    entry.error = `文件过大：${(entry.bytes / 1_000_000).toFixed(1)}MB 超过 ${(UPLOAD_MAX_BYTES_CLIENT / 1_000_000).toFixed(0)}MB 上限`;
    renderUploads();
    return;
  }
  try {
    const info = await uploadOne(entry.file, ctx.targetWorkdir, (pct) => {
      entry.progress = pct;
      renderUploads();
    });
    // 上传是 fire-and-forget 起手的。等它回来时用户可能已经切走了——
    // 那条路径属于另一个工作目录，写进现在的框里就是错配。
    if ((composerMode?.mode ?? "new") !== ctx.at.mode || (composerMode?.runId ?? null) !== ctx.at.runId) {
      // 文件**确实落过盘**（在原来的 uploads/ 里）——把 info 记进 entry
      // （path → uploads/…、absolutePath 有了），删附件那一下才真删得掉它。
      // 不记的话 absolutePath 一直是 undefined，removeUploadedFile 会按
      // 「没落过盘」跳过 DELETE，这文件就成了永远删不掉的静默孤儿。
      Object.assign(entry, info);
      entry.status = "failed";
      entry.error = `已上传到原来的工作目录（${info.path}），但你已经切换了对话——没有写进输入框`;
      renderUploads();
      return;
    }
    const attachNo = ++attachSeq;
    Object.assign(entry, info, { attachNo, status: "done", progress: 100 });
    // ★ 顺序不许反：**先插引用、再追加传输行**。
    // 反过来先赋值 `.value` 会把光标推到文末，insertAtCaret 就变成"插在全文末尾"。
    // ★ 焦点守卫也不许丢：输入框没焦点时 selectionStart 是 0，插进去会跑到全文最前面。
    // 这两条是 Task 2 的 fix round 2 挣来的（review 的 Minor 1），**本任务重写这段时
    // 必须原样保留**——计划正文写下时它们还不存在，故此处标注。
    // 单张才自动插引用；批量只给编号缩略图（A2 的设计）。autoCite 在建条目时定，
    // 因为"这一次传了几张"是那一次的信息，重试时不该重新判断。
    if (entry.autoCite && document.activeElement === taskInput) {
      insertAtCaret(taskInput, `Image #${attachNo} `);
    }
    // 把路径写进任务描述——模型只有看到路径才知道文件存在。
    // 带上编号：用户正文里写的「Image #2」才与某一条路径对得上。
    const line = `附件 #${attachNo}：${info.path}`;
    taskInput.value = taskInput.value ? `${taskInput.value}\n${line}` : line;
  } catch (err) {
    // 失败**留在清单里**带原因与重试。从前是 showSubmitError 后 continue——
    // 文件从清单里消失，用户只看到一句会飘走的错误，还得重新选一次文件。
    entry.status = "failed";
    entry.error = err?.message ?? "未知错误";
  }
  entry.autoCite = false;
  renderUploads();
}

async function uploadFiles(files) {
  showSubmitError(null);
  /**
   * 附件落在**哪个工作目录**取决于这次提交去哪儿。
   * 已打开的对话用那场会话绑定的路径；新建才用输入栏下拉。
   */
  const ctx = {
    at: { mode: composerMode?.mode ?? "new", runId: composerMode?.runId ?? null },
    targetWorkdir: composerMode?.workdirLocked
      ? (composerMode.workdir ?? workdirSelect?.value)
      : workdirSelect?.value,
  };
  // 先把每一条挂进清单（status="uploading"），用户立刻看得见"它在动"。
  // 从前是上传成功才 push——一个 20MB 的文件在传完之前，界面上什么都没有。
  const pending = files.map((file) => {
    const entry = {
      file,
      path: file.name,
      bytes: file.size,
      status: "uploading",
      progress: 0,
      workdir: ctx.targetWorkdir ?? undefined,
      previewUrl: file.type.startsWith("image/") ? URL.createObjectURL(file) : null,
      autoCite: files.length === 1 && file.type.startsWith("image/"),
    };
    uploaded.push(entry);
    return entry;
  });
  renderUploads();
  for (const entry of pending) await uploadEntry(entry, ctx);
}

/**
 * 重试一条失败的上传。数据还在内存里（`entry.file`），不必让用户重新选文件。
 * 传回**这条原本落在的那个工作目录**，不是当前下拉的值——它就是在那儿失败的。
 */
async function retryUpload(index) {
  const entry = uploaded[index];
  if (!entry?.file || entry.status === "uploading") return;
  entry.status = "uploading";
  entry.progress = 0;
  entry.error = undefined;
  renderUploads();
  await uploadEntry(entry, {
    at: { mode: composerMode?.mode ?? "new", runId: composerMode?.runId ?? null },
    targetWorkdir: entry.workdir,
  });
}

if (fileUpload) {
  fileUpload.addEventListener("change", () => {
    if (fileUpload.files?.length) void uploadFiles([...fileUpload.files]);
    fileUpload.value = "";
  });
}

// ---- 文件预览停靠面板 + 拖拽/粘贴上传（V-35，T10 升级为停靠形态）----
// 会话内打开文件一律走产物画布（右侧统一预览）。覆盖层只留给还没开对话时
// 看一眼刚上传的附件；渲染主体仍是 artifact-canvas 的 renderPreviewBody。
let filePreviewApi = /** @type {null|{ open:(o:{path:string,url:string})=>boolean, close:()=>void, isOpen:()=>boolean, isExpanded:()=>boolean, setExpanded:(b:boolean)=>void, element:HTMLElement }} */ (null);
try {
  filePreviewApi = initFilePreview({
    onAnnounce: (msg) => announceStatus(msg),
  });
} catch { /* 文件预览是增强项，初始化失败静默降级 */ }

/** 附件清单的「预览」：上传响应里的 absolutePath 直接做取件路径（白名单内的绝对路径） */
function previewUploadedFile(u) {
  if (!u) return;
  // 已在会话里：跟产物同一只右侧画布。还没开对话时才用覆盖层看一眼附件。
  if (selectedRunId && (u.path || u.absolutePath)) {
    openArtifactByPath(selectedRunId, u.path || u.absolutePath);
    return;
  }
  if (!filePreviewApi) return;
  const url = buildFilePreviewUrl({ path: u.absolutePath ?? u.path });
  filePreviewApi.open({ path: u.path, url });
}

/**
 * 对话正文里本地路径：一律进右侧画布（与产物卡同一只坞）。
 */
function previewLocalPath(runId, path) {
  openArtifactByPath(runId, path);
}

// 附件清单的预览/删除按钮（清单每次重画，逐个绑会漏也会重——事件委托）
if (uploadList) {
  uploadList.addEventListener("click", (e) => {
    const removeBtn = e.target instanceof Element ? e.target.closest("[data-upload-remove]") : null;
    if (removeBtn) {
      void removeUploadedFile(Number(removeBtn.getAttribute("data-upload-remove")));
      return;
    }
    const retryBtn = e.target instanceof Element ? e.target.closest("[data-upload-retry]") : null;
    if (retryBtn) { void retryUpload(Number(retryBtn.getAttribute("data-upload-retry"))); return; }
    const btn = e.target instanceof Element ? e.target.closest("[data-upload-preview]") : null;
    if (!btn) return;
    const u = uploaded[Number(btn.getAttribute("data-upload-preview"))];
    if (u) previewUploadedFile(u);
  });
}

// 点缩略图把「Image #N」插到光标处——A 簇的编号引用就靠这一下
composerMedia?.addEventListener("click", (e) => {
  const btn = e.target instanceof Element ? e.target.closest("[data-upload-cite]") : null;
  if (!btn) return;
  insertAtCaret(taskInput, `Image #${btn.getAttribute("data-upload-cite")} `);
});

// 拖拽/粘贴：只有真文件才接管上传；纯文本拖拽/粘贴还给浏览器默认行为。
// 拖拽落哪个工作目录、粘贴怎么命名——判定分别在 uploadFiles 与

      onAnnounce: (msg) => announceStatus(msg),

}

// 自定义菜单末项「＋ 添加目录…」打开浮层；加成功后重建选项并选中新目录。
// 浮层不进 hash 路由——它是瞬态的，刷新不该恢复。
let workdirPickerApi = /** @type {null|{ open:(p?:string|null)=>void, close:()=>void, isOpen:()=>boolean }} */ (null);
const workdirCombobox = document.getElementById("workdir-combobox");
if (workdirSelect) {
  try {
    workdirPickerApi = initWorkdirPicker({
      onAnnounce: (msg) => announceStatus(msg),
      onAdded: (path, payload) => {
        // 服务端应答带着最新合法集合；以它为准重建下拉并选中新目录
        const list = Array.isArray(payload?.workdirs) ? payload.workdirs : [path];
        if (harnessSnapshot) harnessSnapshot.availableWorkdirs = list;
        lastWorkdirFaceSig = "";
        paintWorkdirsForFace(list);
        const extras = getWorkdirSelection(workdirSelect).extras;
        const visible = workdirListForFace(list);
        if (path && visible.some((d) => sameWorkdirPath(d, path))) {
          applyWorkdirSelection(workdirSelect, visible, {
            primary: path,
            extras,
          });
        }
        writePrefString(PREF_WORKDIR, path);
        writePrefJson(PREF_WORKDIR_EXTRAS, extras);
        syncProjectSelectToWorkdir();
        workdirComboboxApi?.paint();
        void workspaceGitChipApi?.refresh();
      },
    });
    if (workdirCombobox) {
      workdirComboboxApi = initWorkdirCombobox(workdirCombobox, {
        onAddRequest: () => workdirPickerApi?.open(workdirSelect.value || null),
        onChange: (sel) => {
          writePrefString(PREF_WORKDIR, sel.primary);
          writePrefJson(PREF_WORKDIR_EXTRAS, sel.extras);
          syncProjectSelectToWorkdir();
          syncComposer();
          refreshRunListView();
          void workspaceGitChipApi?.refresh();
          void refreshGateChip();
          void refreshCiteCandidates();
          refreshWorkdirDependents();
          selectedCiteIds = [];
          paintCiteChips();
          hideCitePicker();
        },
      });
    }
    const gitChip = document.getElementById("workspace-git-chip");
    if (gitChip) {
      workspaceGitChipApi = initWorkspaceGitChip(gitChip, {
        getWorkdir: () => {
          const info = selectedRunId ? runs.find((r) => r.runId === selectedRunId) : null;
          if (info?.workdir) return info.workdir;
          if (!workdirSelect) return "";
          return getWorkdirSelection(workdirSelect).primary || workdirSelect.value || "";
        },
        getMcp: () => harnessSnapshot?.mcp ?? null,
        onAnnounce: (msg) => announceStatus(msg),
      });
      void workspaceGitChipApi?.refresh()?.then(() => refreshGithubPrReady().then(() => {
        if (mainPanel.classList.contains("is-welcome")) paintEmptyState();

}
