<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATHOM</title>
<link rel="icon" href="/fathom-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/phosphor/style.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/styles.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script>
// 主题在样式表生效前就定下来，否则从 localStorage 恢复暗色时会先闪一帧亮色。
// auto 不写 data-theme，交给 prefers-color-scheme；其余主题在首帧前显式恢复。
(function () {
  try {
    var t = localStorage.getItem("agent-ui-theme");
    if (["light", "dark", "graphite", "contrast"].indexOf(t) >= 0) {
      document.documentElement.setAttribute("data-theme", t);
    }
  } catch (e) { /* 隐私模式下 localStorage 可能抛错，忽略即可 */ }
})();
</script>
</head>
<body>

<!-- 页面级标题：屏幕阅读器靠 h1 建立文档大纲与"跳到标题"导航；视觉上由侧栏/
     详情页头承担，故 sr-only 隐藏。必须包在 header（banner 地标）里——裸 h1
     游离于所有地标之外会触发 axe region 规则（页面内容须归属地标） -->
<header class="sr-only">
  <h1>FATHOM</h1>
</header>

<!-- 侧栏：品牌 → 顶栏图标 → 分脸 → 新建 → 搜索 → 会话列表；其余工具留底栏。文件树在右侧。 -->
<aside class="sidebar" id="sidebar" data-workspace-face="work">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="sidebar-brand-mark" aria-hidden="true">
        <svg class="fathom-plumb" width="18" height="18" viewBox="0 0 24 24">
          <line class="fathom-tick" x1="6" y1="3" x2="6" y2="21" stroke-width="1.3"/>
          <line class="fathom-tick" x1="6" y1="7.5" x2="9" y2="7.5" stroke-width="1.5"/>
          <line class="fathom-tick" x1="6" y1="16.5" x2="9" y2="16.5" stroke-width="1.5"/>
          <line class="fathom-line" x1="16.8" y1="3" x2="16.8" y2="14" stroke-width="2"/>
          <circle class="fathom-bob" cx="16.8" cy="17" r="2.1"/>
        </svg>
      </span>
      <span class="sidebar-brand-copy">
        <strong>FATHOM<span class="fw-dot">.</span></strong>
      </span>
    </div>
    <button type="button" class="icon-btn sidebar-collapse-btn" id="sidebar-collapse"
      aria-label="隐藏侧栏" title="隐藏侧栏（Ctrl+B）" aria-keyshortcuts="Control+B Meta+B"
      aria-expanded="true">
      <i class="ph ph-caret-left" aria-hidden="true"></i>
    </button>
  </div>
  <div class="sidebar-top-tools">
    <button type="button" class="icon-btn notifications-btn" id="notifications-btn"
      aria-label="通知中心" aria-haspopup="dialog" aria-expanded="false">
      <i class="ph ph-bell" aria-hidden="true"></i>
      <span class="notifications-badge" id="notifications-badge" hidden>0</span>
    </button>
    <button type="button" class="home-spend" id="home-spend"
      aria-label="本机今日花费（全部工作目录）还在加载">
      <i class="ph ph-currency-dollar" aria-hidden="true"></i>
      <span data-spend-text>本机花费</span>
    </button>
    <div class="theme-picker" id="theme-picker">
      <button type="button" class="theme-toggle icon-btn" id="theme-toggle"
        aria-label="选择配色主题" aria-haspopup="menu" aria-expanded="false">
        <i class="ph ph-circle-half" aria-hidden="true"></i>
      </button>
      <div class="theme-menu" id="theme-menu" role="menu" aria-label="配色主题" hidden>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="auto">
          <i class="ph ph-circle-half" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>跟随系统</strong><small>自动匹配设备</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="light">
          <i class="ph ph-sun" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>暖纸</strong><small>低眩光浅色</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="dark">
          <i class="ph ph-moon" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>暖炭</strong><small>温暖深色</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="graphite">
          <i class="ph ph-stack" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>石墨</strong><small>中性深色</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
        <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="contrast">
          <i class="ph ph-circle-half-tilt" aria-hidden="true"></i>
          <span class="theme-option-copy"><strong>高对比</strong><small>更强文字与边界</small></span>
          <i class="ph ph-check theme-option-check" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="workspace-face" id="workspace-face" role="radiogroup" aria-label="工作区">
    <button type="button" class="workspace-face-tab is-selected" role="radio" id="workspace-face-work"
      data-workspace-face="work" aria-checked="true">Work</button>
    <button type="button" class="workspace-face-tab" role="radio" id="workspace-face-code"
      data-workspace-face="code" aria-checked="false">Code</button>
  </div>
  <div class="sidebar-search">
    <button type="button" class="btn btn--primary new-chat-btn" id="new-chat-btn">
      <i class="ph ph-plus" aria-hidden="true"></i>
      <span>新建对话</span>
    </button>
    <div class="run-search-row">
      <div class="run-search-field">
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <label for="run-search" class="sr-only">筛选对话列表，回车按正文全局搜索</label>
        <input type="search" id="run-search" class="run-search" placeholder="搜索对话…" autocomplete="off" />
      </div>
      <button type="button" class="icon-btn sidebar-filter-btn" id="sidebar-filter-btn"
        aria-label="筛选对话" aria-haspopup="true" aria-expanded="false">
        <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
      </button>
      <div class="sidebar-filter-menu" id="sidebar-filter-menu" hidden>
        <label class="sidebar-project-filter">
          <input type="checkbox" id="sidebar-all-projects" checked />
          全部项目
        </label>
        <select class="run-filter" id="run-filter" aria-label="按状态筛选对话">
          <option value="all">全部</option>
          <option value="running">运行中</option>
          <option value="done">已完成</option>
          <option value="failed">未通过</option>
        </select>
      </div>
    </div>
  </div>
  <!-- role=listbox / aria-label 由 renderRunList 动态挂载：listbox 必须含 option
       子项（aria-required-children），空态/加载态若静态带着 role 反而是 critical
       违规——这条是 axe 扫描器上线首跑抓到的（s3d 手工修复引入的新问题） -->
  <div id="run-list" class="run-list">
    <div class="run-list-empty">加载中…</div>
  </div>
  <div class="sidebar-footer sidebar-footer--icons">
    <button type="button" class="icon-btn" id="board-open-btn" aria-label="打开指挥中心">
      <i class="ph ph-squares-four" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn" id="artifacts-open-btn" aria-label="打开产物">
      <i class="ph ph-folder-open" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn" id="schedules-open-btn" aria-label="打开定时任务">
      <i class="ph ph-clock" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn memory-btn" id="memory-btn"
      aria-label="记忆" aria-haspopup="dialog" aria-expanded="false">
      <i class="ph ph-brain" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn" id="settings-open-btn" aria-label="打开设置">
      <i class="ph ph-gear" aria-hidden="true"></i>
    </button>
  </div>
</aside>
<button type="button" class="sidebar-expand" id="sidebar-expand" hidden
  aria-label="显示侧栏" title="显示侧栏（Ctrl+B）" aria-keyshortcuts="Control+B Meta+B"
  aria-expanded="false">
  <i class="ph ph-caret-right" aria-hidden="true"></i>
</button>

<!-- 主区 -->
<main class="main is-welcome" id="main-panel">
  <!-- R-05: aria-live 状态播报区域 -->
  <div id="status-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- 传输层状态条：断线只提示，不改运行状态、不作废挂起审批（V-05） -->
  <div id="reconnect-banner" class="reconnect-banner" role="status" hidden>
    连接中断，正在重连…（运行仍在服务端继续）
  </div>

  <!-- 内容区 + 预览停靠面板的横向容器（T10 升级：dock 是这里的 flex 子项，
       打开时对话主列被压缩但仍可见可交互；关闭时 dock display:none 不占位） -->
  <div id="center-row" class="center-row">
    <div id="main-area" class="content-area">
      <div class="empty-state empty-state--welcome">
        <p class="empty-eyebrow">Agent Console</p>
        <span class="empty-mark" aria-hidden="true">
          <svg class="fathom-plumb" width="46" height="46" viewBox="0 0 24 24">
            <line class="fathom-tick" x1="6" y1="2.5" x2="6" y2="21.5" stroke-width="1"/>
            <line class="fathom-tick" x1="6" y1="5.2" x2="9.6" y2="5.2" stroke-width="1.1"/>
            <line class="fathom-tick" x1="6" y1="9.4" x2="9.6" y2="9.4" stroke-width="1.1"/>
            <line class="fathom-tick" x1="6" y1="13.6" x2="9.6" y2="13.6" stroke-width="1.1"/>
            <line class="fathom-tick" x1="6" y1="17.8" x2="9.6" y2="17.8" stroke-width="1.1"/>
            <line class="fathom-line" x1="16.6" y1="2.5" x2="16.6" y2="14" stroke-width="1.6"/>
            <circle class="fathom-bob" cx="16.6" cy="17.4" r="1.9"/>
          </svg>
        </span>
        <p class="empty-brand">FATHOM<span class="fw-dot">.</span></p>
        <span class="empty-depthline" aria-hidden="true"></span>
      </div>
    </div>
    <!-- 右列：**唯一 owner**（P1 空间契约）。
         此前文件树与预览坞是 #center-row 的两个平行 flex 子项，各写各的宽度契约
         （树 clamp(200,22vw,280) 且零 @media；坞 38% 自带 900 断点），
         谁都不负责「对话至少得多宽」。现在两者都是 #right-rail 的面板，
         宽度/折叠/选哪个面板只有一份记忆，边界由 core/rail-policy.js 按预算算。 -->
    <div id="right-rail" class="right-rail" data-mode="side" data-layout="docked" data-surface="tree" data-collapsed="false">
      <!-- 收起键仍是右列的直接子节点（不在这排钮里）：一次一只的那排钮随面走，
           而收起键要在每一只面下都在。绝对定位浮在右上角，两种形态都在。
           召出钮行不住在列里（挂在 app.js 的对话头部 .back-bar）——列一关就再
           没有那个键，任务 4 的「再点同一个键」才可能成立（计划 4 · T3 的 3-H）。 -->
      <button type="button" class="right-rail-collapse" id="right-rail-collapse"
        aria-label="收起右列" title="收起右列" aria-expanded="true"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
      <div class="right-rail-drag" id="right-rail-drag" role="separator" aria-orientation="vertical"
        aria-label="拖动调整右列宽度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" tabindex="0"></div>
      <!-- 右侧工作区文件：Work/Code 都有。展开走 /api/workspace/files?q=dir/。
           不用 role=tree——空态没有 treeitem 会撞 aria-required-children（与 run-list 同族）。 -->
      <aside id="workspace-file-tree" class="files-rail workspace-file-tree" aria-label="工作区文件"></aside>
      <!-- 预览坞占位：preview-dock.js 把自己挂进来（原先是 #center-row，见其 host 解析） -->
      <div id="right-rail-preview" class="right-rail-preview"></div>
      <!-- 「改动」审阅面板占位（计划 3 · T7）：与卡片同一套已阅/撤掉/下一个 hunk 动作。
           一次一只：surface="review" 时由 CSS 显形（tabbed/split 已随计划 4 拆掉）。 -->
      <div id="right-rail-review" class="right-rail-review"></div>
    </div>
    <!-- 窄档把手：收起=0 宽时全站唯一的重开入口（二轮走查实锤：此前收起即断头路）。
         角标 = 有新内容没看（railVisibility 的 badge）。 -->
    <button type="button" id="right-rail-handle" class="right-rail-handle" hidden
      aria-label="打开右列" title="打开右列"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
    <!-- 窄档 sheet 的遮罩：floating 且打开时可见（第三档 side+floating 也亮）；点它 = 关闭 -->
    <div id="right-rail-scrim" class="right-rail-scrim" hidden></div>
  </div>
  <!-- 跳转箭头：**在滚动容器之外**，所以它自己不会被滚走。
       ↓ 回到底部（流式时往上翻过之后用）。 -->
  <div id="scroll-nav" class="scroll-nav">
    <button type="button" class="scroll-nav-btn" data-nav="bottom" hidden aria-label="回到最新"><i class="ph ph-arrow-down" aria-hidden="true"></i></button>
  </div>

  <!-- 需你决定：钉在输入框正上方，**在滚动容器之外**。
       它不随内容滚走——这正是委托方那条反馈的结构解法。 -->
  <div id="action-dock" class="action-dock" hidden></div>

  <!-- 提交栏：**在底部**，且**一个框两种去向**（都来自委托方反馈）。
       在底部的理由不只是习惯：待办钉在输入框上方 = 固定可见位置，新审批出现在
       哪都看得见，从结构上消掉了"内容变高把待办推出视野"那个问题。
       共用一个框的理由：分开纯粹是实现遗留（一个打 /api/runs、一个打 /messages），
       对用户来说它们长得一样、位置也挨着。选中一个可续跑的运行 → 「继续对话」，
       没选中 → 「发送」；文案、placeholder、说明行、data-mode 四处一起变。
       派生逻辑在 app.js 的 deriveComposerMode / patchComposer 里（因此可测）。
       新建对话时 #main-panel.is-welcome 把同一份表单抬到中央，不搬 DOM。
       胶囊铬（chip / 图标发送 / 紧凑输入）对话态与欢迎态共用；欢迎只多居中和起步卡。 -->
  <form id="submit-form" class="submit-bar" autocomplete="off">
    <!-- 上排控件（项目 / 工作目录 / 模型 / 运行设置）收成一行摘要（2026-09-18 回走
         §2.4）：默认收起，点开才是控件本体。摘要写「当前装的是什么」，由
         deriveScopeSummary 从控件文字派生（观察器跟进，别处更新文字不必记得这里）。 -->
    <details class="composer-scope" id="composer-scope">
      <!-- 能力条（2026-09-19 三轮走查 L1）：**必须在 summary 里**。
           为什么：收起的 details 里，#composer-scopebar 仍有布局盒（author 的
           display:flex 压过 UA 对折叠内容的隐藏），它溢进输入行那一条 y 带、
           被透明的 TEXTAREA#task-input 接走点击——挂那儿等于挂进柜子里
           （计划 3 · T1 把那个盒子用 display:none 掐掉了，但"能挂的只有
           summary"这条结论不变）。这里只放弱态（看不见图 / 核查关），
           由 capabilityChips 过滤，常态零占位。 -->
      <summary class="composer-scope-summary" id="composer-scope-summary" title="项目 / 工作目录 / 模型"><span class="composer-scope-text">选项目、目录与模型</span><span class="composer-capability" id="composer-capability-chips" hidden></span></summary>
      <div class="composer-scopebar" id="composer-scopebar">
      <div class="scope-field scope-field--project" id="project-field">
        <i class="ph ph-briefcase" aria-hidden="true"></i>
        <label class="sr-only" for="project-select">项目</label>
        <select id="project-select" class="wd-trigger" aria-label="项目">
          <option value="">创建项目</option>
        </select>
      </div>
      <div class="scope-field scope-field--workdir" id="workdir-combobox">
        <i class="ph ph-folder-simple" aria-hidden="true"></i>
        <label id="workdir-label" class="sr-only" for="workdir-trigger">工作目录</label>
        <select id="workdir-select" class="sr-only" tabindex="-1" aria-hidden="true"></select>
        <button type="button" id="workdir-trigger" class="wd-trigger" aria-expanded="false" aria-controls="workdir-menu">
          <span id="workdir-trigger-text" class="wd-trigger-text">选择目录</span>
          <i class="ph ph-caret-down" aria-hidden="true"></i>
        </button>
        <div id="workdir-menu" class="wd-menu" hidden></div>
      </div>
      <!-- workspace-git-chip 类是 body[data-face] 两脸规则的挂钩（方案 A）；
           scope-field--git 是与其他 scope 共享的布局类，留着不混 -->
      <div class="scope-field scope-field--git workspace-git-chip" id="workspace-git-chip" hidden>
        <i class="ph ph-git-branch" aria-hidden="true"></i>
        <label id="workspace-git-label" class="sr-only" for="workspace-git-trigger">当前分支</label>
        <button type="button" id="workspace-git-trigger" class="wd-trigger"
          aria-expanded="false" aria-controls="workspace-git-menu" aria-labelledby="workspace-git-label">
          <span id="workspace-git-trigger-text" class="wd-trigger-text">—</span>
          <i class="ph ph-caret-down" aria-hidden="true"></i>
        </button>
        <div id="workspace-git-menu" class="wd-menu git-menu" hidden></div>
      </div>
      <div class="model-picker" id="executor-model-picker">
        <span class="composer-caption sr-only" id="executor-model-caption">模型</span>
        <button type="button" id="executor-model-trigger" class="model-picker-trigger"
          aria-haspopup="listbox" aria-expanded="false"
          title="切换执行模型会按该模型的上下文窗口重算水位；进行中的这一轮不受影响">
          <span id="executor-model-trigger-text" class="model-picker-value">加载中</span>
          <i class="ph ph-caret-down" aria-hidden="true"></i>
        </button>
        <div id="executor-model-menu" class="model-picker-menu" hidden role="presentation">
          <div class="model-picker-panel">
            <input type="search" id="executor-model-search" class="model-picker-search"
              placeholder="搜索模型…" autocomplete="off" aria-label="搜索模型" />
            <ul id="executor-model-list" class="model-picker-list" role="listbox" aria-label="执行模型"></ul>
            <button type="button" id="executor-model-manage" class="model-picker-manage">
              <i class="ph ph-plus" aria-hidden="true"></i>
              <span>管理模型…</span>
            </button>
          </div>
          <aside id="executor-model-detail" class="model-picker-detail" hidden aria-live="polite"></aside>
        </div>
        <select id="executor-model-select" class="sr-only" tabindex="-1" aria-hidden="true"></select>
        <span class="sr-only" id="executor-role-text">执行模型</span>
      </div>
      <div class="role-models" id="role-models-knob">
        <span class="composer-caption" id="role-models-label">角色</span>
        <div class="role-toggles" role="group" aria-labelledby="role-models-label">
          <label class="role-model-pill role-model-pill--toggle" id="planner-role-row" hidden>
            <input type="checkbox" id="use-planner-model" checked />
            <span id="planner-role-text"></span>
          </label>
          <span class="role-model-pill role-model-pill--muted" id="planner-role-fallback">
            <i class="ph ph-tree-structure" aria-hidden="true"></i>
            <span>规划 · 跟随执行</span>
          </span>
          <label class="role-model-pill role-model-pill--toggle" id="verifier-role-row" hidden>
            <input type="checkbox" id="use-verifier-model" checked />
            <span id="verifier-role-text"></span>
          </label>
          <span class="role-model-pill role-model-pill--muted" id="verifier-role-fallback">
            <i class="ph ph-check-circle" aria-hidden="true"></i>
            <span>核查 · 跟随执行</span>
          </span>
          <span class="role-model-pill role-model-pill--muted" id="vision-role-row">
            <i class="ph ph-image" aria-hidden="true"></i>
            <span id="vision-role-text">识图 · 未配置</span>
          </span>

 * 重新点开（rememberPreviewFile）即恢复。
 */
const dismissedPreviewFiles = new Map(); // runId -> Set<string>

function rememberPreviewFile(runId, path) {
  const want = String(path ?? "").trim();
  if (!runId || !want) return;
  const dismissed = dismissedPreviewFiles.get(runId);
  if (dismissed) {
    dismissed.delete(want);
    if (dismissed.size === 0) dismissedPreviewFiles.delete(runId);
  }
  const list = extraPreviewFiles.get(runId) ?? [];
  if (list.some((f) => f.path === want)) return;
  extraPreviewFiles.set(runId, [...list, {
    path: want,
    kind: isBrowserPreviewPath(want) ? "browser" : "preview",
  }]);
}

/**
 * 这一场的预览标签条 = **这场对话的产物 ∪ 用户点开过的**，再减去用户关掉的。
 *
 * 从前这里只有「用户点开过的」，于是产物条里看得见的东西在画布标签条里
 * 找不到；代码里为此打了个补丁（`openPendingArtifact` 在标签条为空时手动
 * 从 `currentRunArtifacts` 挑一个塞进去）。那个特例就是两套清单不该分开的证据。
 *
 * 用既有的两个纯函数接上，不新增机制：
 *   · `selectPreviewArtifacts` —— 滤掉核查脚本与 node_modules
 *   · `ensurePreviewArtifact`  —— 已在里面就回原位，否则追加到末尾
 *
 * **kind 一律归一**：画布只认 `browser` / `preview` 两种，而
 * `deriveSessionFiles` 给的是 `upload` / `artifact`——不归一的话画布会按
 * 未知取值分派。判据与 `rememberPreviewFile` 逐字相同，只此一处。
 */
const asPreviewTab = (path) => ({
  path: String(path ?? ""),
  kind: isBrowserPreviewPath(path) ? "browser" : "preview",
});

/**
 * 标签条缓存 stamp 的底料：谱系链（continuedFrom）上每一场的 timeline 长度
 * 与 lastSeq——都从 state 上直接读（O(1)），不碰任何一条时间线事件。合并清单
 * 只随这两样变：时间线只追加不原地改，重放是同一批事件得出同一份状态；
 * runId 也拼进 stamp——链上换了成员、新成员长度恰与旧成员相同时，纯长度串
 * 会撞键。链长 = 一场对话的续跑次数（1~3），走链是 O(链长) 而不是 O(事件数)。
 */
function previewTabStamp(runId) {
  const byId = new Map((runs ?? []).map((r) => [r.runId, r]));
  const seen = new Set();
  const parts = [];
  let cur = runId;
  while (cur && !seen.has(cur)) {
    seen.add(cur);
    const st = runStates.get(cur);
    parts.push(`${cur}:${st?.timeline?.length ?? 0}:${st?.lastSeq ?? 0}`);
    cur = byId.get(cur)?.continuedFrom;
  }
  return parts.join("|");
}

/**
 * 标签条的缓存。**这不是优化项**：`openedPreviewArtifacts` 有 5 个调用点
 * （grep 数出来的，不是抄计划——计划里写的 7 是错的；删掉 openPendingArtifact
 * 的手动塞标签特例后从 6 处变 5 处），
 * 其中 `initArtifactCanvas` 的 `getArtifacts` 在画布的渲染路径上。
 * 改之前它是一次 Map 查；改之后它是"把整条时间线走一遍"——不缓存的话，
 * 长 run 上每帧走一遍时间线是实打实的退化。
 */
const previewTabsCache = new Map(); // runId -> { stamp: string, list: {path, kind}[] }

function openedPreviewArtifacts(runId) {
  if (!runId) return [];
  const mine = extraPreviewFiles.get(runId) ?? [];
  const dismissed = dismissedPreviewFiles.get(runId);
  // 键的 mine/dismissed 两段用**内容**、不用长度：forgetPreviewFile 会把路径
  // 从 mine 里 filter 掉——账本可增可删，长度键不单射。今天的代码里每次
  // 账本变更都紧跟一次派生（缓存单条目、每步覆写），长度键还撞不出旧清单；
  // 但那个不变式没写在脸上，「改完账本没立刻派生」的新路径会让长度键绕回
  // 旧值、撞上旧缓存（review 的五步序列按今天的代码推演，第 5 步比对的是
  // 第 4 步写的键——第 3 步的旧清单早被覆写了；推演与活页证据见
  // task-6-report.md 的 Fix round 1）。内容键把这个危险整类去掉。
  // 路径里不可能出现 \x00，按序 join 不歧义；dismissed 排序后才是确定串。
  // 手动账本只有几件，O(件数) 可忽略。
  const mineSig = mine.map((f) => f.path).join("\x00");
  const disSig = dismissed ? [...dismissed].sort().join("\x00") : "";
  const stamp = `${previewTabStamp(runId)}|${mineSig}|${disSig}`;
  const hit = previewTabsCache.get(runId);
  if (hit && hit.stamp === stamp) return hit.list;

  // 顺序：这一场的产物在前（它就是这一场的目录），手动点开过的补在后面。
  // 关掉的先滤掉：产物条点开 = rememberPreviewFile 先解 dismissed 再并清单，
  // 所以「关掉」的恢复路径与首次点开同一条，不另开机制。
  let list = selectPreviewArtifacts(currentRunArtifacts(runId))
    .map((f) => asPreviewTab(f.path))
    .filter((t) => !dismissed?.has(t.path));
  for (const f of mine) {
    if (dismissed?.has(f.path)) continue;
    list = ensurePreviewArtifact(list, f.path).list.map((t) => asPreviewTab(t.path));
  }

  previewTabsCache.set(runId, { stamp, list });
  return list;
}

function forgetPreviewFile(runId, path) {
  const want = String(path ?? "").trim();
  if (!runId || !want) return;
  const next = (extraPreviewFiles.get(runId) ?? []).filter((f) => f.path !== want);
  if (next.length) extraPreviewFiles.set(runId, next);
  else extraPreviewFiles.delete(runId);
  const dismissed = dismissedPreviewFiles.get(runId) ?? new Set();
  dismissed.add(want);
  dismissedPreviewFiles.set(runId, dismissed);
}

function closePreviewTab(index) {
  if (!selectedRunId) return;
  const list = openedPreviewArtifacts(selectedRunId);
  const closed = list[index];
  if (!closed) return;
  const current = artifactCanvasApi?.currentIndex() ?? index;
  forgetPreviewFile(selectedRunId, closed.path);
  const remaining = openedPreviewArtifacts(selectedRunId).length;
  const next = indexAfterCloseTab(current, index, remaining);
  if (next < 0) {
    closeArtifactRoute();
    return;
  }
  openArtifactByIndex(selectedRunId, next);
}

function currentRunArtifacts(runId) {
  const state = runStates.get(runId);
  const thread = deriveThreadFiles(runs, runStates, runId);
  const files = thread.length ? thread : (state ? deriveSessionFiles(state) : []);
  return selectPreviewArtifacts(files);
}

/** 下标 → 深链 ref：写出去的地址一律按路径（清单在手边，直接查；查不到退回数字形态）。 */
function artifactRefForIndex(runId, index) {
  const item = openedPreviewArtifacts(runId)[index];
  return item ? { path: item.path } : index;
}

/**
 * 打开画布：走 hash 路由，浏览器前进/后退天然可用。
 * 写出去的地址是**路径形态**（计划 3 · T5）——下标会随会话状态位移，
 * 路径不会。`full` 只在深链恢复时给布尔（强制与 hash 一致）；其余调用
 * 不传——openCanvas 省略 full 是「保持现状」，点产物不该把放大态缩回去。
 */
function openArtifactByIndex(runId, index, opts = {}) {
  const list = openedPreviewArtifacts(runId);
  if (!runId || list.length === 0) return;
  enteredCanvasFromApp = true;
  const at = wrapIndex(index, list.length);
  const wantFull = typeof opts?.full === "boolean" ? opts.full : undefined;
  // ?full 是深链的一部分：剥掉它，刷新就会从放大态缩回停靠态。
  const target = encodeArtifactHash(runId, artifactRefForIndex(runId, at), { full: Boolean(wantFull) });
  if (location.hash === target) {
    artifactCanvasApi?.open(index, wantFull === undefined ? undefined : { full: wantFull });
    return;
  }
  location.hash = target;
}

/** 任何路径都进右侧画布：只把这一份记成标签，不把整场文件都展开。
 *  @returns {boolean} 是否真的开上了（走画布那条路为 true，「找不到」为 false）——
 *   openPendingArtifact 靠它决定 pending 清不清：用「pendingArtifact 有没有被替换」
 *   判成败是错的（成功时不替换，判据永不为真，每次渲染都会重开一次画布）。 */
function openArtifactByPath(runId, path, opts = {}) {
  const want = String(path ?? "").trim();
  if (!runId || !want) {
    announceStatus("找不到该产物");
    return false;
  }
  rememberPreviewFile(runId, want);
  const resolved = resolveArtifactOpen(openedPreviewArtifacts(runId), want);
  if (resolved.mode === "canvas") {
    openArtifactByIndex(runId, resolved.index, opts);
    return true;
  }
  announceStatus("找不到该产物");
  return false;
}

/**
 * 深链/切换落点：数据够了就开，不够就留着 pending 等下一次渲染。
 * 从前这里还有一个特例——标签条为空时手动从 currentRunArtifacts 挑一个塞进去；
 * 那是「两套清单不互通」打的补丁。标签条现在天然含这一场的产物，那个特例已经删掉。
 *
 * **深链在计划 3 · T5 之后是按路径的**（`#/run/<id>/artifact/<转义路径>`）：
 * 从前按下标时，"合并清单的下标"会随会话状态整体位移，而 wrapIndex 把越界
 * 取模兜住——**静默指到另一个文件，不报错**。数字形态仍然认（历史链接），
 * 但新写出去的一律是路径。
 */
function openPendingArtifact() {
  if (!pendingArtifact) return;
  const { runId, path, index, full } = pendingArtifact;
  if (runId !== selectedRunId) return;
  // 路径形态：走已有的那条"路径 → 下标"的解析（它会把这一份记成标签）。
  // full 一并带下去：放大态深链（?full）刷新后仍要放大——openArtifactByIndex
  // 会把 ?full 写回地址（「?full 往返，刷新保持形态」是既有契约）。
  if (path !== null && path !== undefined) {
    // openArtifactByPath 返回"是否真的开上了"——不能用 pendingArtifact 有没有被替换来判：
    // 成功时它不会替换 pendingArtifact，那个判据永不为真，于是每次渲染都会重开一次画布
    // （重取内容 / 重置 deck 位置 / 并且抢焦点——openCanvas 末尾会 dock.closeBtn.focus()）。
    if (openArtifactByPath(runId, path, { full: Boolean(full) })) pendingArtifact = null;
    // 没开成（找不到）就留着等下一次渲染
    return;
  }
  // 旧的下标形态：原样
  if (artifactCanvasApi?.open(index, { full: Boolean(full) })) pendingArtifact = null;
}

/** 关掉预览就是回会话，不沿着「上一份文件」往回退。 */
function closeArtifactRoute() {
  enteredCanvasFromApp = false;
  const runId = selectedRunId;
  const next = artifactExitHash(runId, normalizeTab(activeTabs.get(runId)));
  if (location.hash === next) {
    artifactCanvasApi?.close();
    pendingArtifact = null;
    return;
  }
  const url = new URL(location.href);
  url.hash = next;
  history.replaceState(null, "", url);
  artifactCanvasApi?.close();
  pendingArtifact = null;
}

function replaceArtifactHash(target) {
  if (location.hash === target) return;
  const url = new URL(location.href);
  url.hash = target;
  history.replaceState(null, "", url);
  applyHash();
}

/** 「预览最近产物」只在有产物的会话里出现在命令面板（同 syncChangesCommand 纪律） */
function syncArtifactCommand() {
  const has = Boolean(selectedRunId) && currentRunArtifacts(selectedRunId).length > 0;
  if (has && artifactCanvasApi && !unregisterArtifactCommand) {
    import("./features/command-palette.js").then((palette) => {
      // 再次确认选中态——import 是异步的，期间用户可能已返回列表
      if (!selectedRunId || unregisterArtifactCommand) return;
      unregisterArtifactCommand = palette.registerPaletteCommand({
        id: "preview-latest-artifact",
        label: "预览最近产物",
        hint: "在画布中打开本次运行最近写出的产物（点标签切换）",
        icon: "ph-eye",
        run: () => {
          const list = selectedRunId ? currentRunArtifacts(selectedRunId) : [];
          if (list.length > 0) openArtifactByPath(selectedRunId, list[list.length - 1].path);
        },
      });
    }).catch(() => { /* 命令面板注册失败不影响画布本体 */ });
  } else if (!has && unregisterArtifactCommand) {
    unregisterArtifactCommand();
    unregisterArtifactCommand = null;
  }
}

  panel.addEventListener("click", (e) => {

      workdirSelect?.focus();
      workdirSelect?.showPicker?.();
      return;
    }

    if (tourBtn) {
      onboardingApi?.replay();
      return;
    }
    const exitDesign = e.target.closest?.("[data-design-mode-exit]");
    if (exitDesign) {
      exitDesignMode();
      return;
    }
    const moreDrafts = e.target.closest?.("[data-work-more]");
    if (moreDrafts) {
      openWorkCatalog();
      return;
    }
    const enterDesign = e.target.closest?.("[data-design-mode-enter]");
    if (enterDesign) {
      applyWorkspaceFace("work");
      openWorkCatalog();
      return;
    }
    const tabChip = e.target.closest?.("[data-design-tab]");
    if (tabChip) {
      selectedDesignTab = tabChip.getAttribute("data-design-tab");
      selectedDesignFilePack = null;
      designRouteHint = null;
      applyDesignTabDefaults(selectedDesignTab, { fillPrompt: false });
      if (isDesignSamplePrompt(taskInput.value) || isDesignTemplatePrompt(taskInput.value)) {

        syncWelcomeComposerField();

      paintEmptyState();
      paintDesignTemplateChip();

    }
    const sampleCard = e.target.closest?.("[data-design-sample]");
    if (sampleCard) {
      if (sampleCard.disabled || sampleCard.getAttribute("aria-disabled") === "true") return;
      applyDesignSample(sampleCard.getAttribute("data-design-sample"), { toggle: true });

    }
    const lookChip = e.target.closest?.("[data-design-look]");
    if (lookChip) {
      applyDesignLook(lookChip.getAttribute("data-design-look"), { toggle: true });
      return;
    }
    const typeChip = e.target.closest?.("[data-design-id]");
    if (typeChip) {
      const id = typeChip.getAttribute("data-design-id");
      selectedDesignId = selectedDesignId === id ? null : id;
      selectedDesignSample = null;
      selectedDesignFilePack = null;
      designRouteHint = null;
      paintEmptyState();

    const packChip = e.target.closest?.("[data-design-file-pack]");
    if (packChip) {

    const tpl = e.target.closest?.("[data-design-template]");
    if (tpl) {

    syncWelcomeComposerField();
    syncComposer();
  });
})();

(function bindScrollNav() {
  const scroller = document.getElementById("main-area");
  const nav = document.getElementById("scroll-nav");
  if (!scroller || !nav) return;
  scroller.addEventListener("scroll", syncScrollNav, { passive: true });
  nav.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-nav]");
    if (!btn) return;
    /**
     * **落点用直接赋值，平滑交给 CSS 的 `scroll-behavior`。**
     *
     * 不在 JS 里写 `behavior:"smooth"`：那样"要不要动画"这件事就散在两处
     * （JS 一处、CSS 一处），而 `prefers-reduced-motion` 只管得住 CSS 那处。
     * 现在 JS 只负责"滚到哪"，动不动画由样式表统一决定——
     * **动效可以降级，落点不能。**
     *
     * 附一条自动化验证的边界（省得下一个人重复踩）：本项目的浏览器自动化面板
     * 不合成画面，**任何带动画的滚动在那里都不会推进**（scrollTop 停在原地且
     * 不报错），所以验证落点必须临时把 `scroll-behavior` 置成 auto 再量。
     * 我第一次就是没意识到这点，差点把它当成产品缺陷记下来。
     */
    if (btn.getAttribute("data-nav") === "bottom") {
      scroller.scrollTop = scroller.scrollHeight;
    }
    syncScrollNav();
  });
})();

// 的文字各有各的更新路径，逐个挂钩子迟早漏一个；观察的是**结果**，不是路径。
(function bindComposerScopeSummary() {
  const details = document.getElementById("composer-scope");
  const summary = document.getElementById("composer-scope-summary");
  const bar = document.getElementById("composer-scopebar");
  if (!details || !summary || !bar) return;
  const textEl = summary.querySelector(".composer-scope-text") ?? summary;
  const readText = (sel) => document.querySelector(sel)?.textContent ?? "";
  const sync = () => {
    textEl.textContent = deriveScopeSummary({
      project: document.querySelector("#project-select")?.selectedOptions?.[0]?.textContent ?? "",
      workdir: readText("#workdir-trigger-text"),
      model: readText("#executor-model-trigger-text"),
    });
  };
  new MutationObserver(sync).observe(bar, {
    childList: true,
    subtree: true,
    characterData: true,
    attributes: true,
    attributeFilter: ["hidden"],
  });
  sync();
  const SCOPE_KEY = "agent.ui.pref.composerScope";
  try {
    // 记住的是**展开**：默认收起（回走的密度反馈），展开过一次的用户不必每轮再点
    details.open = localStorage.getItem(SCOPE_KEY) === "1";
  } catch { /* 偏好读不到就用默认收起 */ }
  details.addEventListener("toggle", () => {
    try {
      if (details.open) localStorage.setItem(SCOPE_KEY, "1");
      else localStorage.removeItem(SCOPE_KEY);
    } catch { /* 写不进去不影响展开本身 */ }
  });
})();

function sidebarIsHidden() {

  const hidden = sidebarIsHidden();

    sidebarExpandBtn.setAttribute("aria-expanded", String(!hidden));
  }
  if (sidebarCollapseBtn) {
    sidebarCollapseBtn.setAttribute("aria-expanded", String(!hidden));
  }
}

function setSidebarCollapsed(collapsed, { persist = true } = {}) {
  document.body.classList.toggle("sidebar-collapsed", Boolean(collapsed));
  if (persist) writeSidebarCollapsed(localStorage, Boolean(collapsed));
  if (!collapsed) {
    sidebar.classList.remove("narrow-hidden");
    mainPanel.classList.remove("narrow-full");
  }
  syncSidebarChrome();
}

function toggleSidebar() {
  if (isNarrow() && selectedRunId && !document.body.classList.contains("sidebar-collapsed")) {
    const hide = !sidebar.classList.contains("narrow-hidden");
    sidebar.classList.toggle("narrow-hidden", hide);
    mainPanel.classList.toggle("narrow-full", hide);
    syncSidebarChrome();
    return;
  }
  setSidebarCollapsed(!document.body.classList.contains("sidebar-collapsed"));
}

/**
 * 窄窗左栏让位（2026-09-18 回走 §2.3，判据在 `shouldYieldSidebar`）：
 * 视口窄于让位边界（=右列同一份预算）且有会话在开时，左栏默认收起。
 * - **不写用户偏好**（persist:false）：偏好是另一个键，窗口回到边界之上时按它恢复；
 * - 收起前要求左栏可见（`!sidebarIsHidden()`）：视口逼出来的那次收起只做一次，
 *   用户随后手动展开不与之打架；
 * - 左栏 width 在收起态量不到（display:none），所以记最近一次实测值兜底。
 */
let lastSidebarWidth = 280; // styles.css 的声明宽；可见时随实测更新
let sidebarYielded = false;

function syncSidebarYield() {
  const el = document.querySelector(".sidebar");
  const measured = sidebarIsHidden() || !el ? 0 : Math.round(el.getBoundingClientRect?.().width ?? 0);
  if (measured > 0) lastSidebarWidth = measured;
  const should = shouldYieldSidebar({
    viewportWidth: window.innerWidth,
    sidebarWidth: lastSidebarWidth,
    hasOpenConversation: Boolean(selectedRunId),
  });
  if (should && !sidebarYielded && !sidebarIsHidden()) {
    sidebarYielded = true;
    setSidebarCollapsed(true, { persist: false });
    return;
  }
  if (!should && sidebarYielded) {
    sidebarYielded = false;
    // 只把「视口逼出来的收起」还回去；用户此刻手动展开着就随他
    if (sidebarIsHidden()) setSidebarCollapsed(readSidebarCollapsed(localStorage), { persist: false });
  }
}

  if (e.key !== "b" && e.key !== "B") return;

  if (t instanceof HTMLElement && (t.closest("input, textarea, select, [contenteditable='true']"))) return;
  e.preventDefault();
  toggleSidebar();
});

function applyWorkspaceFace(next, { persist = true, refresh = true } = {}) {
  // T16：内部枚举值已改名 work；normalizeWorkspaceFace 同时认旧值 office
  // （localStorage 里用户上一次的偏好会回流）。认不出的一律当 code——与改名前
  // `next === "office" ? "office" : "code"` 的落点一致。
  const face = normalizeWorkspaceFace(next) ?? "code";
  const prev = workspaceFace;
  workspaceFace = face;
  if (persist) writePrefString(PREF_WORKSPACE_FACE, face);
  if (prev !== face && workdirSelect) {
    rememberWorkdirForFace(prev);
    paintWorkdirsForFace();
    restoreWorkdirForFace(face);
  }
  if (face === "work") {
    if (prev !== "work" && verifyToggle) {
      codeVerifyPref = verifyToggle.checked;
      verifyToggle.checked = false;
    }
    designModeActive = true;
    workCatalogOpen = false;
    if (prev !== "work") void ensureDesignDraftsWorkdir();
  } else {
    workCatalogOpen = false;
    designModeActive = false;
    if (prev === "work" && verifyToggle) verifyToggle.checked = codeVerifyPref;
  }
  if (packSelect && prev !== face) {
    const available = [...packSelect.options].map((o) => o.value);
    const nextPack = nextPackForWorkspaceFace(face, packSelect.value, available);
    if (nextPack !== packSelect.value) {
      packSelect.value = nextPack;
      if (face === "work" && autoPackToggle) autoPackToggle.checked = false;
      updatePackHint();
    }
  }
  syncWorkspaceFaceChrome();
  if (refresh) {
    refreshRunListView();
    syncComposer();
  }
  refreshWorkdirDependents();
}

function applyDesignTemplate(id, { toggle = false } = {}) {
  const next = !id ? null : (toggle && selectedDesignTemplate === id ? null : String(id));
  selectedDesignTemplate = next;
  if (!next) selectedDesignSample = null;
  const spec = next ? designTemplateById(next) : null;
  if (spec) {
    if (packSelect && [...packSelect.options].some((o) => o.value === "design")) {
      packSelect.value = "design";

    const cur = taskInput.value.trim();

    taskInput.value = "";
    syncWelcomeComposerField();

  const empty = document.querySelector(".empty-state--welcome");
  if (empty) paintEmptyState();
  paintDesignTemplateChip();
}

      runStates,
      currentFilter,

    currentQuery,

function refreshRunListView() {
  if (selectedRunId) {
    const tip = conversationTipId(runs, selectedRunId);
    if (tip && tip !== selectedRunId) {
      selectRun(tip);
      return;
    }
  }
  const filtered = getFilteredRuns();
  const metaMap = deriveRunListItems(filtered, runStates, unreadRuns);
  renderRunList(filtered, selectedRunId, selectRun, metaMap, deleteConversation, {
    collapsed: readCollapsedWorkdirGroups(),
    projects: availableProjects,
    onToggle: (key) => {
      toggleCollapsedWorkdirGroup(key);
      refreshRunListView();
    },
    onOpenArtifacts: (projectId) => navigateToArtifacts({ projectId }),
  });
  if (!selectedRunId) {
    paintEmptyState();
  }
  // 选中态、列表内容、run 状态三者任一变了底栏就可能换模式——这里是它们的汇合点
  syncComposer();
}

async function deleteConversation(runId) {
  if (!runId) return;
  const ok = window.confirm("删除这条对话？档案一并去掉，不能恢复。");
  if (!ok) return;
  const ids = conversationChainIds(runs, runId);
  for (const id of ids) {
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!res.ok && res.status !== 404) {
        const body = await res.json().catch(() => ({}));
        showSubmitError(humanizeActionFailure("删除", res.status, body.error));
        return;
      }
    } catch (err) {
      showSubmitError(`删除失败：${err.message ?? "网络错误"}`);
      return;
    }
  }
}

async function loadRuns() {
  try {
    const res = await fetch("/api/runs");
    if (!res.ok) return;
    runs = await res.json();
    maybeRepaintWorkdirsForFace();
    refreshRunListView();
    if (selectedRunId) syncAutoApprove(selectedRunId);

// ---- 选择运行 ----
function selectRun(runId, opts = {}) {
  if (selectedRunId === runId) return;
  selectedRunId = runId;
  syncSidebarYield();
  unreadRuns.delete(runId); // 看了就算读过
  refreshRunListView();

  // 拆成两件事：确保有 state、确保有订阅。旧实现在"已有 state"时直接 return，
  // 于是一个断过线的 run 被重新打开时永远不会重新订阅，界面就此定格。
  const state = ensureState(runId);
  if (!state) return;
  syncConnectionBanner();
  hydrateThreadAncestors(runId);
  renderDetailWithState(state);
  enterDetailMode();
  // 产物深链选中会话时不许 writeHash：它会关画布并清 pending，右侧变空白。
  if (!opts.keepHash) writeHash(runId, activeTabs.get(runId));
  announceStatus(`已选择运行：${state.task}`);
  ensureSubscription(runId);
  syncAutoApprove(runId);
  paintSpendSurfaces();
}

/** 谱系上的父 run 也要有事件流，对话才能按收官形态拼出来。 */
function hydrateThreadAncestors(tipId) {
  for (const id of ancestorRunIds(runs, tipId)) {
    if (id === tipId) continue;
    const st = ensureState(id);
    if (!st) continue;
    if ((st.timeline?.length ?? 0) === 0) ensureSubscription(id);
  }
}

function ensureState(runId) {
  const existing = runStates.get(runId);
  const info = runs.find((r) => r.runId === runId);
  if (existing) {
    let next = existing;
    if (info && existing.archived !== Boolean(info.archived)) {
      next = { ...next, archived: Boolean(info.archived) };
    }
    // 列表已收工：本地残留的 pending 是切会话幽灵卡，当场过期。
    if (info?.status === "done") {
      const leftover = (next.pendingApprovals ?? []).some((a) => a.status === "pending");
      if (next.status !== "done" || leftover) {
        next = expirePendingApprovals({ ...next, status: "done" });
      }
    }
    if (next !== existing) runStates.set(runId, next);
    return next;
  }
  if (!info) return null;
  const state = createInitialState(runId, info.task, info.verify, {
    archived: Boolean(info.archived),
    createdAt: info.createdAt,
  });
  if (info.status === "done") state.status = "done";
  runStates.set(runId, state);
  return state;
}

// 深链与刷新不丢位置：#/run/<id>/<face>；设置中心占 #/settings（T7）。
// 零依赖，不引路由库。
let suppressHashHandling = false;

function writeHash(runId, tab) {
  const next = runId ? `#/run/${runId}/${tab || "loop"}` : "#/";
  if (location.hash === next) return;
  suppressHashHandling = true;
  location.hash = next;
  // 程序化导航离开设置/定时任务/产物画布/指挥中心视图（writeHash 抑制了 hashchange，applyHash 不会替我们关）
  settingsApi?.close();
  schedulesApi?.close();
  boardApi?.close();
  artifactsApi?.close();
  usageApi?.close();
  artifactCanvasApi?.close();
  pendingArtifact = null;
  applyDocumentTabTitle(runId ? "run" : "home");
  // hashchange 是异步派发的，标志位要等它跑完再清
  setTimeout(() => { suppressHashHandling = false; }, 0);
}

/**
 * 七路路由：设置 / 定时任务 / 指挥中心 / 产物画廊 / 产物画布 / 会话详情 / 主视图。
 * 各独立视图的判定与对应 features/*.js 共用一条，不各写一份。
 * 产物画布（parseArtifactRoute）必须先于通用 `#/run/<id>/<tab>`——
 * 否则 "artifact/3" 会被 normalizeTab 吞成 loop。
 */
function parseRoute() {
  if (isSettingsRoute(location.hash || "")) return { kind: "settings" };
  if (isSchedulesRoute(location.hash || "")) return { kind: "schedules" };
  if (isCommandCenterRoute(location.hash || "")) return { kind: "board" };
  if (isArtifactsRoute(location.hash || "")) return { kind: "artifacts" };
  if (isUsageRoute(location.hash || "")) return { kind: "usage" };
  const artifact = parseArtifactRoute(location.hash || "");
  if (artifact) return { kind: "artifact", runId: artifact.runId, path: artifact.path, index: artifact.index, full: artifact.full };
  const m = /^#\/run\/([^/]+)(?:\/([^/?]+))?/.exec(location.hash || "");
  if (!m) return { kind: "home" };
  return { kind: "run", runId: decodeURIComponent(m[1]), tab: normalizeTab(m[2]) };
}

function applyHash() {
  const route = parseRoute();
  applyDocumentTabTitle(route.kind);
  if (route.kind === "settings") {
    schedulesApi?.close();
    boardApi?.close();
    artifactsApi?.close();
    usageApi?.close();
    settingsApi?.open();
    return;
  }
  if (route.kind === "schedules") {
    settingsApi?.close();
    boardApi?.close();
    artifactsApi?.close();
    usageApi?.close();
    schedulesApi?.open();
    return;
  }
  if (route.kind === "board") {
    settingsApi?.close();
    schedulesApi?.close();
    artifactsApi?.close();
    usageApi?.close();
    artifactCanvasApi?.close();
    pendingArtifact = null;
    void refreshUsageSpend();
    boardApi?.open();
    return;
  }
  if (route.kind === "artifacts") {
    settingsApi?.close();
    schedulesApi?.close();
    boardApi?.close();
    usageApi?.close();
    artifactCanvasApi?.close();
    pendingArtifact = null;
    artifactsApi?.open(artifactsFilter ?? currentArtifactsFilter());
    return;
  }
  if (route.kind === "usage") {
    settingsApi?.close();
    schedulesApi?.close();
    boardApi?.close();
    artifactsApi?.close();
    artifactCanvasApi?.close();
    pendingArtifact = null;
    usageApi?.open();
    return;
  }
  settingsApi?.close();
  schedulesApi?.close();
  boardApi?.close();
  artifactsApi?.close();
  usageApi?.close();
  if (route.kind === "artifact") {
    // 产物画布深链：先确保会话选中（selectRun 的 writeHash 会盖掉深链，随后恢复），
    // 产物清单就位后 openPendingArtifact 补开；state 还没流到产物时挂账等渲染。
    // full 跟随深链（?full = 放大态），刷新后形态不丢。
    pendingArtifact = { runId: route.runId, path: route.path, index: route.index, full: Boolean(route.full) };
    if (route.runId !== selectedRunId) {
      selectRun(route.runId, { keepHash: true });
      // 路径形态深链重写回地址时也要按路径写——route.index 在路径形态下是 null，
      // 拿它去 encode 会写成 artifact/0，把深链静默换成第 0 件。
      const ref = route.path !== null && route.path !== undefined ? { path: route.path } : route.index;
      const target = encodeArtifactHash(route.runId, ref, { full: Boolean(route.full) });
      if (location.hash !== target) {
        suppressHashHandling = true;
        location.hash = target;
        setTimeout(() => { suppressHashHandling = false; }, 0);
      }
    }
    openPendingArtifact();
    return;
  }
  artifactCanvasApi?.close();
  pendingArtifact = null;
  enteredCanvasFromApp = false;
  enteredSettingsFromApp = false;
  enteredSchedulesFromApp = false;
  enteredBoardFromApp = false;
  enteredArtifactsFromApp = false;
  if (route.kind === "home") {
    if (selectedRunId) backToList();
    return;
  }
  activeTabs.set(route.runId, route.tab);
  if (route.runId !== selectedRunId) {
    selectRun(route.runId);
  } else {
    const state = runStates.get(route.runId);
    if (state) renderDetailWithState(state);
  }
}

window.addEventListener("hashchange", () => {

  if (transcriptGroupingApi) {

  if (runId === selectedRunId) syncComposer();

/* —— 「本场改动」卡宿主侧（计划 3 · T6）——
 * 卡的事件派生侧在 app.js（收着 = 路径清单），展开侧在这里：取 git patch
 * 填进打开的文件体。两个缓存：patch 按 `${runId}:${path}:${lastSeq}`
 * （lastSeq 进 key：文件又被改过就重取，不拿旧 patch 充数）、git root 按 workdir。 */

/** runId:path:lastSeq → FilePatch（取不到的 null 也记，不反复打） */
const changeCardPatchCache = new Map();
/** workdir → git root（/api/workspace/git 的 root 字段；非 git 目录记 null） */
const changeCardGitRootCache = new Map();
/** runId:path:lastSeq 在飞请求——连着展开同一个文件只打一次 */
const changeCardInflight = new Map();

function changeCardWorkdirOf(runId) {
  const info = runs.find((r) => r.runId === runId) ?? null;
  return info?.workdir || currentWorkdir();
}

async function changeCardGitRoot(workdir) {
  if (!workdir) return null;
  if (changeCardGitRootCache.has(workdir)) return changeCardGitRootCache.get(workdir);
  const promise = (async () => {
    try {
      const res = await fetch(`/api/workspace/git?workdir=${encodeURIComponent(workdir)}`);
      const data = res.ok ? await res.json() : null;
      const root = data && typeof data.root === "string" ? data.root : null;
      changeCardGitRootCache.set(workdir, root);
      return root;
    } catch {
      changeCardGitRootCache.set(workdir, null);
      return null;
    }
  })();
  return promise;
}

async function fillChangeCardFile(runId, workdir, body) {
  const path = body.getAttribute("data-path") ?? "";
  const lastSeq = body.getAttribute("data-last-seq") ?? "";
  const key = `${runId}:${path}:${lastSeq}`;
  let promise = changeCardInflight.get(key);
  if (!promise && changeCardPatchCache.has(key)) {
    // 命中缓存：同步画，不用等微任务（重画后重开文件走这条路）
    body.innerHTML = renderPatchHunksHtml(changeCardPatchCache.get(key), { runId, path, lastSeq });
    return;
  }
  if (!promise) {
    promise = (async () => {
      const root = await changeCardGitRoot(workdir);
      // 契约 1：diff 端点要 root 相对路径。转换失败（逃出仓库 / 非 git）宁可
      // 取不到也不猜——猜错的基准会被服务端双检放行、静默取成另一个文件。
      const rel = root ? toRepoRootRelative(path, workdir, root) : null;
      if (!rel) {
        const patch = {
          present: false,
          path,
          note: root
            ? "这个路径换算不到仓库里，取不到补丁（改的路径照列）"
            : "这个目录不是 git 仓库，取不到补丁（改的路径照列）",
        };
        changeCardPatchCache.set(key, patch);
        return patch;
      }
      const patch = await fetchFilePatch(workdir, rel);
      changeCardPatchCache.set(key, patch);
      return patch;
    })().finally(() => { changeCardInflight.delete(key); });
    changeCardInflight.set(key, promise);
  }
  const patch = await promise;
  if (!body.isConnected) return;
  body.innerHTML = renderPatchHunksHtml(patch, { runId, path, lastSeq });
}

/** 把当前打开着的文件体填上 patch（渲染每轮都叫；已画的跳过，不重刷滚动） */
function paintChangeCardPatches(runId, workdir) {
  const host = document.querySelector("#main-area #conversation");
  if (!host || !runId) return;
  for (const body of host.querySelectorAll(".chat-change-file-body")) {
    if (body.childElementCount > 0 || String(body.textContent ?? "").trim()) continue;
    const fileEl = body.closest("details.chat-change-file");
    if (!fileEl || !fileEl.open) continue;
    void fillChangeCardFile(runId, workdir, body);
  }
}

function bindChangeCardHost() {
  const host = document.querySelector("#main-area #conversation");
  if (!host || host.__changeCardBound) return;
  host.__changeCardBound = true;
  // <details> 的 toggle 不冒泡——展开文件要在 capture 阶段才收得到
  host.addEventListener("toggle", handleChangeCardToggle, true);
  host.addEventListener("click", handleChangeCardClick);
}

/* —— 「改动」审阅面板宿主侧（计划 3 · T7）——
 * 右栏第三只面板：与卡**同一套** data-change-action 挂钩、同一套处理函数、
 * 同一份 renderPatchHunksHtml——只共享，不复制。面板与卡也共用已阅容器
 * reviewedAtSeq（失效语义自动一致）。 */

/** 卡片与面板共用的已阅回调（renderRunDetail 直接引用；rid 由按钮自带） */
function handleChangeCardReview(rid, path, lastSeq) {
  const key = rid || selectedRunId;
  if (!key || !path) return;
  const byPath = reviewedAtSeq.get(key) ?? new Map();
  byPath.set(path, Number(lastSeq) || 0);
  reviewedAtSeq.set(key, byPath);
  const next = runStates.get(key);
  if (next) renderDetailWithState(next);
}

/** 卡片与面板共用的撤掉回调：只写进输入框，不发送（逐字 buildRevertMessage） */
function handleChangeCardRevert(rid, path, header, added, deleted) {
  const msg = buildRevertMessage({
    path,
    header: header ?? "",
    added: Number(added) || 0,
    deleted: Number(deleted) || 0,
  });
  taskInput.value = msg;
  taskInput.dispatchEvent(new Event("input", { bubbles: true }));
  taskInput.focus();
  const len = msg.length;
  try { taskInput.setSelectionRange(len, len); } catch { /* 输入框不可选就随它去 */ }
}

/** capture 阶段收 <details class="chat-change-file"> 的 toggle（不冒泡）：展开才取 patch */
function handleChangeCardToggle(e) {
  const details = e.target instanceof Element ? e.target : null;
  if (!details || details.tagName !== "DETAILS" || !details.classList.contains("chat-change-file")) return;
  if (!details.open || !selectedRunId) return;
  const body = details.querySelector(":scope > .chat-change-file-body");
  if (body) void fillChangeCardFile(selectedRunId, changeCardWorkdirOf(selectedRunId), body);
}

/** 卡与面板共用的 click 委托：review / revert / next-hunk / open-review-panel */
function handleChangeCardClick(e) {
  const btn = e.target instanceof Element ? e.target.closest("[data-change-action]") : null;
  if (!btn || btn.disabled) return;
  const action = btn.dataset.changeAction;
  if (action === "review") {
    handleChangeCardReview(btn.dataset.runId, btn.dataset.path, btn.dataset.lastSeq);
    return;
  }
  if (action === "revert") {
    handleChangeCardRevert(btn.dataset.runId, btn.dataset.path, btn.dataset.header, btn.dataset.added, btn.dataset.deleted);
    return;
  }
  if (action === "next-hunk") {
    // 滚到下一个 hunk——这是"动一下"，不是导航，不改地址栏。
    // ★ data-hunk-idx 是**按文件**从 0 起的（renderPatchHunksHtml 每个文件体
    // 各调一次），所以必须把查找圈在按钮所属的那个文件里——按容器查的话，
    // 展开 ≥2 个文件时，点第二个文件的 hunk 0 会命中文档序第一个 idx=1
    // （第一个文件的 hunk 1），滚去别的文件（终审 I1）。
    const container = btn.closest(".right-rail-review") ?? btn.closest(".chat-change-card");
    const scope = btn.closest(".chat-change-file") ?? container;
    const hunks = scope ? [...scope.querySelectorAll(".chat-hunk")] : [];
    const cur = Number(btn.dataset.hunkIdx);
    const next = hunks.find((h) => Number(h.dataset.hunkIdx) === cur + 1);
    if (next) next.scrollIntoView({ behavior: "smooth", block: "nearest" });
    return;
  }
  if (action === "open-review-panel") {
    // 按钮在 summary 外（a11y：summary 里嵌按钮 = nested-interactive），
    // 点击本不会带开卡；留着 preventDefault 防将来按钮搬回头行里。
    e.preventDefault();
    showRailSurface({ surface: "review" });
    paintReviewPanel();
    return;
  }
  if (action === "switch-workdir") {
    e.preventDefault();
    void switchToRunWorkdir(btn.dataset.workdir ?? "");
  }
}

/**
 * T14「切换到这个目录」：把宿主当前工作目录切到这场运行自己的目录。
 *
 * 目录不在白名单里时**先按既有纪律登记**（POST /api/workdirs，仅 loopback），
 * 登记失败就照实说、不假装切过——界面刚因为"说假话"被点名，这里不能再造一句。
 */
async function switchToRunWorkdir(path) {
  const target = String(path ?? "").trim();
  if (!target || !workdirSelect) return;
  let list = harnessSnapshot?.availableWorkdirs ?? [];
  if (!list.some((d) => sameWorkdirPath(d, target))) {
    try {
      const res = await fetch("/api/workdirs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: target }),
      });
      const payload = await res.json().catch(() => null);
      if (!res.ok) {
        announceStatus(payload?.error || `切不过去：${target} 不在允许的工作目录里`);
        return;
      }
      list = Array.isArray(payload?.workdirs) ? payload.workdirs : [...list, target];
    } catch {
      announceStatus("切不过去：连不上宿主");
      return;
    }
  }
  if (harnessSnapshot) harnessSnapshot.availableWorkdirs = list;
  lastWorkdirFaceSig = "";
  paintWorkdirsForFace(list);
  // 这张脸的可见清单里若没有它（脸过滤），就把它补进本次选项——用户点的是
  // 「切到这场运行的目录」，不该被脸的默认过滤挡住
  const visible = workdirListForFace(list);
  const options = visible.some((d) => sameWorkdirPath(d, target)) ? visible : [...visible, target];
  applyWorkdirSelection(workdirSelect, options, { primary: target, extras: [] });
  writePrefString(PREF_WORKDIR, target);
  writePrefJson(PREF_WORKDIR_EXTRAS, []);
  syncProjectSelectToWorkdir();
  workdirComboboxApi?.paint();
  void workspaceGitChipApi?.refresh();
  refreshWorkdirDependents();
  announceStatus(`工作目录已切到 ${target}`);
  paintReviewPanel();
}

/** 把选中 run 的触碰文件画进面板槽（与对话里那张卡**同一份派生**，见下） */
function paintReviewPanel() {
  const slot = document.getElementById("right-rail-review");
  if (!slot) return;
  const runId = selectedRunId;
  if (!runId) {
    slot.innerHTML = "";
    slot.dataset.sig = "";
    return;
  }
  // ★ T14：范围必须与对话流一致。对话是整条谱系拼起来的（追问/回退/fork 各是
  // 一个 run），只读 tip 自己的 state 就会出现"卡说改了 12 个、面板说一个没碰"
  // ——审视报告问题 4 的原形。deriveThreadChatItems 末尾那张卡用的就是这一份。
  const files = deriveThreadTouchedFiles(runs, runStates, runId);
  const reviewed = reviewedAtSeq.get(runId);
  // 空态的第二种形态要按 **run 自己记下的工作目录**判，不是当前宿主目录
  const runWorkdir = runs.find((r) => r.runId === runId)?.workdir
    ?? runStates.get(runId)?.runConfig?.workdir
    ?? null;
  const hostWorkdir = currentWorkdir();
  // sig = 内容签名：没变就不重画——重画会把用户展开着的文件塌回去
  const sig = files.map((f) => `${f.path}:${f.edits}:${f.lastSeq}`).join("|") +
    "||" + (reviewed ? [...reviewed.entries()].map(([p, s]) => `${p}:${s}`).sort().join("|") : "") +
    "||" + String(runWorkdir ?? "") + "→" + String(hostWorkdir ?? "");
  if (slot.dataset.sig === sig) return;
  const openPaths = new Set();
  for (const details of slot.querySelectorAll("details.chat-change-file[open]")) {
    openPaths.add(details.dataset.path);
  }
  slot.innerHTML = renderReviewPanel(files, { runId, reviewed, runWorkdir, hostWorkdir });
  slot.dataset.sig = sig;
  // 保留用户在面板里展开着的文件（同一路径重开，patch 照旧）
  for (const details of slot.querySelectorAll("details.chat-change-file")) {
    if (openPaths.has(details.dataset.path)) details.open = true;
  }
  paintReviewPanelPatches();
}

/** 面板里当前打开着的文件体填上 patch（与 paintChangeCardPatches 同一时机） */
function paintReviewPanelPatches() {
  const slot = document.getElementById("right-rail-review");
  const runId = selectedRunId;
  if (!slot || !runId) return;
  for (const body of slot.querySelectorAll(".chat-change-file-body")) {
    if (body.childElementCount > 0 || String(body.textContent ?? "").trim()) continue;
    const fileEl = body.closest("details.chat-change-file");
    if (!fileEl || !fileEl.open) continue;
    void fillChangeCardFile(runId, changeCardWorkdirOf(runId), body);
  }
}

function bindReviewPanelHost() {
  const slot = document.getElementById("right-rail-review");
  if (!slot || slot.__reviewPanelBound) return;
  slot.__reviewPanelBound = true;
  slot.addEventListener("toggle", handleChangeCardToggle, true);
  slot.addEventListener("click", handleChangeCardClick);
  // 「改动」tab 点动唤回：事件流可能已经把内容带旧了，补一次重画（sig 没变就不动）
  document.addEventListener("review:reveal", () => paintReviewPanel());
}

// 面板槽是静态 DOM（不随 run 重建），启动时接一次
bindReviewPanelHost();

/**
 * 切换 Loop 面的读法。对话视图的正文按需拉——会话可达数 MB，没必要在
 * 用户根本没点开它的时候付这笔代价。
 */
function switchLoopView(runId, view) {
  loopViews.set(runId, view === "chat" ? "chat" : "events");
  const state = runStates.get(runId);
  if (state) renderDetailWithState(state);
  if (view === "chat" && !transcripts.has(runId)) void loadTranscript(runId);
}

async function loadTranscript(runId) {
  try {
    const res = await fetch(`/api/runs/${runId}/transcript`);
    if (!res.ok) return;
    transcripts.set(runId, await res.json());
    const state = runStates.get(runId);
    if (state && selectedRunId === runId) renderDetailWithState(state);
  } catch {
    // 拉不到就保持"正在载入会话…"，不伪造内容
  }
}

// run 结束时会话才落盘：若用户正停在对话视图上，收尾后自动补一次
function refreshTranscriptIfWatching(runId) {
  if (loopViews.get(runId) !== "chat") return;
  transcripts.delete(runId);
  void loadTranscript(runId);
}

/**
 * 底栏 composer 与当前选中态对齐。
 *
 * 这是**唯一**改写底栏 DOM 的入口——模式派生（deriveComposerMode）和 DOM
 * 应用（patchComposer）都在 app.js 里，所以"按钮该写什么、能不能点"这件事
 * 第一次变成可测的；这里只负责喂它当前的四个事实。
 *
 * 服务端算好的 canContinue 仍是权威（V-28：不能让用户点了才吃 409），
 * 只是现在"不能追加"不再表现为"没有输入框"，而是同一个框换个去向 + 说明原因。
 */
/** 人已经按了停止、run 还没落到 done。用来立刻改按钮，避免「点了像没点」。 */
const stoppingRuns = new Set();
/** 本页关掉的待复核条，按 run。刷新后还会再出现——那是新会话该看见的提醒。 */
const dismissedUnverified = new Set();
/**
 * 「本场改动」卡的已阅集合：runId → (路径 → 已阅时的 lastSeq)。
 * 已阅后重画卡靠的就是它进了 chatItemSig；文件再被改（lastSeq 涨了），旧记自动失效。
 */
const reviewedAtSeq = new Map();

function revealDecisionDock(runId) {
  selectRun(runId);
  const state = runStates.get(runId);
  const child = deriveChildAgents(state ?? {}).find((a) => a.pendingApprovals > 0);
  if (child) {
    selectedAgentByRun.set(runId, child.id);
    if (state) renderDetailWithState(state);
    return;
  }
  const dock = document.getElementById("action-dock");
  if (!dock) return;
  dock.classList.remove("action-dock--flash");
  void dock.offsetWidth;
  dock.classList.add("action-dock--flash");
}

function syncComposer() {
  const info = selectedRunId ? runs.find((r) => r.runId === selectedRunId) ?? null : null;
  if (info?.status === "done" && selectedRunId) stoppingRuns.delete(selectedRunId);
  const welcomeWorkdir = workdirSelect?.value && workdirSelect.value !== WORKDIR_ADD_VALUE
    ? workdirSelect.value
    : null;
  const selectedState = selectedRunId ? runStates.get(selectedRunId) : null;
  composerMode = deriveComposerMode({
    info: info ? { ...info, runId: selectedRunId } : null,
    localStatus: selectedState?.status ?? null,
    submitting,
    stopping: Boolean(selectedRunId && stoppingRuns.has(selectedRunId)),
    // 错误按 run 隔离：否则 run A 的 409 会原样挂在切过去的 run B 头上
    // 刚发生的错误压过 run 上挂着的旧错；两者都按各自的时机清，
    // 所以切到另一个 run 时不会看见上一个 run 的 409
    error: newRunError ?? (selectedRunId ? followUpErrors.get(selectedRunId) ?? null : null),
    workdir: welcomeWorkdir,
    draft: taskInput?.value ?? "",
    designMode: workspaceFace === "work",
    designTitle: designComposerTitle(),
    planMode: planModeToggle?.checked === true,
    delivery: selectedState
      ? deliveryFace(info?.stopReason ?? selectedState.stopReason, deriveArtifacts(selectedState))
      : null,
  });
  /**
   * 收尾后的「下一步」幽灵（三轮走查 A+B）。
   *
   * 用模型的提议换掉 placeholder——输入框空着时它就是那句灰问句，**按 Tab 落成
   * 可编辑的回复**。三个前提：会话**已结束**、输入框空着、不是提交中；任一不满足
   * 就把 `pendingNextSuggestion` 清掉（留着过期的那句比不显示更糟）。
   */
  pendingNextSuggestion = selectedState && selectedState.status !== "running"
      && composerMode.mode !== "submitting" && !(taskInput?.value ?? "").trim()
    ? deriveNextSuggestion(selectedState.completion)
    : null;
  if (pendingNextSuggestion) {
    composerMode.placeholder = pendingNextSuggestion.ask;
    // 幽灵用原生 placeholder（已是 text-3 最暗）；"怎么采纳"走 title，
    // 由 patchComposer 一处合成——发送快捷键不能被覆盖掉
    composerMode.tabHint = `按 Tab 采纳：${pendingNextSuggestion.reply}`;
  }
  // 两脸差异的唯一落点（方案 A · 计划 1）
  // 显式位暂为 null：脸切换控件写的就是 workspaceFace 本身，没有第二份来源，
  // 推断全由它驱动；显式位留给后续（如按会话存脸）接入。
  document.body.dataset.face = deriveFace({ face: null, workspace: workspaceFace });
  patchComposer(composerMode);
  // 能力条跟着 composer 走：换模型/换核查开关都发生在这儿，而输入框是全局的
  // （首页也在）——挂在 renderRunDetail 上会让首页一片空白（三轮走查活页抓到）
  // verify 一律以 composer 的开关为准：首页没有 run、selectedState 是 {}，
  // 真值是 verifyToggle.checked，不是 run 状态里的某个字段。
  patchCapabilityBar({ ...(selectedState ?? {}), verify: verifyToggle?.checked === true }, harnessSnapshot);
  paintPlanModeHint();
  workdirComboboxApi?.paint();
  void workspaceGitChipApi?.refresh();
  paintDesignTemplateChip();
  syncQueueChips();
  syncWelcomeComposerField();
}

// ---- 信息队列（运行中插队 / 排队）----
/**
 * 排队 chips 与事件重放同步。数据唯一来源是 runStates 里的 queuedMessages
 * （由 message_queued / message_queue_updated 长出）——这里不做任何本地增删，
 * 取消成功也以服务端推回的 message_queue_updated 为准，两处事实永不打架。
 */
function syncQueueChips() {
  const state = selectedRunId ? runStates.get(selectedRunId) : null;
  const html = renderQueueChips(state?.queuedMessages ?? [], {
    insertNow: composerMode?.mode === "running" && composerMode.kind === "steer",
  });
  queueChips.innerHTML = html;
  queueChips.hidden = !html;
}

/**
 * 运行中发消息：插队（下一轮模型调用前注入正史）或排队（本轮结束自动续跑）。
 * 服务端 202 = 已受理；消息何时生效由随后推来的 steering / user_message 事件宣告。
 */
async function postRunningMessage(qMode, textOverride) {
  const runId = composerMode?.runId;
  const text = String(textOverride ?? taskInput.value).trim();
  if (!runId) return false;
  if (!text) {
    announceStatus("先输入指令内容再发送");
    return false;
  }
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, mode: qMode }),
    });
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      showSubmitError(humanizeSubmitError(b, res.status));
      return false;
    }
    if (textOverride === undefined) {
      taskInput.value = "";
      clearUploads();
    }
    announceStatus(qMode === "steer" ? "已立即插入，将在下一轮模型调用前生效" : "已排队，本轮结束后自动发送");
    return true;
  } catch (err) {
    showSubmitError(`发送失败：${err.message ?? "网络错误"}`);
    return false;
  }
}

/** 胶囊上方：立即插入当前草稿，或把某条排队消息提升为插队 */
queueChips.addEventListener("click", (e) => {
  const insertNow = /** @type {HTMLElement|null} */ (e.target)?.closest?.("[data-insert-now]");
  if (insertNow) {
    void postRunningMessage("steer");
    return;
  }
  const promote = /** @type {HTMLElement|null} */ (e.target)?.closest?.("[data-steer-index]");
  if (promote && selectedRunId) {
    const state = runStates.get(selectedRunId);
    const queued = Array.isArray(state?.queuedMessages) ? state.queuedMessages : [];
    const text = String(queued[Number(promote.dataset.steerIndex)] ?? "").trim();
    if (text) {
      void postRunningMessage("steer", text).then((ok) => {
        if (ok) void cancelQueuedMessage(selectedRunId, Number(promote.dataset.steerIndex));
      });
    }
    return;
  }
  const btn = /** @type {HTMLElement|null} */ (e.target)?.closest?.(".queue-chip-cancel");
  if (!btn || !selectedRunId) return;
  void cancelQueuedMessage(selectedRunId, Number(btn.dataset.index));
});

async function cancelQueuedMessage(runId, index) {
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/queue`, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index }),
    });
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      showSubmitError(humanizeActionFailure("取消", res.status, b.error));
    }
    // 成功路径不本地改 chips：等服务端 message_queue_updated 推回来（唯一事实源）
  } catch (err) {
    showSubmitError(`取消失败：${err.message ?? "网络错误"}`);
  }
}

async function copyChatText(text) {
  const value = String(text ?? "");
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(value);
    else {
      const ta = document.createElement("textarea");
      ta.value = value;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    announceStatus("已复制");
  } catch {
    announceStatus("复制失败");
  }
}

async function rewindConversation(runId, seq) {
  if (!runId) return;
  const state = runStates.get(runId);
  const preview = deriveRewindFilePreview(state, seq);
  const choice = await askRewindChoice(preview);
  if (!choice) return;
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/rewind`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seq, revertFiles: choice === "files" }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      announceStatus(humanizeActionFailure("回退", res.status, body.error));
      return;
    }
    const payload = await res.json();
    const fork = mergeForkedFollowUp(runs, runId, payload, "");
    if (!fork) {
      announceStatus("回退未产生新对话");
      return;
    }
    runs = fork.runs;
    const merged = fork.summary;
    if (!runStates.has(fork.targetRunId)) {
      runStates.set(fork.targetRunId, createInitialState(fork.targetRunId, merged.task, Boolean(merged.verify), {
        createdAt: merged.createdAt,
      }));
    }
    activeTabs.set(fork.targetRunId, "loop");
    refreshRunListView();
    selectRun(fork.targetRunId);
    ensureSubscription(fork.targetRunId);
    announceStatus(choice === "files" ? "已回退对话和改动" : "已回退对话");
  } catch (err) {
    announceStatus(`回退失败：${err.message ?? "网络错误"}`);
  }
}

async function forkConversation(runId) {
  if (!runId) return;
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/fork`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      announceStatus(humanizeActionFailure("分叉", res.status, body.error));
      return;
    }
    const payload = await res.json();
    const fork = mergeForkedFollowUp(runs, runId, payload, "");
    if (!fork) {
      announceStatus("分叉未产生新对话");
      return;
    }
    runs = fork.runs;
    const merged = fork.summary;
    if (!runStates.has(fork.targetRunId)) {
      runStates.set(fork.targetRunId, createInitialState(fork.targetRunId, merged.task, Boolean(merged.verify), {
        createdAt: merged.createdAt,
      }));
    }
    activeTabs.set(fork.targetRunId, "loop");
    refreshRunListView();
    selectRun(fork.targetRunId);
    ensureSubscription(fork.targetRunId);
    announceStatus("已分出新对话");
  } catch (err) {
    announceStatus(`分叉失败：${err.message ?? "网络错误"}`);
  }
}

async function postFollowUp(runId, text, verify) {
  followUpErrors.delete(runId);
  try {
    const res = await fetch(`/api/runs/${runId}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // verify 是本轮的核查开关（会话中心化：核查逐轮可选，缺省沿用上一轮）
      body: JSON.stringify(buildFollowUpRequest({
        text,
        verify,
        autoApprove: autoApproveToggle?.checked === true,
        // 追问续的是对话。计划/并行旋钮只约束「新开一轮」；完成态 plan
        // 再带 planMode 会另起 planner，其 run_end 会拆掉还在跑的执行者。
        effort: effortSelect?.value,
        pack: packSelect?.value ?? "",
        autoPack: autoPackToggle?.checked === true,
        permissionMode: permissionModeSelect?.value || undefined,
        rubric: rubricInput?.value,
        projectId: selectedComposerProject()?.id,
        citedRunIds: selectedCiteIds,
      })),
    });
    if (!res.ok) {
      let body = null;
      try {
        body = await res.json();
      } catch { /* 非 JSON 响应体 */ }
      followUpErrors.set(runId, humanizeSubmitError(body, res.status));
      const st = runStates.get(runId);
      if (st) renderDetailWithState(st);
      return false;
    }
    const payload = await res.json().catch(() => ({ runId }));
    const nextRunId = typeof payload.runId === "string" ? payload.runId : runId;

    // 归档续跑返回的是派生子 run。父档案必须继续保持 done/只读，不能沿用
    // live 续跑那条“把原 run 改回 running”的本地乐观更新。
    const fork = mergeForkedFollowUp(runs, runId, payload, text);
    if (fork) {
      runs = fork.runs;
      const merged = fork.summary;

      if (!runStates.has(fork.targetRunId)) {
        runStates.set(fork.targetRunId, createInitialState(fork.targetRunId, merged.task, Boolean(merged.verify), {
          createdAt: merged.createdAt,
        }));
      }
      activeTabs.set(fork.targetRunId, "loop");
      refreshRunListView();
      selectRun(fork.targetRunId);
      ensureSubscription(fork.targetRunId);
      announceStatus("对话已接续");
      return true;
    }

    // run 从终态回到运行中：本地先置位再重订阅。事件流里的 user_message 会
    // 把状态坐实，reduceEvents 的 seq 闸门保证重放不产生重复条目
    const st = runStates.get(runId);
    if (st) runStates.set(runId, { ...st, status: "running", runEnd: null });
    const info = runs.find((r) => r.runId === runId);
    if (info) Object.assign(info, payload.run ?? {}, { status: "running" });
    transcripts.delete(runId);
    refreshRunListView();
    ensureSubscription(runId);
    syncAutoApprove(runId);
    const cur = runStates.get(runId);
    if (cur) renderDetailWithState(cur);
    return true;
  } catch (err) {
    followUpErrors.set(runId, `追加失败：${err.message ?? "网络错误"}`);
    const st = runStates.get(runId);
    if (st) renderDetailWithState(st);
    return false;
  }
}

async function sendChatFeedback(runId, rating, excerpt) {
  const text = buildChatFeedbackMessage(rating, excerpt);
  if (!text || !runId) return;
  const info = runs.find((r) => r.runId === runId);
  const ok = info?.status === "running"
    ? await postRunningMessage("steer", text)
    : await postFollowUp(runId, text, runStates.get(runId)?.verify);
  if (ok) {
    announceStatus(rating === "up" ? "已告诉模型继续保持" : "已告诉模型重新调整");
  }
}

/**
 * 只读确认模型正文里的路径候选。不存在/越界时宿主回 exists=false，前端不报错、
 * 不造链接；这不是一次用户操作，只是把“看起来像路径”变成“确实存在”的链接。
 *
 * 缓存（走查 UX-D1）：每次重渲染两处 hydration 都会为新节点探测一次，流式下
 * 每批事件 3 条 POST。同一 (runId, path) 在 TTL 内复用结果；TTL 过了重探。
 */
const pathInspectCache = createPathInspectCache();
async function inspectRunPaths(runId, paths) {
  const candidates = [...new Set((paths ?? []).map((p) => String(p ?? "").trim()).filter(Boolean))]
    .slice(0, 64);
  if (candidates.length === 0) return [];
  const resolved = new Map();
  const missing = [];
  for (const p of candidates) {
    const hit = pathInspectCache.get(runId, p);
    if (hit) resolved.set(p, hit);
    else missing.push(p);
  }
  if (missing.length > 0) {
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/paths/inspect`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paths: missing }),
      });
      if (res.ok) {
        const body = await res.json();
        for (const item of Array.isArray(body.paths) ? body.paths : []) {
          const input = String(item?.input ?? "");
          if (!input) continue;
          pathInspectCache.set(runId, input, item);
          resolved.set(input, item);
        }
      }
    } catch {
      /* 路径链接是渐进增强：宿主不可达时正文仍完整可读 */
    }
  }
  return candidates.map((p) => resolved.get(p)).filter(Boolean);
}

/** /api/harness 是否已经落定（成功、非 2xx、抛错都算落定）。
    未落定时树说「正在确认目录…」——不能把「还没问过」说成「确实没有」。 */
let harnessSettled = false;
/** GET /api/im 公开快照。只认 feishuInbound，不含密钥。 */
let imSnapshot = /** @type {{feishuInbound?: boolean}|null} */ (null);
/** GET /api/workspace/git/pr 的 ready。没令牌 / 不可开 → 不画「开成 PR」。 */

/** @type {{models: any[], roles: any, context?: any}|null} */

let executorModelSwitchBusy = false;
/** @type {ReturnType<typeof initExecutorModelPicker>|null} */
let executorModelPickerApi = null;

async function switchExecutorModel(nextId) {
  if (!nextId || executorModelSwitchBusy) return;
  if (modelsSnapshot?.roles?.executor === nextId) return;
  const prevId = modelsSnapshot?.roles?.executor ?? "";
  const select = document.getElementById("executor-model-select");
  executorModelSwitchBusy = true;
  executorModelPickerApi?.setDisabled(true);
  try {
    const res = await fetch("/api/models/roles", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ executor: nextId }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      if (select) select.value = prevId;
      executorModelPickerApi?.setPayload(modelsSnapshot);
      showSubmitError(humanizeActionFailure("切换模型", res.status, data?.error));
      return;
    }
    modelsSnapshot = data;
    executorModelPickerApi?.setPayload(data);
    await loadHarness();
    const win = data?.context;
    if (win?.window != null) {
      const k = win.window >= 1000 ? `${Math.floor(win.window / 1000)}k` : String(win.window);
      announceStatus(`已切换执行模型；窗口 ${k}（${win.windowSource ?? "unknown"}）`);
    } else {
      announceStatus("已切换执行模型；窗口未知——水位回落默认，撞 400 后会学到");
    }
  } catch {
    if (select) select.value = prevId;
    executorModelPickerApi?.setPayload(modelsSnapshot);
    showSubmitError("切换模型请求未能发出");
  } finally {
    executorModelSwitchBusy = false;
    syncComposer();
  }
}
