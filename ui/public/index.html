// ---- P1 右列空间契约 ----
/**
 * 右列是唯一 owner：文件树与预览坞都是它的面板。
 *
 * 这里只做三件事：读一份记忆 → 把 railPolicy 算出来的结果落在 data-* 与 CSS 变量上
 * → 在用户动作（切面板/收起/拖宽）后写回记忆。**没有断点常量**：边界由
 * railPolicy 按预算算（见 core/rail-policy.js 与 spec §4.1.3）。
 *
 * 顺带解掉两个老问题：文件树此前零 @media（永远不响应），预览坞另有一套 900 断点。
 *
 * 写成自包含（不闭包任何后声明的模块变量）：侧栏初始化在本文件很靠前的位置就会
 * 调用它，若闭包了后面声明的 const 会撞 TDZ。
 */
function railElement() {
  return document.getElementById("right-rail");
}

/** 左栏占用：收起了就是 0，否则量真宽度（不硬编码 280，主题/缩放下会变） */
function railSidebarWidth() {
  const el = document.querySelector(".sidebar");
  if (sidebarIsHidden() || !el) return 0;
  return Math.round(el.getBoundingClientRect?.().width ?? 0);
}

/** 手动关：收偏好 + 清会话标记（窄档 sheet 三路关闭共用）。 */
function railClose() {
  railOpenedThisSession = false;
  saveRailPref({ collapsed: true });
}

/** 手动开：清收起偏好 + 记会话标记（把手/细条展开键/切面板共用）。 */
function railOpen() {
  railOpenedThisSession = true;
  saveRailPref({ collapsed: false });
}

/**
 * 坞里有没有可见内容。
 *
 * `railHasContent` 的另一半——单独提出来是因为 `railPolicy` 也要它：
 * split 档下"坞里没内容"就该让树吃满整列（否则坞一收起，那条预览列
 * 会留下一道空缝，而「收起预览」键的效果就看不见了）。
 * **一条判据一处写**：railHasContent 也走它，两处不许各写一份。
 */
function railPreviewHasContent() {
  const host = document.getElementById("right-rail-preview");
  if (!host) return false;
  return [...host.children].some((el) => !el.hidden);
}

/** 右列有没有可看的内容：树非空 ∪ 预览坞里有可见内容。 */
function railHasContent() {
  if (railTreeEntryCount !== null && railTreeEntryCount > 0) return true;
  return railPreviewHasContent();
}

/** 当前该不该显示：纯函数 railVisibility 的宿主适配层（上下文/内容/档位在这拼）。 */
function railVisibilityNow() {
  const pref = readRailPref(window.localStorage);
  const mode = railPolicy({
    viewportWidth: window.innerWidth,
    sidebarWidth: railSidebarWidth(),
    preferredFraction: pref.fraction,
    surface: pref.surface,
    collapsed: false,
    hasPreviewContent: railPreviewHasContent(),
  }).mode;
  const context = document.getElementById("main-panel")?.classList.contains("is-welcome")
    ? "welcome"
    : "conversation";
  return {
    pref,
    mode,
    context,
    vis: railVisibility({
      context,
      hasContent: railHasContent(),
      mode,
      userCollapsed: pref.collapsed,
      userOpenNow: railOpenedThisSession,
    }),
  };
}

/** 把算出来的契约落在 DOM 上。纯应用，不含判断。 */
function paintRightRail() {
  const rail = railElement();
  if (!rail) return;
  const { pref, context, vis } = railVisibilityNow();
  const p = railPolicy({
    viewportWidth: window.innerWidth,
    sidebarWidth: railSidebarWidth(),
    preferredFraction: pref.fraction,
    surface: pref.surface,
    collapsed: vis.collapsed, // 显示层收起态由内容驱动；pref.collapsed 仍是用户意图
    hasPreviewContent: railPreviewHasContent(),
  });
  rail.dataset.mode = p.mode;
  rail.dataset.layout = p.layout;
  rail.dataset.surface = pref.surface;
  rail.dataset.collapsed = String(p.collapsed);
  // 浮层的遮罩：floating 且打开时可见（点它 = railClose，见 bindRightRail）；
  // docked 占位列，没有遮罩。
  const railScrim = document.getElementById("right-rail-scrim");
  if (railScrim) railScrim.hidden = !(p.layout === "floating" && !p.collapsed);
  // 窄档把手：0 宽收起时全站唯一的重开入口（此前收起即断头路，走查实锤）。
  // 欢迎页的收起也收成 0 宽（styles.css：细条不占位才不会把中栏推离输入框的轴）——
  // 所以它同样要靠这把手上车。
  const railHandle = document.getElementById("right-rail-handle");
  if (railHandle) {
    railHandle.hidden = !(p.collapsed && (p.mode === "overlay" || context === "welcome"));
    railHandle.classList.toggle("right-rail-handle--badge", vis.badge);
  }
  rail.style.setProperty("--rail-width", `${p.railWidth}px`);
  /**
   * 「放大」的左伸量（走查 UX-B3）：坞挂在右列里，`position:absolute; inset:0`
   * 的最近定位祖先是右列——于是"放大"只填满右列自己（实测 239px，对话纹丝不动），
   * 而 CSS 注释与产品语义都写着"盖满整个主区"。要盖主区就得向左伸过对话列：
   * 两种档位右列都贴主区右缘，左伸量 = -(主区宽 - 右列宽)。
   */
  const availableWidth = Math.max(0, window.innerWidth - railSidebarWidth());
  rail.style.setProperty(
    "--rail-expand-inset",
    `${-Math.max(0, availableWidth - p.railWidth)}px`,
  );
  /**
   * 浮层让出**对话头部那条**（计划 4 · T5 修复轮）。
   *
   * 实测缺陷：`.right-rail[data-layout="floating"]` 原本 `top: 0` 起，浮满右半条，
   * 把对话头部那排召出钮整个盖住（1100 档每只键的 elementFromPoint 命中的都是
   * `div#right-rail`，page.click 超时）⇒ 窄档下「再点同一个键」点不到，
   * 与设计稿 §5 的四条关闭路径冲突。让位量 = 头部固定条（`.back-bar`，sticky）
   * 的下沿——它是 `var(--space-lg)` + 内容高，随字号/脸/窗口变 ⇒ **实测**，
   * 不写死数值（同 railSidebarWidth() 的做法）。
   * 相对 `#center-row` 量：浮层的包含块是它，而视口坐标里它未必从 y=0 起。
   * 占宽列是 flex 兄弟、与头部不重叠 ⇒ 那里写 0（.back-bar 的边框盒高与滚动
   * 位置无关，所以量一次长期有效）。
   */
  const headBar = document.querySelector("#main-area > .back-bar");
  const rowTop = document.getElementById("center-row")?.getBoundingClientRect().top ?? 0;
  const floatTop = (p.layout === "floating" && headBar)
    ? Math.max(0, Math.round(headBar.getBoundingClientRect().bottom - rowTop))
    : 0;
  rail.style.setProperty("--rail-float-top", `${floatTop}px`);
  // 对话地板设在 #center-row 上——**不能设在 rail 上**：rail 与 #main-area 是兄弟，
  // CSS 变量只向下继承，横向传不过去（第一版就错在这里，活页量出 computed=0px）。
  // 值取 CENTER_MIN_PX（地板本身，不是对话的实际宽）：只有 docked 从对话拿宽，
  // 才需要地板；floating 浮层不占位，地板撤掉。
  document.getElementById("center-row")?.style.setProperty(
    "--center-min",
    p.layout === "docked" ? `${CENTER_MIN_PX}px` : "0px",
  );
  // 召出钮在对话头部（app.js 的 .back-bar），不在 rail 子树里——必须从 document 找；
  // 「更多」不参与一次一只的互斥。
  for (const btn of document.querySelectorAll(".rail-surface-btn")) {
    if (btn.dataset.railSurface === "more") continue;
    btn.setAttribute("aria-pressed", String(btn.dataset.railSurface === pref.surface));
  }
  const btn = rail.querySelector("#right-rail-collapse");
  if (btn) {
    btn.setAttribute("aria-expanded", String(!p.collapsed));
    const label = p.collapsed ? "展开右列" : "收起右列";
    btn.setAttribute("aria-label", label);
    btn.setAttribute("title", label);
    // 细条上的角标：宽档手动收起后有新内容，提示"里面有东西"
    btn.classList.toggle("right-rail-badge", vis.badge);
  }
  // 可聚焦的 separator 是 window splitter：必须报当前值，否则 axe 判 critical。
  // 顺带让读屏用户听得到宽度（键盘 ±2% 改的就是它）。
  const dragEl = rail.querySelector("#right-rail-drag");
  if (dragEl) {
    dragEl.setAttribute("aria-valuenow", String(Math.round(pref.fraction * 100)));
    dragEl.setAttribute("aria-valuetext", `右列占主区 ${Math.round(pref.fraction * 100)}%`);
  }
}

/** 合并一份补丁进记忆并重绘。 */
function saveRailPref(patch) {
  const pref = readRailPref(window.localStorage);
  writeRailPref(window.localStorage, { ...pref, ...patch });
  paintRightRail();
}

/** 切到某个面。浮层（floating）下切面等于把抽屉拉出来（也算用户手动打开）。 */
function showRailSurface({ surface }) {
  railOpenedThisSession = true;
  saveRailPref({ surface, collapsed: false });
}

(function bindRightRail() {
  const rail = railElement();
  if (!rail) return;
  const pref0 = readRailPref(window.localStorage);
  rail.dataset.surface = pref0.surface;

  rail.addEventListener("click", (event) => {
    // 收起/展开（走查 UX-B2：此前这个键没有任何处理器，点了字节级零变化）。
    // 两档里语义不同（side 收成细条 / overlay 抽屉关着），由 railPolicy 解释。
    const collapseBtn = event.target.closest?.("#right-rail-collapse");
    if (collapseBtn) {
      // 开没开由内容驱动判（不是 pref.collapsed）：欢迎页/无内容时 pref 与显示层是两回事
      if (railVisibilityNow().vis.collapsed) railOpen();
      else railClose();
      return;
    }
  });

  // 召出钮行挂在对话头部的 .back-bar（app.js 拼的），在 rail 子树之外——
  // 委托必须挂在 #main-panel 上（覆盖头部与右列整片；任务 4 的 Q11）。
  const surfaceHost = document.getElementById("main-panel");
  surfaceHost?.addEventListener("click", (event) => {
    const item = event.target.closest?.(".rail-more-item");
    if (item) {
      closeRailMoreMenu();
      showRailSurface({ surface: item.dataset.railSurface });
      return;
    }
    const moreBtn = event.target.closest?.("#rail-surface-more");
    if (moreBtn) {
      toggleRailMoreMenu();
      return;
    }
    const btn = event.target.closest?.("[data-rail-surface]");
    if (!btn || btn.dataset.railSurface === "more") return;
    // 先关「更多」菜单再切面：不然点「预览」后菜单还悬在换了面的头上
    closeRailMoreMenu();
    const surface = btn.dataset.railSurface;
    if (surface === "terminal") {
      // 占位：宿主没有交互式终端端点。给话而不是 disabled——disabled 读屏会跳过。
      announceStatus("终端还没接——宿主没有交互式终端端点");
      return;
    }
    // 同键开/关：点的就是当前显示的那只面、且列开着 ⇒ 收起；异键（或同键
    // 但列收着）⇒ 开/换面——同一个键既能开也能关（计划 4 · T4 的承重交互）。
    // vis.collapsed 是显示层（内容驱动），pref.surface 是「当前面」——判据必须
    // 读当前面，不能是常量、也不能只看 collapsed。
    const now = railVisibilityNow();
    if (!now.vis.collapsed && now.pref.surface === surface) {
      railClose();
      return;
    }
    showRailSurface({ surface });
    // 走查 UX-B4/E14：坞收起后浮出钮不再占窗口右上角（与收起键打架），
    // 由「预览」钮广播唤回——坞只在真有内容时响应。
    if (surface === "preview") {
      document.dispatchEvent(new CustomEvent("preview:reveal"));
    }
    // T7：点「改动」钮唤回面板内容（事件流可能已把内容带旧，重画补一次）
    if (surface === "review") {
      document.dispatchEvent(new CustomEvent("review:reveal"));
    }
  });

  // 「更多」菜单：照 workspace-git 的 house 模式（原生 div + hidden +
  // 点外 mousedown 关闭 + Esc 关闭并还焦给触发钮）。
  function toggleRailMoreMenu() {
    const menu = document.getElementById("rail-more-menu");
    const trigger = document.getElementById("rail-surface-more");
    if (!menu || !trigger) return;
    menu.hidden = !menu.hidden;
    trigger.setAttribute("aria-expanded", String(!menu.hidden));
  }
  function closeRailMoreMenu() {
    const menu = document.getElementById("rail-more-menu");
    const trigger = document.getElementById("rail-surface-more");
    if (!menu) return;
    menu.hidden = true;
    trigger?.setAttribute("aria-expanded", "false");
  }
  document.addEventListener("mousedown", (event) => {
    const menu = document.getElementById("rail-more-menu");
    if (!menu || menu.hidden) return;
    const bar = document.querySelector(".rail-surface-bar");
    if (bar && bar.contains(event.target)) return;
    closeRailMoreMenu();
  });
  // ★ 菜单的 Esc 必须是 stopImmediatePropagation，不是 stopPropagation：右列还有一条
  //   Esc handler 也挂在 document 上（同节点）。普通 stopPropagation 拦不住同节点的
  //   监听器，两层会一起关（jsdom 实测：两个 handler 都开火）。菜单开着时 Esc 只关
  //   菜单这一层；菜单关掉后这里早退，这个键归还给右列那条。
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    const menu = document.getElementById("rail-more-menu");
    if (!menu || menu.hidden) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    closeRailMoreMenu();
    document.getElementById("rail-surface-more")?.focus();
  });

  // 坞（产物画布 / 文件预览）打开时把自己"抬"到前台：右列切到预览面。
  // 宽档按用户意图自动开；窄档永不自动展开（只更新角标）——不再强写偏好（R3）。
  rail.addEventListener("preview:open", () => {
    if (!railVisibilityNow().vis.collapsed) saveRailPref({ surface: "preview" });
    else paintRightRail();
  });

  /**
   * 坞里的**内容可见性**变了（开 / 收起 / 展开 / 关闭）→ 右列显示层要重算。
   *
   * `railHasContent()` 看「树非空 ∪ 坞里有可见内容」，而收起**不经过右列的
   * 任何交互**，不接这一条，内容驱动的收起态就不会重画——表现就是"点了收起，
   * 那条缝纹丝不动，跟没作用一样"。
   *
   * 与上面那条分开：`preview:open` 管的是"切右列面板"，这条只管"重算"。
   */
  rail.addEventListener("preview:content", () => paintRightRail());

  // 窄档 sheet 的另外两条关闭路径（遮罩点外 / Esc）。把手是 0 宽收起态唯一的重开入口。
  document.getElementById("right-rail-scrim")?.addEventListener("click", () => railClose());
  document.getElementById("right-rail-handle")?.addEventListener("click", () => railOpen());
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    const current = railElement();
    if (!current || current.dataset.layout !== "floating" || current.dataset.collapsed === "true") return;
    railClose();
  });

  const drag = rail.querySelector("#right-rail-drag");
  // 拖宽：宽度归右列管（坞自己那套在同宿主下已让位，见 preview-dock.js 的 railHosted）
  drag?.addEventListener("mousedown", (event) => {
    if (readRailPref(window.localStorage).collapsed) return;
    event.preventDefault();
    const available = Math.max(0, window.innerWidth - railSidebarWidth());
    if (available <= 0) return;
    const startX = event.clientX;
    const startWidth = Math.round(rail.getBoundingClientRect().width);
    let fraction = readRailPref(window.localStorage).fraction;
    rail.classList.add("right-rail--dragging");
    const onMove = (ev) => {
      fraction = clampRailFraction((startWidth + (startX - ev.clientX)) / available);
      rail.style.setProperty("--rail-width", `${Math.round(available * fraction)}px`);
    };
    const onUp = () => {
      rail.classList.remove("right-rail--dragging");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      saveRailPref({ fraction });
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  // 键盘也能调：聚焦柄之后左右箭头各 ±2%
  drag?.addEventListener("keydown", (event) => {
    const step = event.key === "ArrowLeft" ? 0.02 : event.key === "ArrowRight" ? -0.02 : 0;
    if (!step) return;
    event.preventDefault();
    saveRailPref({ fraction: clampRailFraction(readRailPref(window.localStorage).fraction + step), collapsed: false });
  });

  paintRightRail();
  /**
   * 一帧一次的重绘（拖窗口时每帧都会触发 resize）。
   *
   * **不能只用 `if (raf) return` 防抖**：rAF 在隐藏标签页 / 被遮挡时不触发
   * （本项目踩过同族一次：后台标签页里 rAF 停摆、界面永不更新），那次排队的
   * 回调永不落地，`raf` 就永远是"忙"——此后所有 resize 都被静默吞掉。
   * 2026-09-18 活页实测：面板被遮挡一次后，连派发合成 resize 都唤不醒重绘。
   * 兜底：排队超过 200ms 就重排（正常情况下一帧 ≈16ms，不会走到这条）。
   */
  let raf = 0;
  let rafAt = 0;
  const repaintNow = () => {
    syncSidebarYield();
    paintRightRail();
  };
  window.addEventListener("resize", () => {
    // 隐藏页（窗格被遮挡/标签页切走）rAF 不落地：别把活排进一个排不空的队列，
    // 直接算。2026-09-18 活页实测：面板一被遮挡，旧写法此后吞掉所有 resize。
    if (document.hidden) {
      repaintNow();
      return;
    }
    const now = performance.now();
    if (raf && now - rafAt < 200) return;
    rafAt = now;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      raf = 0;
      repaintNow();
    });
  });
  // 从隐藏回到可见：把隐藏期间错过的重绘补上（同一族：rAF 停摆期间的 resize 全积压）
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) repaintNow();
  });
})();

// ---- 主题选择（V-20）----
// 主题超过三项后，单按钮盲循环已经无法预判“下一次会变成什么”。改成显式菜单：
// 用户先看名称与用途再选；选择仍写入 localStorage，并由 head 脚本首帧恢复。
const THEME_KEY = "agent-ui-theme";
const THEME_META = {
  auto: { label: "跟随系统", icon: "ph-circle-half" },
  light: { label: "暖纸", icon: "ph-sun" },
  dark: { label: "暖炭", icon: "ph-moon" },
  graphite: { label: "石墨", icon: "ph-stack" },
  contrast: { label: "高对比", icon: "ph-circle-half-tilt" },
};

function currentTheme() {
  const explicit = document.documentElement.getAttribute("data-theme");
  return explicit && THEME_META[explicit] ? explicit : "auto";
}

function applyTheme(next) {
  const theme = THEME_META[next] ? next : "auto";
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  try {
    if (theme === "auto") localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, theme);
  } catch { /* 隐私模式下写入可能抛错，主题仍在本次会话内生效 */ }
  if (themeToggle) {
    const icon = themeToggle.querySelector("i");
    if (icon) icon.className = `ph ${THEME_META[theme].icon}`;
    themeToggle.setAttribute("aria-label", `选择配色主题（当前：${THEME_META[theme].label}）`);
  }
  for (const choice of themeChoices) {
    choice.setAttribute("aria-checked", String(choice.getAttribute("data-theme-choice") === theme));
  }
  // 设置视图若开着，主题 radio 跟着刷新（主题也可从侧栏菜单/命令面板改）
  settingsApi?.refresh?.();
}

function setThemeMenuOpen(open, focusSelected = false) {
  if (!themeMenu || !themeToggle) return;
  themeMenu.hidden = !open;
  themeToggle.setAttribute("aria-expanded", String(open));
  if (open && focusSelected) {
    const selected = /** @type {HTMLElement|null} */ (themeMenu.querySelector('[aria-checked="true"]'));
    const fallback = /** @type {HTMLElement|null} */ (themeMenu.querySelector("[data-theme-choice]"));
    (selected ?? fallback)?.focus();
  }
}

if (themeToggle) {
  applyTheme(currentTheme());
  themeToggle.addEventListener("click", () => {
    setThemeMenuOpen(themeToggle.getAttribute("aria-expanded") !== "true", true);
  });
}
if (themeMenu) {
  themeMenu.addEventListener("click", (event) => {
    const choice = event.target instanceof Element ? event.target.closest("[data-theme-choice]") : null;
    if (!choice) return;
    applyTheme(choice.getAttribute("data-theme-choice"));
    setThemeMenuOpen(false);
    themeToggle?.focus();
  });
  themeMenu.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      setThemeMenuOpen(false);
      themeToggle?.focus();
      return;
    }
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    event.preventDefault();
    const at = Math.max(0, themeChoices.indexOf(/** @type {HTMLButtonElement} */ (document.activeElement)));
    const step = event.key === "ArrowDown" ? 1 : -1;
    themeChoices[(at + step + themeChoices.length) % themeChoices.length]?.focus();
  });
}
document.addEventListener("click", (event) => {
  if (themePicker && !themePicker.contains(event.target)) setThemeMenuOpen(false);

/**
 * 浮层互斥（走查 UX-B4/E13）：命令面板/通知/记忆/全局搜索四块 z-60 浮层此前
 * 互不相斥——开着记忆点铃铛，通知开在它底下（看着像"点了没反应"）；各自还都
 * 挂了文档级 Esc，一次 Esc 连关两层。谁 open 之前先关其余。
 *
 * 做成"包装 open"而不是改四个模块：互斥是宿主的编排职责，模块保持互不知情；
 * 迟到的模块（搜索等是动态 import）注册一个挂一个。
 */
const floatingPanelApis = [];
function registerFloatingPanel(api) {
  if (api && typeof api.open === "function" && typeof api.close === "function") {
    const rawOpen = api.open.bind(api);
    api.open = function (...args) {
      for (const other of floatingPanelApis) {
        if (other !== api && other.isOpen?.()) other.close();
      }
      return rawOpen(...args);
    };
    floatingPanelApis.push(api);
  }
  return api;
}
/** 面板内部开面板前调它（走查 UX-B4/E13）：触发器由各模块自己绑，外部包 open 拦不到。 */
function closeOtherFloatingPanels(keep) {
  for (const api of floatingPanelApis) {
    if (api && api !== keep && api.isOpen?.()) api.close();
  }
}

} catch { /* 定时任务是增强项，初始化失败静默降级 */ }

// ---- 指挥中心（T11）----
// 与设置中心同一条纪律：静态 import（路由判定启动就要用 isCommandCenterRoute），
// 回调全部委托给本控制器已有函数，模块不反向 import 这里，保持单向依赖。
// 待决数据直读通知中心 store（getStore），不建第二份账本。
try {
  boardApi = initCommandCenterView({
    getRuns: () => runs,
    getRunState: (runId) => runStates.get(runId) ?? null,
    getDecisionItems: () => notificationsApi?.getStore?.()?.items ?? [],
    isStopping: (runId) => stoppingRuns.has(runId),
    getUsageReport: () => usageReportCache,
    getSelectedRunCost: () => selectedRunCost(),
    onOpenUsage: () => {
      navigateToSettings();
      settingsApi?.open("settings-usage");
    },
    onOpenBoard: () => navigateToBoard(),
    onCloseBoard: () => closeBoardRoute(),
    onOpenConversation: (runId) => selectRun(runId),
    // 待决定卡点击直达 action-dock：与通知中心同一个 reveal 回调
    onRevealDock: (runId) => revealDecisionDock(runId),
    onStopRun: (runId) => { void stopRun(runId); },
    onNewChat: () => newChatBtn?.click(),
    onAnnounce: (msg) => announceStatus(msg),
  });
  document.getElementById("home-spend")?.addEventListener("click", () => {
    navigateToSettings();
    settingsApi?.open("settings-usage");
  });
  import("./features/command-palette.js").then((palette) => {
    palette.registerPaletteCommand({
      id: "open-board",
      label: "指挥中心",
      hint: "按状态总览全部会话：待你决定 / 运行中 / 最近完成",
      icon: "ph-squares-four",
      run: () => navigateToBoard(),
    });
  }).catch(() => { /* 命令面板注册失败不影响指挥中心本体 */ });
} catch { /* 指挥中心是增强项，初始化失败静默降级 */ }

try {
  artifactsApi = initArtifactsView({
    getFilter: () => artifactsFilter ?? currentArtifactsFilter(),
    getHarnessSnapshot: () => harnessSnapshot,
    onOpenArtifacts: () => navigateToArtifacts(),
    onCloseArtifacts: () => closeArtifactsRoute(),
    onOpenArtifact: (card) => openGalleryArtifact(card),
    onNewArtifact: () => newChatBtn?.click(),
    onAnnounce: (msg) => announceStatus(msg),
  });
  import("./features/command-palette.js").then((palette) => {
    palette.registerPaletteCommand({
      id: "open-artifacts",
      label: "产物",
      hint: "查看当前项目的落地页、规格与画册",
      icon: "ph-folder-open",
      run: () => navigateToArtifacts(),
    });
  }).catch(() => { /* 命令面板注册失败不影响产物画廊 */ });
} catch { /* 产物画廊是增强项，初始化失败静默降级 */ }

// ---- 变更审查（T8）----
// 动态加载，失败不影响主流程。分区本体挂在对话详情右栏 rail（Progress / 产物
// 旁边）；「查看本次变更」命令的注册/注销由 syncChangesCommand 随选中态管理。
import("./features/changes-panel.js").then((changes) => {
  changesApi = changes.initChangesPanel({
    onAnnounce: (msg) => announceStatus(msg),
    // P4：展开一行时显示"改了哪几行"。数据来自 edit_file 的入参（字节精确的
    // old_string / new_string），所以**不需要磁盘上的旧版本**——那正是覆盖写场景
    // 拿不到的东西，拿不到时不显示，不编。
    getEditHunks: (path) => {
      if (!selectedRunId) return null;
      const st = runStates.get(selectedRunId);
      if (!st) return null;
      const want = String(path ?? "").split("\\").join("/");
      for (const [k, v] of editHunksFromTimeline(st)) if (k === want) return v;
      return null;
    },
  });
  // 模块就绪时可能已有选中会话（深链直达）：立刻补上挂载与命令注册
  if (selectedRunId) {
    const railBody = document.querySelector("#main-area .rail-body");
    if (railBody) changesApi.mount(railBody);
    changesApi.setRun(selectedRunId);
    changesApi.setKnownWrites?.(
      conversationArtifactFiles(selectedRunId).filter((f) => f && f.kind !== "upload"),
    );
  }
  syncChangesCommand();
}).catch(() => { /* 变更审查是增强项，加载失败静默降级 */ });

// ---- 阅读模式（T12）----
// 动态加载，失败不影响主流程。开关挂在对话详情顶栏（back-bar），后处理作用于
// #conversation；每次 renderDetailWithState 后由上方统一调 update()。
import("./features/reading-mode.js").then((reading) => {
  readingModeApi = reading.initReadingMode({
    onAnnounce: (msg) => announceStatus(msg),
  });
  // 模块就绪时可能已有选中会话（深链直达）：立刻补一次挂载与后处理
  if (selectedRunId) {
    readingModeApi.update(
      document.querySelector("#main-area .back-bar"),
      document.querySelector("#main-area #conversation"),
    );
  }
}).catch(() => { /* 阅读模式是增强项，加载失败静默降级 */ });

// ---- 同类型重复折叠成组（T18）----
// 与阅读模式同一条后处理链，排在它之后（见 renderDetailWithState 里的调用点）。
// 纯 DOM 变换，不动事件流与 transcript 格式；加载失败静默降级。
import("./features/transcript-grouping.js").then((grouping) => {
  transcriptGroupingApi = grouping.initTranscriptGrouping({
    onAnnounce: (msg) => announceStatus(msg),
  });
  if (selectedRunId) {
    transcriptGroupingApi.update(document.querySelector("#main-area #conversation"));
  }
}).catch(() => { /* 折叠成组是增强项，加载失败静默降级 */ });

// ---- 产物画布（T10）----
// 模块是静态 import（路由判定启动就要用 parseArtifactRoute），初始化失败不挡主流程。
// 回调全部委托给本控制器已有函数，模块不反向 import 这里，保持单向依赖。
// hash 路由归本控制器：画布只报「关闭」「切到第 N 个」，写完 hash 由 applyHash 绕回来。
// 「预览最近产物」命令不在这里注册——它随产物有无动态注册/注销（syncArtifactCommand）。
try {
  artifactCanvasApi = initArtifactCanvas({
    getRunId: () => selectedRunId,
    getArtifacts: () => (selectedRunId ? openedPreviewArtifacts(selectedRunId) : []),
    // P3：预览读不到时先回答「它写过没有」。三态——工作区既有文件会落回 unknown，
    // 不许把它们说成「还没写到磁盘」（它们本来就不该由本 run 写）。
    hasWrittenPath: (path) => {
      if (!selectedRunId) return undefined;
      const st = runStates.get(selectedRunId);
      if (!st) return undefined;
      const s = artifactWriteState(st, path);
      return s === "unknown" ? undefined : s === "written";
    },
    onClose: () => closeArtifactRoute(),
    onSwitch: (index) => {
      if (selectedRunId) {
        replaceArtifactHash(encodeArtifactHash(selectedRunId, artifactRefForIndex(selectedRunId, index), {
          full: artifactCanvasApi?.isExpanded() ?? false,
        }));
      }
    },
    onCloseTab: (index) => closePreviewTab(index),
    onExpandChange: (full) => {
      // 放大/还原反映到深链（?full），刷新保持形态。replace：不堆一层「上一次预览」。
      // 地址按路径写（T5）——下标形态会让放大态的 URL 随会话状态位移。
      if (!selectedRunId || !artifactCanvasApi) return;
      const target = encodeArtifactHash(selectedRunId, artifactRefForIndex(selectedRunId, artifactCanvasApi.currentIndex()), { full });
      if (location.hash !== target) replaceArtifactHash(target);
    },
    onReveal: (path) => {
      if (selectedRunId) revealArtifact(selectedRunId, path);
    },
    onOpenBrowser: (url) => {
      if (selectedRunId) openArtifactByPath(selectedRunId, url);
    },
    onAppendReview: (line) => {
      taskInput.value = appendReviewToInput(taskInput.value, line);
      taskInput.dispatchEvent(new Event("input", { bubbles: true }));
      taskInput.focus();
      taskInput.setSelectionRange(taskInput.value.length, taskInput.value.length);
      announceStatus("点评已写入输入框");
    },
    onAnnounce: (msg) => announceStatus(msg),
  });
  // 模块就绪时可能已有挂账的深链（loadRuns().then(applyHash) 在上方已跑过）
  openPendingArtifact();
  syncArtifactCommand();
  import("./features/command-palette.js").then((palette) => {
    palette.registerPaletteCommand({
      id: "open-web-preview",
      label: "打开网页",
      hint: "在右侧内置浏览器打开网址",
      icon: "ph-globe",
      run: () => {
        if (!selectedRunId) {
          announceStatus("先打开一场对话");
          return;
        }
        if (!artifactCanvasApi?.focusAddress()) announceStatus("预览还没就绪");
      },
    });
  }).catch(() => { /* 命令面板注册失败不影响画布 */ });
} catch { /* 产物画布是增强项，初始化失败静默降级 */ }

</script>

</body>
</html>
